<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>게임 여는 중…</title>
<style>
:root{--bg:#F1F3EF;--ink:#5B6770}
@media (prefers-color-scheme:dark){:root{--bg:#10151A;--ink:#95A2A8}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;text-align:center;padding:0 16px}
a{color:inherit}
</style>
</head>
<body>
<p>게임 여는 중…</p>
<script>
// 벙참 게임 실행 횟수 집계 후 게임으로 이동해요.
var PLAY_API = 'https://script.google.com/macros/s/AKfycbzXisupMarh0YLo_MRjdn168sImb2T5o-41QCaxfL_cv2ixmom2mSqEqwp8kHtcv8zTag/exec';
var GAMES = {
  'gorani-survival': 'https://gorani-survival.bababi.chatgpt.site/',
  'gorani-run': 'https://gorani-twieo-2026.bababi.chatgpt.site/',
  'mandu-defense': 'https://mandu-mayhem-play.bababi.chatgpt.site/',
  'yongwang-land': 'https://yongwang-land.bababi.chatgpt.site/',
  'frog': 'https://beotyeo-kkaegulssi-2026.bababi.chatgpt.site/',
  'ruru': 'https://urururu-ruru-play-2026.bababi.chatgpt.site/',
  'golf': '../golf/', 'gonake': '../gonake/', 'yongwang': '../yongwang/', 'ddomeok': '../ddomeok/',
  'muldae': '../muldae/', 'badukbung': '../badukbung/', 'siren': '../siren/', 'circus': '../circus/',
  'yutjabi': '../yutjabi/', 'hallin': '../hallin/', 'gostop': '../gostop/'
};
var id = new URLSearchParams(location.search).get('g') || '';
var to = Object.prototype.hasOwnProperty.call(GAMES, id) ? GAMES[id] : '../';
function go() { location.replace(to); }
function start() {
  if (PLAY_API && to !== '../') {
    try { fetch(PLAY_API + '?hit=' + encodeURIComponent(id), { mode: 'no-cors', keepalive: true }).catch(function () {}); } catch (e) {}
    setTimeout(go, 150);
  } else { go(); }
}
// 카톡·라인 안의 브라우저는 채팅방에 코드를 보내러 가는 순간 게임 화면이 닫혀서 대결 방이 사라져요.
// 그래서 휴대폰 기본 브라우저(크롬·사파리) 새 화면으로 옮겨서 열어요. 집계는 옮겨 연 쪽에서 한 번만 해요.
var ua = navigator.userAgent || '';
var kakao = /KAKAOTALK/i.test(ua), line = /\bLine\//.test(ua) && !/openExternalBrowser=1/.test(location.search);
if ((kakao || line) && to !== '../') {
  var msg = document.querySelector('p');
  msg.innerHTML = '브라우저에서 게임을 여는 중…<br><small>열리지 않으면 <a href="#" id="here">여기서 그냥 열기</a></small>';
  document.getElementById('here').onclick = function (e) { e.preventDefault(); start(); };
  if (kakao) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  else location.href = location.href + (location.search ? '&' : '?') + 'openExternalBrowser=1';
} else { start(); }
</script>
</body>
</html>
