<style>
:root{
  --bg:#170A33;--panel:#2A1560;--panel2:#3A1F7A;--line:rgba(255,255,255,.16);
  --ink:#FFF7FF;--muted:#CDBBF3;--pink:#FF4FA3;--cyan:#4FE3FF;--yellow:#FFD54A;--orange:#FF8A3D;--green:#5BE3A6;--red:#FF5A6E;
  --f:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--d:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:radial-gradient(140% 70% at 50% -10%,#4A1C96 0%,#2A0F5C 40%,var(--bg) 75%) fixed var(--bg)}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}
.screen{min-height:100dvh;max-width:540px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(36px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0;letter-spacing:.01em}
h2{font-size:26px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 .btn{font-size:15px;padding:12px 4px 11px}
.tier-fuse1{color:#FFB3DA}.tier-fuse2{color:#FFD54A}.tier-fuse3{color:#fff;background:linear-gradient(90deg,#FF4FA3,#C89BFF,#4FE3FF)!important}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.coll img{width:100%;aspect-ratio:1;object-fit:contain}
.coll [data-zoom]{cursor:zoom-in;border-radius:12px;transition:transform .12s}
.coll [data-zoom]:active{transform:scale(.92)}
.zoom{display:grid;place-items:center;background:radial-gradient(circle,#5B2BB0 0%,rgba(91,43,176,0) 70%);border-radius:20px}
.zoom img{width:min(72vw,300px);aspect-ratio:1;object-fit:contain;animation:zoomin .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes zoomin{from{transform:scale(.5);opacity:0}}
img.sil{filter:brightness(0) opacity(.42)}
.gen-h{font:400 17px var(--d);margin:6px 0 0;display:flex;justify-content:space-between;align-items:center}
.recipe{gap:6px;padding:8px 10px}
.auopt{border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.auopt .sw{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .15s}
.auopt .sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.auopt.on .sw{background:var(--pink)}.auopt.on .sw::after{transform:translateX(18px)}
.recipe.can{box-shadow:inset 0 0 0 2px var(--pink)}
.rc{display:grid;justify-items:center;width:58px;flex:none;gap:2px}
.rc img{width:46px;height:46px;object-fit:contain}
.rc small{font-size:10.5px;line-height:1.2;text-align:center;color:var(--muted);word-break:keep-all}
.rc small b{color:var(--ink)}
.recipe.alt{background:rgba(255,255,255,.035)}
.alt-tag{font-style:normal;font-size:10px;color:var(--cyan)}
.recipe .op{font:400 18px var(--d);color:var(--muted)}
.recipe .btn{margin-left:auto;line-height:1.2}
.fuse-stage{position:relative;height:190px;display:grid;place-items:center;overflow:hidden}
.fuse-stage img{position:absolute;width:110px;height:110px;object-fit:contain;top:40px}
.fuse-stage .fa{left:calc(50% - 150px);animation:fa 1.3s ease-in forwards}
.fuse-stage .fb{left:calc(50% + 40px);animation:fb 1.3s ease-in forwards}
@keyframes fa{60%{transform:translateX(60px) rotate(-12deg)}100%{transform:translateX(95px) scale(.4) rotate(-360deg);opacity:0}}
@keyframes fb{60%{transform:translateX(-60px) rotate(12deg)}100%{transform:translateX(-95px) scale(.4) rotate(360deg);opacity:0}}
.fuse-stage .flash{position:absolute;width:40px;height:40px;border-radius:50%;background:radial-gradient(#fff,rgba(255,255,255,0) 70%);opacity:0;animation:flash .5s 1.15s ease-out}
@keyframes flash{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(9)}}
.fuse-stage .fr{left:calc(50% - 55px);opacity:0;transform:scale(.3)}
.fuse-stage .fr.on{animation:frpop .6s cubic-bezier(.3,1.7,.5,1) forwards}
.fuse-stage .fr.fail{animation:frfail .7s ease-out forwards}
@keyframes frpop{to{opacity:1;transform:scale(1)}}
@keyframes frfail{0%{opacity:1;transform:scale(1)}30%{transform:translateX(-10px) rotate(-8deg)}60%{transform:translateX(10px) rotate(8deg)}100%{opacity:.25;transform:scale(.8) rotate(0);filter:grayscale(1)}}
.newtag{display:inline-block;background:var(--pink);color:#fff;font:400 13px var(--d);padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{appearance:none;border:0;border-radius:16px;padding:14px 14px 13px;font:400 18px/1.15 var(--d);color:#2A0E3F;background:var(--yellow);box-shadow:0 4px 0 #B8880A;cursor:pointer;touch-action:manipulation;transition:transform .08s ease,box-shadow .08s ease;text-align:center}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 #B8880A}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #A41F63}
.btn.pink:active:not([disabled]){box-shadow:0 1px 0 #A41F63}
.btn.cyan{background:var(--cyan);color:#06243A;box-shadow:0 4px 0 #1688A3}
.btn.cyan:active:not([disabled]){box-shadow:0 1px 0 #1688A3}
.btn.orange{background:var(--orange);color:#2B0F00;box-shadow:0 4px 0 #B04E0E}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--f);font-weight:700;font-size:15px}
.btn.ghost:active:not([disabled]){transform:translateY(1px);box-shadow:inset 0 0 0 1px var(--line)}
.btn.big{font-size:24px;padding:18px}
.btn[disabled]{filter:grayscale(.9) brightness(.65);cursor:not-allowed}
.btn small{display:block;font:600 12px/1.3 var(--f);opacity:.8;margin-top:3px}
.inp{width:100%;padding:14px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);font-size:18px;outline:none}
.inp:focus{border-color:var(--cyan)}
.code-inp{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:var(--d);font-size:26px}
.face{width:44px;height:44px;border-radius:50%;background:#fff center/86% no-repeat;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.face.s{width:30px;height:30px}
.face.l{width:64px;height:64px}
.chip{display:inline-block;font:700 11px/1 var(--f);padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.12)}
.money{font-family:var(--d);color:var(--yellow)}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px}
.tabs button{flex:1;border:0;border-radius:10px;padding:10px 4px;background:transparent;font-weight:800;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--ink)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{border:0;background:rgba(255,255,255,.1);border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}
/* 로그인 */
.hero{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 0 0 3px #FF86C3,0 0 30px rgba(255,79,163,.55);aspect-ratio:1/1;max-height:46dvh;align-self:center;width:min(100%,46dvh)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.charpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.charpick button{border:0;padding:4px;border-radius:14px;background:rgba(255,255,255,.08);cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:800}
.charpick button .face{width:100%;height:auto;aspect-ratio:1/1}
.charpick button.on{background:var(--pink);color:#fff}
/* 로비 */
.prof{display:flex;gap:12px;align-items:center}
.prof h2{font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(0,0,0,.25);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font:400 17px/1.2 var(--d);white-space:nowrap}
.stat span{font-size:12px;color:var(--muted)}
.ban{background:linear-gradient(90deg,#5B0F2C,#3A0B3A);border:1px solid #FF5A6E;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.ban b{font-family:var(--d);font-size:20px;color:#FF9AA8}
/* 랭킹·샵·어드민 표 */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
.li .grow{flex:1;min-width:0}
.li .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rk{width:26px;text-align:center;font-family:var(--d);font-size:18px;color:var(--muted)}
.li.me{box-shadow:inset 0 0 0 2px var(--cyan)}
.li .num{text-align:right;font-family:var(--d);font-size:16px;white-space:nowrap}
.li .num small{display:block;font:600 11px var(--f);color:var(--muted)}
.dex{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dex .face{width:100%;height:auto;aspect-ratio:1}
.dex span.no .face{filter:grayscale(1);opacity:.28}
.tier-hidden{color:#FFF;background:linear-gradient(90deg,#FF4FA3,#FFD54A,#4FE3FF)!important}
.q{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5B2BB0,#1E0B45);box-shadow:inset 0 0 0 2px #D4AF37;font:400 22px/1 var(--d);color:#FFD54A;text-shadow:0 0 8px rgba(255,213,74,.7)}
.tier-common{color:#9FE3C1}.tier-rare{color:#7CC7FF}.tier-epic{color:#E0A6FF}.tier-legend{color:#FFD54A}
.mini{padding:9px 10px;font-size:13px;border-radius:11px;box-shadow:0 3px 0 #B8880A}
.mini.ghost{box-shadow:inset 0 0 0 1px var(--line)}
/* 방 */
.roomcode{font:400 54px/1 var(--d);letter-spacing:.12em;text-align:center;color:var(--cyan);text-shadow:0 0 18px rgba(79,227,255,.6)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seat{border-radius:16px;background:rgba(255,255,255,.06);padding:12px;display:flex;gap:10px;align-items:center;min-height:68px}
.seat.empty{justify-content:center;color:var(--muted);border:1px dashed var(--line);background:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.dot.off{background:#777}
/* 게임 */
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:radial-gradient(120% 60% at 50% 0%,#3E1784,#170A33 70%)}
.g-hud{width:100%;max-width:560px;padding:8px 12px 4px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.g-time{font:400 30px/1 var(--d);min-width:62px;text-align:center;color:var(--yellow);text-shadow:0 0 12px rgba(255,213,74,.6)}
.g-time.paused{color:#8FF3FF;text-shadow:0 0 12px rgba(79,227,255,.6)}
.g-time.paused::after{content:'⏸';font-size:12px;vertical-align:top;margin-left:2px}
.g-time.refill{animation:refill .4s ease-out}
@keyframes refill{0%{transform:scale(1.5);color:#5BE3A6}100%{transform:scale(1)}}
.g-time.hurry{color:var(--red);text-shadow:0 0 12px rgba(255,90,110,.7)}
.g-bar{height:12px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.g-bar i{display:block;height:100%;width:100%;transform-origin:left center;background:linear-gradient(90deg,var(--pink),var(--yellow));will-change:transform}
.g-side{display:flex;gap:6px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);border-radius:999px;padding:6px 10px;font:400 16px/1 var(--d);white-space:nowrap}
.pill button{border:0;background:var(--yellow);color:#2A0E3F;border-radius:999px;padding:4px 7px;font:800 11px var(--f);cursor:pointer}
.g-sub{width:100%;max-width:560px;padding:2px 12px 4px;display:flex;gap:6px;align-items:center;min-height:30px}
.g-score{font:400 18px/1 var(--d);display:flex;gap:6px;align-items:center}
.g-score b{color:var(--cyan);font-size:24px}
.opps{position:absolute;right:10px;top:8px;z-index:2;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:60%;pointer-events:none}
.keep{position:relative;z-index:5;margin-left:auto;border:0;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);color:var(--ink);font:800 13px var(--f);cursor:pointer;white-space:nowrap;touch-action:manipulation}
.keep:active{transform:scale(.96)}
.keep[disabled]{opacity:.4}
.opp{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.3);border-radius:999px;padding:3px 9px 3px 3px;font:400 15px/1 var(--d)}
.opp.lead{box-shadow:0 0 0 2px var(--yellow)}
.opp .face{width:24px;height:24px}
.g-stage{position:relative;flex:1;width:100%;max-width:560px;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
.g-ctrl{width:100%;max-width:560px;display:grid;grid-template-columns:1.15fr 1.6fr;gap:10px;padding:8px 12px 12px}
.g-ctrl .btn{padding:16px 8px}
#btnGrab{font-size:30px}
#btnHit{font-size:17px;line-height:1.1;white-space:nowrap}
#btnHit .anger{display:block;font:800 12px var(--f);margin-top:4px;letter-spacing:.15em}
.hint{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);background:rgba(18,6,40,.86);border:1.5px solid rgba(127,239,255,.6);border-radius:18px;padding:10px 16px;font-size:13px;line-height:1.5;pointer-events:none;white-space:nowrap;transition:opacity .4s;display:grid;gap:2px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.hint b{font-family:var(--d);font-weight:400}
.hint .hand{display:inline-block;animation:drag 1.6s ease-in-out infinite}
@keyframes drag{0%,100%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
.hint i{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin:0 2px}
.count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:400 120px/1 var(--d);color:#fff;text-shadow:0 0 30px var(--pink),0 6px 0 #A41F63}
.count span{animation:pop .9s ease-out both}
@keyframes pop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
.bubble{position:absolute;left:50%;top:10px;display:flex;align-items:center;gap:8px;background:#fff;color:#2A0E3F;border-radius:18px;padding:7px 14px 7px 7px;font-weight:800;font-size:15px;box-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:none;max-width:92%;opacity:0;transform:translate(-50%,-12px) scale(.9);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);will-change:transform,opacity}
.bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
.bubble .face{width:36px;height:36px}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);font:400 46px/1 var(--d);color:#fff;text-shadow:0 0 20px var(--pink),0 5px 0 #A41F63;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .2s,transform .35s cubic-bezier(.3,1.7,.5,1)}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner.miss{color:#FFD9DE;text-shadow:0 0 18px var(--red),0 5px 0 #8A1328}
/* 주인(용왕) */
.owner{position:fixed;left:50%;bottom:22%;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;opacity:0;transform:translate(-50%,40px);transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1);width:min(92vw,420px)}
.owner.on{opacity:1;transform:translate(-50%,0)}
.owner .say{background:#fff;color:#2A0E3F;border-radius:18px;padding:12px 16px;font-weight:900;font-size:17px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.owner .face{width:110px;height:110px;box-shadow:0 0 0 4px var(--yellow),0 0 30px rgba(255,213,74,.6)}
.owner.angry .face{animation:shake .4s linear 3}
.owner .tag{font:400 14px var(--d);background:var(--yellow);color:#2A0E3F;padding:4px 10px;border-radius:999px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-4deg)}75%{transform:translateX(8px) rotate(4deg)}}
/* 모달·토스트 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,2,20,.66);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));animation:fade .18s ease-out}
.modal .sheet{width:100%;max-width:480px;background:linear-gradient(180deg,#341A72,#24104F);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow:auto;animation:up .26s cubic-bezier(.2,1.2,.4,1)}
@media (min-height:700px) and (min-width:600px){.modal{align-items:center}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pack{border:0;border-radius:18px;padding:14px 6px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;display:grid;gap:4px;justify-items:center}
.pack b{font:400 26px/1 var(--d)}
.pack .money{font-size:15px}
.pack em{font-style:normal;font-size:11px;font-weight:800;background:var(--pink);color:#fff;border-radius:999px;padding:3px 7px}
.pack:active{transform:scale(.97)}

const splitPath = p => p.split('/').filter(Boolean);

class LocalDB {
  constructor() {

  async init() {}

async function dailyCheck() {
  if (!me || me.lastDaily === todayKST()) return;
  const today = todayKST();
  const r = await txMe(cur => { if (cur.lastDaily === today) return undefined; cur.money = (cur.money || 0) + CFG.daily; cur.lastDaily = today; return cur; });
  if (r && r.committed) toast(`오늘의 ${won(CFG.daily)} 충전 완료! 💰`);
}
const banLeft = () => (me ? Math.max(0, (me.banUntil || 0) - db.now()) : 0);
const fmtLeft = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
// 인형은 dolls/{id}, 키캡·키링·클리커는 goods/{종류}/{id}에 개수로 저장해요
const invOf = (p, type) => (type === 'doll' ? (p && p.dolls) || {} : ((p && p.goods) || {})[type] || {});
const typeCount = (p, type) => Object.values(invOf(p, type)).reduce((a, b) => a + (b || 0), 0);
const typeValue = (p, type) => Object.entries(invOf(p, type)).reduce((a, [id, n]) => a + (n || 0) * priceOf(type, id), 0);
const dollCount = p => MTYPES.reduce((a, t) => a + typeCount(p, t), 0);
const dollValue = p => MTYPES.reduce((a, t) => a + typeValue(p, t), 0);
function addItem(c, type, id, n) {
  if (type === 'doll') { c.dolls = c.dolls || {}; c.dolls[id] = (c.dolls[id] || 0) + n; if (c.dolls[id] <= 0) delete c.dolls[id]; }
  else { c.goods = c.goods || {}; c.goods[type] = c.goods[type] || {}; c.goods[type][id] = (c.goods[type][id] || 0) + n; if (c.goods[type][id] <= 0) delete c.goods[type][id]; }
}
const itemImg = (type, id, cls = 'item') => `<img class="${cls}" src="${itemSrc(type, id)}" alt="${esc(CHAR(id).name)} ${MACH[type].unit}">`;
function machinePicker(sel, attr) {
  return `<div class="machines">${MTYPES.map(t => { const m = MACH[t];
    return `<button type="button" class="mach ${t === sel ? 'on' : ''}" data-${attr}="${t}" style="--neon:${m.neon};--neon2:${m.neon2}">
      <span class="mach-top">${m.name}</span><img src="${itemSrc(t, PREVIEW[t])}" alt=""><span class="mach-note">${m.note}</span></button>`; }).join('')}</div>`;
}
const PREVIEW = { doll: 'kkaegul', keycap: 'eomji', keyring: 'haetsal', clicker: 'mandu' };

let cur = 'boot';
function show(name) {
  cur = name;
  for (const s of document.querySelectorAll('body > section')) s.classList.add('hidden');
  const el = name === 'game' ? $('#game') : $('#s-' + name);
  el.classList.remove('hidden');
  document.body.classList.toggle('playing', name === 'game');
  if (name !== 'game') stopLoop();
  ({ login: renderLogin, lobby: renderLobby, room: renderRoom, shop: renderShop, rank: renderRank, admin: renderAdmin, fuse: renderFuse }[name] || (() => {}))();
  if (name !== 'game') window.scrollTo(0, 0);
}
let toastT = 0;
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }
function modal(html, bind) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`;
  const m = root.firstChild;
  const close = () => { root.innerHTML = ''; };
  m.addEventListener('click', e => { if (e.target === m && !m.dataset.lock) close(); });
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  bind && bind(m.firstChild, close, m);
  return close;
}
let ownerT = 0;
function owner(kind, ms = 2400) {
  const o = $('#owner');
  $('#ownerFace').style.backgroundImage = `url(${imgSrc(OWNER.id)})`;

}

async function sell(type, items) {
  let got = 0;
  const r = await txMe(c => {
    got = 0;
    const inv = invOf(c, type);
    for (const [id, n0] of Object.entries(items)) {
      const n = Math.min(n0, inv[id] || 0); if (n <= 0) continue;
      addItem(c, type, id, -n);
      got += n * priceOf(type, id);
    }
    if (!got) return undefined;
    c.money = (c.money || 0) + got; return c;
  });
  if (r && r.committed) { Sound.init(); Sound.play('coin'); toast(`${won(got)} 받았어요`); }
  renderShop();
}

let fuseOnlyCan = false;
function renderFuse() {
  if (!me) return show('login');

  const can = r => has(r.a) > 0 && has(r.b) > 0;
  const genName = { 1: '1세대 합성 (기본 + 기본)', 2: '2세대 합성 (합성 인형이 재료)', 3: '3세대 최종 합성 ★' };
  const rows = gen => RECIPES.filter(r => r.gen === gen && (!fuseOnlyCan || can(r))).map(r => `
    <div class="li recipe ${can(r) ? 'can' : ''}${r.alt ? ' alt' : ''}">

const AUTO = { newOnly: true, useHidden: false, keepOne: true };

// 지금 인벤토리로 자동 합성이 고를 레시피 목록 (낮은 세대부터)
function autoPick(inv, got, o) {
  const spare = id => (inv[id] || 0) - (o.keepOne && !FUSE[id] ? 1 : 0); // 기본 인형은 1개씩 남겨 두기
  return RECIPES.filter(r => {
    if (!o.useHidden && (HID[r.a] || HID[r.b])) return false;
    if (o.newOnly && got.has(r.id)) return false;
    if (r.a === r.b) return spare(r.a) >= 2;
    return spare(r.a) >= 1 && spare(r.b) >= 1;
  }).sort((x, y) => x.gen - y.gen);
}

async function runAutoFuse() {
  Sound.init();
  let log = [];
  const r = await txMe(c => {
    log = [];
    const inv = { ...(c.dolls || {}) }, got = collSet(c), opts = { ...AUTO };
    for (let guard = 0; guard < 400; guard++) {
      const pickList = autoPick(inv, got, opts);
      if (!pickList.length) break;
      const rc = pickList[0];
      const ok = isLucky() || Math.random() < fuseRate(rc);
      c.dex = c.dex || {}; c.dex[rc.a] = true; c.dex[rc.b] = true;
      if (ok) {
        addItem(c, 'doll', rc.a, -1); addItem(c, 'doll', rc.b, -1); addItem(c, 'doll', rc.id, 1);
        inv[rc.a]--; inv[rc.b]--; inv[rc.id] = (inv[rc.id] || 0) + 1;
        const isNew = !got.has(rc.id); got.add(rc.id); c.dex[rc.id] = true; c.fused = (c.fused || 0) + 1;
        log.push({ ok: true, id: rc.id, isNew });
      } else {
        const lost = Math.random() < 0.5 ? rc.a : rc.b;
        addItem(c, 'doll', lost, -1); inv[lost]--; c.fuseFail = (c.fuseFail || 0) + 1;
        log.push({ ok: false, id: rc.id, lost });
      }
    }
    return log.length ? c : undefined;
  });
  if (!r || !r.committed || !log.length) { toast('합성할 수 있는 조합이 없어요'); renderFuse(); return; }
  const okN = log.filter(x => x.ok).length, newIds = [...new Set(log.filter(x => x.ok && x.isNew).map(x => x.id))];
  const made = {}; log.filter(x => x.ok).forEach(x => { made[x.id] = (made[x.id] || 0) + 1; });
  const lost = {}; log.filter(x => !x.ok).forEach(x => { lost[x.lost] = (lost[x.lost] || 0) + 1; });
  Sound.play(okN ? 'win' : 'miss'); vib(okN ? [40, 40, 80] : 60);
  modal(`<h2 style="text-align:center">⚡ 자동 합성 끝!</h2>
    <p style="text-align:center" class="muted">${log.length}번 합성 · 성공 <b style="color:var(--green)">${okN}</b> · 실패 <b style="color:var(--red)">${log.length - okN}</b>${newIds.length ? ` · <b style="color:var(--yellow)">NEW ${newIds.length}종</b>` : ''}</p>
    ${okN ? `<b>만든 인형</b><div class="res-dolls">${Object.entries(made).map(([id, n], i) => `<span style="position:relative;display:inline-block">${itemImg('doll', id).replace('<img ', `<img style="animation-delay:${i * 60}ms" title="${esc(CHAR(id).name)}" `)}${newIds.includes(id) ? '<span class="newtag" style="position:absolute;left:-6px;top:-6px;font-size:10px;padding:1px 5px">N</span>' : ''}${n > 1 ? `<small style="position:absolute;right:-2px;bottom:-2px;font-weight:900">×${n}</small>` : ''}</span>`).join('')}</div>` : ''}
    ${Object.keys(lost).length ? `<p class="small muted">실패로 잃은 재료: ${Object.entries(lost).map(([id, n]) => `${esc(CHAR(id).name)} ${n}개`).join(', ')}</p>` : ''}
    <button class="btn pink" data-close>확인</button>`, (sh, close, m) => { m.dataset.lock = '1'; sh.querySelector('[data-close]').onclick = () => { close(); renderFuse(); }; });
}
async function doFuse(fid, ri = 0) {
  const F = FUSE[fid], f = { ...F, ...F.recipes[ri] };
  Sound.init();
  const firstTime = !collSet(me).has(fid);
  const ok = isLucky() || Math.random() < fuseRate(f);
  const lost = ok ? null : Math.random() < 0.5 ? f.a : f.b;
  const r = await txMe(c => {
    const d = c.dolls || {};
    if ((d[f.a] || 0) < 1 || (d[f.b] || 0) < 1) return undefined;
    c.dex = c.dex || {}; c.dex[f.a] = true; c.dex[f.b] = true;
    if (ok) { addItem(c, 'doll', f.a, -1); addItem(c, 'doll', f.b, -1); addItem(c, 'doll', fid, 1); c.dex[fid] = true; c.fused = (c.fused || 0) + 1; }
    else { addItem(c, 'doll', lost, -1); c.fuseFail = (c.fuseFail || 0) + 1; }
    return c;
  });
  if (!r || !r.committed) { toast('재료가 모자라요'); renderFuse(); return; }
  [0, 250, 500, 750, 1000].forEach((t, i) => setTimeout(() => Sound.tone(500 + i * 160, .08, 'square', .04), t));
  modal(`<div class="fuse-stage"><img class="fa" src="${itemSrc('doll', f.a)}" alt=""><img class="fb" src="${itemSrc('doll', f.b)}" alt=""><span class="flash"></span>
      <img class="fr" id="fuRes" src="${itemSrc('doll', ok ? fid : lost)}" alt=""></div>
    <h2 style="text-align:center" id="fuMsg">합성 중…</h2><p class="muted" style="text-align:center;min-height:1.4em" id="fuSub"></p>
    <div class="grid2"><button class="btn ghost" data-close>닫기</button><button class="btn pink" id="fuAgain" disabled>한 번 더</button></div>`, (s, close, m) => {
    m.dataset.lock = '1';
    s.querySelector('[data-close]').onclick = () => { close(); renderFuse(); };
    setTimeout(() => {
      const res = $('#fuRes', s);
      if (ok) {
        res.classList.add('on'); Sound.play('win'); vib([40, 40, 80]);
        $('#fuMsg', s).innerHTML = `${esc(f.name)}${firstTime ? '<span class="newtag">NEW!</span>' : ''}`;
        $('#fuSub', s).textContent = `합성 성공! ${say(fid, 'good')} · 판매가 ${won(f.price)}`;
      } else {
        res.classList.add('fail'); Sound.play('miss'); vib(60);
        $('#fuMsg', s).textContent = '펑! 합성 실패…';
        $('#fuSub', s).textContent = `${CHAR(lost).name} 인형이 사라졌어요. ${CHAR(lost === f.a ? f.b : f.a).name}은(는) 돌려받았어요.`;
      }
      const again = $('#fuAgain', s), d = me.dolls || {};
      again.disabled = !((d[f.a] || 0) > 0 && (d[f.b] || 0) > 0);
      again.onclick = () => { close(); doFuse(fid, ri); };
    }, 1400);
  });
}

const easeBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };

/* ── 조작: 드래그 · 키보드 ── */
(function controls() {
  const stage = $('#gStage');
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    Sound.init();
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId || !G.claw) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    const c = G.claw; if (c.st !== 'idle') return;
    c.tx = clamp(c.tx + dx / (G.u * 0.86) * 1.15, R * 0.6, W - R * 0.6);
    c.tz = clamp(c.tz - dy / (G.u * G.kz) * 0.8, R * 0.6, D - R * 0.6);
    if (Math.abs(dx) + Math.abs(dy) > 2) $('#gHint').style.opacity = 0;
  });
  const end = e => { if (drag && drag.id === e.pointerId) drag = null; };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  const keys = {};
  addEventListener('keydown', e => {
    if (cur !== 'game') return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); grab(); return; }
    if (e.key === 'h' || e.key === 'H') { hitMachine(); return; }
    if (e.key.startsWith('Arrow')) { e.preventDefault(); keys[e.key] = true; }
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  setInterval(() => {
    if (cur !== 'game' || !G.claw || G.claw.st !== 'idle') return;
    const c = G.claw, sp = 1.4;
    if (keys.ArrowLeft) c.tx = clamp(c.tx - sp, R * 0.6, W - R * 0.6);
    if (keys.ArrowRight) c.tx = clamp(c.tx + sp, R * 0.6, W - R * 0.6);
    if (keys.ArrowUp) c.tz = clamp(c.tz + sp, R * 0.6, D - R * 0.6);
    if (keys.ArrowDown) c.tz = clamp(c.tz - sp, R * 0.6, D - R * 0.6);
  }, 16);
  $('#btnGrab').addEventListener('click', () => { if ((me.credits || 0) <= 0 && G.phase !== 'over') openBuy(() => hudMoney()); else grab(); });
  $('#btnHit').addEventListener('click', hitMachine);
  $('#gKeep').addEventListener('click', keepAndLeave);
  $('#gBuy').addEventListener('click', () => openBuy(() => hudMoney()));
  $('#gSnd').addEventListener('click', () => { Sound.on = !Sound.on; localStorage.setItem('claw-mute', Sound.on ? '0' : '1'); $('#gSnd').textContent = Sound.on ? '🔊' : '🔇'; });
  $('#gSnd').textContent = Sound.on ? '🔊' : '🔇';
  document.addEventListener('visibilitychange', () => { if (!document.hidden && me) dailyCheck(); });
  setInterval(() => { if (me && !document.hidden) dailyCheck(); }, 60 * 1000); // 켜 둔 채 아침 6시가 지나도 1분 안에 충전
})();

/* ══════════ 새 버전 자동 반영 ══════════ */
// 휴대폰 브라우저가 예전 페이지를 기억하고 있으면 고친 내용이 안 보여요.
// 올릴 때마다 version.txt와 APP_VERSION을 같이 바꾸면, 예전 페이지는 새 버전을 알아채고 한 번 새로고침해요.
const APP_VERSION = '20261028-1832';
async function checkVersion() {
  try {
    const r = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (!v || v === APP_VERSION) return;
    if (G.running) return; // 판 하는 중에는 끊지 않아요
    if (sessionStorage.getItem('claw-reloaded') === v) return; // 같은 버전으로 계속 새로고침하지 않게
    sessionStorage.setItem('claw-reloaded', v);
    const u = new URL(location.href); u.searchParams.set('v', v);
    location.replace(u.toString());
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });
setInterval(checkVersion, 5 * 60 * 1000);

/* ══════════ 시작 ══════════ */
(async function boot() {
  checkVersion();
  const force = new URLSearchParams(location.search).get('local') === '1';
  const sprites = loadSprites();
  if (!force) {
    try { db = new FireDB(); await db.init(); }
    catch (e) { console.warn('Firebase 연결 실패, 이 기기 저장 모드로 바꿔요', e); db = null; }
  }
  if (!db) { db = new LocalDB(); await db.init(); }
  await sprites;
  const saved = localStorage.getItem('claw-code');
  if (saved) {
    const r = await login(saved).catch(() => null);
    if (r) return enter(saved, r.player, r.recharged);
    if (await isOldCode(saved)) { localStorage.removeItem('claw-code'); show('login'); resetNotice(); return; }
  }
  show('login');
})();

/* 벙참 뒤로가기 버튼 */
(function () {
  const a = $('#bungBack');
  a.addEventListener('click', e => {
    e.preventDefault();
    if (!confirm('게임을 나가서 게임 목록으로 돌아갈까요?')) return;
    if (room.code) leaveRoom();
    const r = document.referrer; let same = false; try { same = !!r && new URL(r).origin === location.origin; } catch (_) {}
    if (same && history.length > 1) { history.back(); return; }
    location.href = a.getAttribute('href');
  });
})();
