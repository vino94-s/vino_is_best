<style>
/* 레이아웃: 위 간판·계기판 → 가게 장면(셰프 준탁 + 손님 카운터) → 쟁반·재료 → 그릴·오븐·튀김기. 한 화면 세로 게임 */
:root{
  --cream:#FFF3DA;--paper:#FFFBF2;--red:#D33A31;--red-d:#9C2621;--teal:#1E8A84;--teal-d:#12605B;--navy:#24324D;
  --ink:#2B2220;--muted:#7A6A5E;--mustard:#F6B731;--mustard-d:#B9800E;--chrome:#D5DCE2;--good:#3B9B4F;--bad:#D33A31;
  --f:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--d:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--f);
  background-image:linear-gradient(45deg,rgba(43,34,32,.035) 25%,transparent 25%,transparent 75%,rgba(43,34,32,.035) 75%),linear-gradient(45deg,rgba(43,34,32,.035) 25%,transparent 25%,transparent 75%,rgba(43,34,32,.035) 75%);
  background-size:36px 36px;background-position:0 0,18px 18px}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
input,select,textarea{font-size:16px!important}
.hidden{display:none!important}
#defs{position:absolute;width:0;height:0;overflow:hidden}
.screen{min-height:100dvh;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(32px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0}
h2{font-size:24px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:14px}
.btn{appearance:none;border:3px solid var(--ink);border-radius:14px;padding:12px 12px 11px;font:400 18px/1.15 var(--d);background:var(--mustard);box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:center;transition:transform .07s ease,box-shadow .07s ease}
.btn small{display:block;font:600 11.5px/1.3 var(--f);opacity:.8;margin-top:3px}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red);color:#fff}.btn.teal{background:var(--teal);color:#fff}.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--paper);font:700 14px/1.2 var(--f)}
.btn.big{font-size:22px;padding:15px 12px 13px}
.btn.sm{font-size:14px;padding:8px 8px 7px;border-width:2px;box-shadow:0 3px 0 var(--ink);border-radius:10px}
.inp{width:100%;border:3px solid var(--ink);border-radius:12px;padding:11px 12px;background:#fff;outline:none}
.inp:focus{border-color:var(--teal)}
.inp.sm{padding:7px 9px;border-width:2px;border-radius:9px}
.code-inp{text-align:center;font:400 30px/1 var(--d)!important;letter-spacing:.2em;text-transform:uppercase}
.bigcode{font:400 46px/1 var(--d);letter-spacing:.14em;text-align:center;color:var(--red);background:#fff;border:3px dashed var(--red);border-radius:14px;padding:14px 6px}
.tabs{display:flex;gap:6px;background:rgba(43,34,32,.08);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;border-radius:9px;padding:9px 4px;background:transparent;font-weight:800;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.toprow{display:flex;align-items:center;gap:8px}
.toprow h2{flex:1;text-align:center}
.back{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:7px 10px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.face{width:40px;height:40px;border-radius:50%;background:#fff center/92% no-repeat;flex:none;border:2px solid var(--ink)}
.face.s{width:32px;height:32px}.face.l{width:58px;height:58px}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:8px 10px}
.li.me{background:#FFF0C2}
.li .rk{width:28px;text-align:center;font:400 18px/1 var(--d)}
.li .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{font-size:12px;color:var(--muted)}
.grow{flex:1;min-width:0}
.lvb{display:inline-block;font:400 11.5px/1 var(--d);background:var(--navy);color:#fff;border-radius:6px;padding:3px 6px;margin-left:4px;vertical-align:1px}
.money{font:400 18px/1 var(--d);color:var(--teal-d)}
.mode-note{text-align:center;font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:90;background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(43,34,32,.6);display:grid;place-items:center;padding:16px}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);width:min(100%,460px);max-height:92dvh;overflow:auto;padding:18px;display:grid;gap:12px}
.charpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.charpick button{border:2px solid transparent;background:#fff;border-radius:12px;padding:6px 2px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:700;cursor:pointer}
.charpick button.on{border-color:var(--red);background:#FFE7E2}
.charpick .face{width:44px;height:44px}
.hero{border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 5px 0 var(--ink);aspect-ratio:1/1;width:min(100%,46dvh);align-self:center}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat3 div{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:7px 4px;text-align:center;font-size:12px;color:var(--muted)}
.stat3 b{display:block;font:400 19px/1.1 var(--d);color:var(--ink);margin-top:2px}
.dot{position:absolute;top:-7px;right:-5px;background:var(--red);color:#fff;font:400 13px/1 var(--d);border-radius:99px;padding:4px 7px;border:2px solid var(--ink)}
.rel{position:relative}

/* ── 가게 장면 ── */
.scene{position:relative;height:250px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 4px 0 var(--ink);background:#9fd7ff}
.scene.mini{height:200px}
.scene .bg{position:absolute;inset:0;width:100%;height:100%}
.scene .sign{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;font:400 15px/1 var(--d);color:#fff;background:var(--red);border:2.5px solid var(--ink);border-radius:10px;padding:6px 11px 5px;white-space:nowrap;box-shadow:0 3px 0 var(--ink);max-width:92%;overflow:hidden;text-overflow:ellipsis}
.scene .sign.neon{background:#1C1430;color:#FFE27A;text-shadow:0 0 6px #FFB703,0 0 14px #FF7A00;border-color:#FFB703;box-shadow:0 0 12px rgba(255,183,3,.7)}
.counter{position:absolute;left:0;right:0;bottom:0;height:40px;z-index:4;border-top:3px solid var(--ink)}
.counter.lv1{background:linear-gradient(#E9EEF2,#AEB9C2);border-top-color:#59636B}
.counter.lv2{background:repeating-linear-gradient(90deg,#B9773D 0 34px,#A9692F 34px 36px)}
.counter.lv3{background:linear-gradient(#E6ECF0 0 7px,var(--teal) 7px)}
.counter.lv4{background:linear-gradient(#EEF2F4 0 7px,var(--red) 7px);}
.counter.lv4::after,.counter.lv5::after{content:"★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★";position:absolute;inset:12px 0 0;text-align:center;color:#FFF3DA;font-size:12px;letter-spacing:6px;white-space:nowrap;overflow:hidden}
.counter.lv5{background:linear-gradient(#F7D774 0 7px,#1C1430 7px)}
.counter.lv5::after{color:#F7D774}
.chefbox{position:absolute;left:0;bottom:28px;width:118px;z-index:3;display:grid;justify-items:center}
.chefbox .chefimg{width:118px;height:auto;display:block;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.chefbox.happy .chefimg{animation:hop .5s ease}
.bubble{position:absolute;bottom:100%;left:10px;margin-bottom:-6px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:4px 8px;font:400 13px/1.2 var(--d);white-space:nowrap;z-index:6;max-width:200px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:22px;top:100%;border:6px solid transparent;border-top-color:var(--ink)}
.bubble[hidden]{display:none}
.owner{position:absolute;left:112px;bottom:44px;z-index:3;display:grid;justify-items:center;gap:2px}
.owner .face{width:48px;height:48px}
.tag{font:400 11px/1 var(--d);background:var(--navy);color:#fff;border-radius:6px;padding:3px 6px;white-space:nowrap}
.seats{position:absolute;left:112px;right:6px;bottom:22px;top:38px;z-index:5;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:5px;align-items:end}
.seat{all:unset;box-sizing:border-box;position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;min-width:0}
.seat:focus-visible{outline:3px solid var(--mustard);border-radius:10px}
.seat .empty{margin-bottom:22px;font:400 12px/1 var(--d);color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.6);opacity:.8}
.cust{display:flex;flex-direction:column;align-items:center;width:100%;animation:walkin .45s cubic-bezier(.2,.8,.3,1.2)}
.cust.out{animation:walkout .4s ease forwards}
.ticket{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:3px 3px 4px;width:100%;max-width:96px;display:grid;justify-items:center;gap:1px;position:relative;margin-bottom:5px;box-shadow:0 2px 0 var(--ink)}
.ticket::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
.ticket .food{display:flex;align-items:flex-end;justify-content:center;gap:2px;min-height:30px}
.ticket .tname{font-size:9.5px;line-height:1.15;max-height:21px;line-height:10.5px;text-align:center;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.ticket .price{font:400 12px/1 var(--d);color:var(--red-d)}
.seat.ready .ticket{border-color:var(--good);box-shadow:0 0 0 3px #9BE3A8,0 2px 0 var(--ink)}
.who{position:relative;display:grid;justify-items:center}
.who img{width:64px;height:64px;margin-bottom:-6px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.who .body{display:none}
.cust.sr .who img{filter:drop-shadow(0 0 6px #FFE27A) drop-shadow(0 0 2px #fff)}
.srtag{position:absolute;top:-4px;left:-4px;z-index:3;font:400 10px/1 var(--d);background:linear-gradient(90deg,#FF4FA3,#F6B731);color:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:2px 4px;white-space:nowrap}
.cust.happy .who img{animation:hop .5s ease}
.cust.mad .who img{animation:shake .4s ease}
.pat{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);width:44px;height:7px;background:rgba(0,0,0,.35);border:1.5px solid var(--ink);border-radius:5px;overflow:hidden;z-index:6}
.pat i{display:block;height:100%;background:#5BD16E}
.pat.mid i{background:var(--mustard)}.pat.low i{background:#FF5A4E}
.ftag{position:absolute;top:-4px;right:-2px;z-index:3;font:400 10px/1 var(--d);background:#E64980;color:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:2px 4px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.float{position:absolute;left:50%;top:20%;transform:translateX(-50%);font:400 20px/1 var(--d);color:#FFE27A;-webkit-text-stroke:1px var(--ink);text-shadow:0 2px 0 var(--ink);pointer-events:none;animation:up 1.1s ease-out forwards;z-index:9;white-space:nowrap}
.float.x{color:#FF6B5E}
@keyframes up{to{transform:translate(-50%,-44px);opacity:0}}
@keyframes bob{50%{transform:translateY(-2px) rotate(-1deg)}}
@keyframes hop{30%{transform:translateY(-10px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
@keyframes shake{25%{transform:translateX(-4px) rotate(-6deg)}75%{transform:translateX(4px) rotate(6deg)}}
@keyframes walkin{from{transform:translateX(40px);opacity:0}}
@keyframes walkout{to{transform:translateX(40px);opacity:0}}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}94%{opacity:.35}96%{opacity:1}97%{opacity:.5}}
@keyframes twinkle{50%{opacity:.35}}
@keyframes flame{50%{transform:scaleY(1.25) translateY(-1px)}}
@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.7}100%{transform:translateY(-26px) scale(1.4);opacity:0}}
@keyframes bubble{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-10px);opacity:0}}
.flick{animation:flick 3.5s infinite}
.tw{animation:twinkle 1.6s ease-in-out infinite}
.tw2{animation:twinkle 1.6s ease-in-out .8s infinite}

/* ── 게임 화면 ── */
#game{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(20px,env(safe-area-inset-bottom));display:grid;gap:8px}
.hud{display:flex;gap:6px;align-items:center}
.hud .chip{background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;padding:5px 8px 4px;display:grid;line-height:1.05;min-width:0}
.hud .chip span{font-size:10.5px;color:var(--muted);font-weight:700}
.hud .chip b{font:400 17px/1.1 var(--d);white-space:nowrap}
.hud .chip.time{flex:1}
.hud .x{border:2.5px solid var(--ink);background:var(--paper);border-radius:10px;width:40px;height:40px;font:400 20px/1 var(--d);cursor:pointer;flex:none}
.timebar{height:8px;background:rgba(43,34,32,.12);border-radius:6px;overflow:hidden;margin-top:3px}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--mustard));width:100%}
.log{font-size:13px;min-height:1.3em;text-align:center;font-weight:700;color:var(--ink)}
.kitchen{display:grid;gap:8px}
.stations{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(3,minmax(0,1fr));gap:6px;align-items:start}
.stn{display:grid;gap:3px;min-width:0}
.cap{font:700 10.5px/1.15 var(--f);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap b{font:400 14px/1 var(--d);color:var(--red-d)}
#game .scene{height:232px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:9px;display:grid;gap:7px;align-content:start;min-width:0}
.panel h3{font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.panel h3 small{font:700 11.5px/1.2 var(--f);color:var(--muted);text-align:right}
.tray{height:104px;border:2.5px solid var(--ink);border-radius:12px;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:8px 8px 14px;
  background:repeating-linear-gradient(0deg,transparent 0 13px,rgba(211,58,49,.18) 13px 15px),repeating-linear-gradient(90deg,#FFF8E6 0 13px,rgba(211,58,49,.18) 13px 15px)}
.tray::before{content:"";position:absolute;left:10%;right:10%;bottom:6px;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.22),transparent 70%)}
.tray>svg{position:relative;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.tray .hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:400 15px/1.3 var(--d);text-align:center;padding:8px}
.ings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.ib{border:2.5px solid var(--ink);border-radius:11px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:4px 2px 5px;cursor:pointer;display:grid;justify-items:center;align-content:center;gap:1px;min-height:58px;font:400 13px/1.1 var(--d)}
.ib svg{width:34px;height:22px;display:block}
.ib small{font:700 9.5px/1.15 var(--f);color:var(--muted)}
.ib:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
.ib.start{background:#FFE8B0}.ib.act{background:var(--red);color:#fff}.ib.act small{color:#FFE1DC}.ib.trash{background:#EFE6DA}
.st{display:grid;gap:5px}
.st-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}
.grill{position:relative;height:66px;border:2.5px solid var(--ink);border-radius:10px;background:linear-gradient(#3D3836,#2A2523);display:flex;gap:4px;align-items:center;justify-content:center;padding:0 4px;overflow:hidden}
.grill::before{content:"";position:absolute;inset:6px 4px;background:repeating-linear-gradient(90deg,transparent 0 9px,#6E6763 9px 11px);opacity:.75}
.flames{position:absolute;left:0;right:0;bottom:-2px;height:14px;display:flex;justify-content:space-around}
.flames i{width:10px;height:14px;border-radius:50% 50% 30% 30%;background:radial-gradient(circle at 50% 80%,#FFE27A,#FF7A00 55%,transparent 70%);animation:flame .35s ease-in-out infinite;transform-origin:50% 100%}
.flames i:nth-child(2n){animation-delay:.17s}
.gs{position:relative;width:40px;height:46px;display:grid;place-items:center;z-index:1;border-radius:8px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18)}
.gs svg{width:38px;height:26px}
.gs .bar{position:absolute;left:3px;right:3px;bottom:0;height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.gs .bar i{display:block;height:100%;background:var(--mustard)}
.gs .stm{position:absolute;top:-2px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:rgba(255,255,255,.7);animation:steam 1.2s ease-out infinite}
.gs .stm.b{margin-left:4px;animation-delay:.6s}
.warm{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}

/* ══════════ 계정 (닉네임별 개인 코드) ══════════ */
let me = null, myCode = null, meOff = null, myCodeV = 1;
const emptyPlayer = (pid, nick, char) => ({ pid, nick, char, money: CFG.startMoney, stage: 1, own: {}, rating: 3, codeV: 1,
  rounds: 0, served: 0, best: 0, total: 0, likes: 0, createdAt: Date.now(), lastDaily: todayKST() });
async function newCode(pid, v = 1) {
  for (let i = 0; i < 20; i++) {
    const code = genCode();
    const r = await db.tx(PATH.acc(code), cur => (cur ? undefined : { pid, v, createdAt: Date.now() }));
    if (r.committed && r.value && r.value.pid === pid) return code;
  }
  throw new Error('코드를 만들지 못했어요. 다시 해 주세요');
}
async function register(nick, char) {
  if (!CH.includes(char)) char = CH[0];
  nick = String(nick || '').trim();
  if (nick.length < 2 || nick.length > 10) throw new Error('닉네임은 2~10글자로 해 주세요');
  const k = nickKey(nick);
  if (await db.get(PATH.nicks + '/' + k)) throw new Error('이미 있는 닉네임이에요');
  const pid = genCode(12, 'abcdefghijkmnopqrstuvwxyz0123456789');
  const r = await db.tx(PATH.nicks + '/' + k, cur => (cur ? undefined : pid));
  if (!r.committed || r.value !== pid) throw new Error('이미 있는 닉네임이에요');
  await db.set(PATH.player(pid), emptyPlayer(pid, nick, char));
  return newCode(pid, 1);
}
const withTimeout = (pr, ms = 10000) => Promise.race([pr, sleep(ms).then(() => { throw new Error('network'); })]);
async function login(code) {
  code = String(code || '').trim().toUpperCase();
  if (!/^[A-Z2-9]{6}$/.test(code)) return { err: '코드는 6자리예요' };
  const acc = await withTimeout(db.get(PATH.acc(code)));
  if (!acc || !acc.pid) return { err: '없는 코드예요' };
  const p = await withTimeout(db.get(PATH.player(acc.pid)));
  if (!p) return { err: '없는 코드예요' };
  if ((acc.v || 1) !== (p.codeV || 1)) return { err: '새 코드가 발급돼서 이 코드는 더 못 써요', replaced: true };
  if (p.blocked) return { err: '운영자가 정지한 코드예요. 운영자에게 물어봐 주세요' };
  return { player: p, code };
}
const CODE_KEY = 'burger-code';
function savedCode() {
  let c = null;
  try { c = localStorage.getItem(CODE_KEY); } catch (e) {}
  if (!c) { const m = document.cookie.match(/(?:^|;\s*)burger_code=([A-Z2-9]{6})/); if (m) c = m[1]; }
  return c && /^[A-Z2-9]{6}$/.test(c) ? c : null;
}
function saveCode(code) {
  try { localStorage.setItem(CODE_KEY, code); } catch (e) {}
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
  try { document.cookie = `burger_code=${code}; max-age=31536000; path=/; SameSite=Lax; Secure`; } catch (e) {}
}
function clearCode() {
  try { localStorage.removeItem(CODE_KEY); } catch (e) {}
  try { document.cookie = 'burger_code=; max-age=0; path=/; SameSite=Lax; Secure'; } catch (e) {}
}
function setMe(v) {
  if (!v) return;
  me = v; me.own = me.own || {};
  if (cur === 'lobby') renderLobby();
  if (cur === 'shop') renderShop();
  if (G && G.running) renderHud();
}
async function enter(code, player) {
  myCode = code; saveCode(code);
  me = player; me.own = me.own || {};
  myCodeV = me.codeV || 1;
  meOff && meOff();
  const pid = me.pid;
  meOff = db.on(PATH.player(pid), v => {
    if (!v) { confirmGone(pid); return; }
    if (v.blocked || (v.codeV || 1) !== myCodeV) { toast(v.blocked ? '운영자가 코드를 정지했어요' : '새 코드가 발급됐어요. 새 코드로 들어와 주세요', 3500); logout(); return; }
    setMe(v);
  });
  show('lobby');
  dailyCheck();
}
let goneT = 0;
function confirmGone(pid) {
  clearTimeout(goneT);
  goneT = setTimeout(async () => {
    if (!me || me.pid !== pid) return;
    let v; try { v = await withTimeout(db.get(PATH.player(pid))); } catch (e) { return; }
    if (v !== null || !me || me.pid !== pid) return;
    await sleep(3000);
    try { v = await withTimeout(db.get(PATH.player(pid))); } catch (e) { return; }
    if (v === null && me && me.pid === pid) { toast('계정이 삭제됐어요'); logout(); }
  }, 1500);
}
function logout() {
  meOff && meOff(); meOff = null; me = null; myCode = null;
  clearCode();
  if (G) { G.running = false; G = null; }
  show('login');
}
async function txMe(fn) {
  if (!me) return null;
  const r = await db.tx(PATH.player(me.pid), c => (c ? fn(c) : c));
  if (r.committed && r.value) setMe(r.value);
  return r;
}
async function dailyCheck() {
  if (!me) return;
  const today = todayKST();
  if (me.lastDaily === today) return;
  const r = await txMe(c => { if (c.lastDaily === today) return undefined; c.money = (c.money || 0) + CFG.daily; c.lastDaily = today; return c; }).catch(() => null);
  if (r && r.committed) { Sound.play('buy'); toast(`☀️ 오늘의 출근 보너스 ${usd(CFG.daily)}!`); }
}
const pruneDates = (o, keep) => { const ks = Object.keys(o || {}); if (ks.length > keep) ks.sort().slice(0, ks.length - keep).forEach(k => delete o[k]); };

let cur = 'boot', liveOff = null;
function show(name) {
  cur = name;
  if (liveOff) { liveOff(); liveOff = null; }
  for (const s of document.querySelectorAll('body > section')) s.classList.add('hidden');
  ($('#' + (name === 'game' ? 'game' : 's-' + name))).classList.remove('hidden');
  ({ login: renderLogin, lobby: renderLobby, shop: renderShop, friends: renderFriends, rank: renderRank, admin: renderAdmin }[name] || (() => {}))();
  window.scrollTo(0, 0);
}

  $('#frList').onclick = e => { const b = e.target.closest('[data-visit]'); if (b) openVisit(b.dataset.visit); };

async function addFriend(pid) {
  const t = Date.now();
  await txMe(c => { c.friends = c.friends || {}; if (c.friends[pid]) return undefined; c.friends[pid] = t; return c; });
  await db.tx(PATH.player(pid), c => { if (!c) return c; c.friends = c.friends || {}; if (c.friends[me.pid]) return undefined; c.friends[me.pid] = t; return c; });
  toast('친구가 됐어요! 🤝');
}
async function removeFriend(pid) {
  await txMe(c => { if (!c.friends || !c.friends[pid]) return undefined; delete c.friends[pid]; return c; });
  await db.tx(PATH.player(pid), c => { if (!c || !c.friends || !c.friends[me.pid]) return undefined; delete c.friends[me.pid]; return c; });
}

  $('#vsBack').onclick = () => show(mine ? 'lobby' : me ? 'friends' : 'rank');

    seat.innerHTML = `<div class="seat"><div class="cust"><div class="ticket" style="padding:5px 6px"><div class="tname" style="font-size:11px">${visitedToday ? '또 왔어요~' : '놀러왔어요!'}</div></div><div class="who"><img src="${imgOf(me.char)}" alt=""><div class="body" style="--c:#E64980"></div></div></div></div>`;
    chefSay(sc, pick([`어서오세요 ${me.nick}님!`, '놀러오셨네! 버거 한 입?', '네 손님! Alright!']), 2600);

async function visitHello(p) {
  const today = todayKST(), B = CFG.visitBonus;
  let full = false;
  const r = await txMe(c => {
    c.vis = c.vis || {}; const d = c.vis[today] = c.vis[today] || {};
    if (d[p.pid]) return undefined;
    if (Object.keys(d).length >= CFG.visitMax) { full = true; return undefined; }
    d[p.pid] = 1; c.money = (c.money || 0) + B; pruneDates(c.vis, 3); return c;
  }).catch(() => null);
  if (!r || !r.committed) { toast(full ? `오늘은 ${CFG.visitMax}곳까지 인사했어요. 내일 또!` : '이미 인사했거나 연결이 불안정해요'); return; }
  await db.tx(PATH.player(p.pid), c => {
    if (!c) return c;
    c.visitors = c.visitors || {}; const d = c.visitors[today] = c.visitors[today] || {};
    if (d[me.pid]) return undefined;
    d[me.pid] = 1; c.money = (c.money || 0) + B; c.likes = (c.likes || 0) + 1; pruneDates(c.visitors, 3); return c;
  }).catch(() => {});
  Sound.play('cash'); toast(`🍔 냠! 나도 ${p.nick}님도 +${usd(B)}`, 2400);
  openVisit(p.pid);
}

    case 'dough': if (t.item || !has('oven')) return; t.item = { kind: 'pizza', sauce: false, cheese: false, tops: [], baked: false }; break;
    case 'patty': if (!isOpenBurger() || G.warm < 1) return; G.warm--; t.item.fill.push('patty'); renderGrill(true); break;
    case 'cheese': case 'lettuce': case 'tomato': case 'bacon': if (!isOpenBurger()) return; if (a === 'bacon' && G.st.lv < 2) return; t.item.fill.push(a); break;
    case 'top': if (!isOpenBurger() || !t.item.fill.length) return; t.item.closed = true; break;
    case 'sauce': if (!isRawPizza()) return; t.item.sauce = true; break;
    case 'pcheese': if (!isRawPizza()) return; t.item.cheese = true; break;
    case 'pepperoni': case 'mushroom': case 'olive': if (!isRawPizza() || t.item.tops.includes(a)) return; t.item.tops.push(a); break;
    case 'bake': if (!isRawPizza() || G.oven || !t.item.sauce || !t.item.cheese) return; G.oven = { item: t.item, t: 0, done: false }; t.item = null; renderOven(); break;
    case 'cola': if (!has('cola') || t.cola) return; t.cola = true; break;
    case 'beer': if (!has('tap') || t.beer || G.pour != null) return; G.pour = 0; break;
    case 'fries': if (!has('fryer') || t.fries || G.fry != null) return; G.fry = 0; renderFry(); break;
    case 'trash': if (!t.item && !t.cola && !t.beer && !t.fries) return; t.item = null; t.cola = false; t.beer = false; t.fries = false; chefSay($('#gScene'), pick(CHEF_LINES.trash)); break;
  }
  Sound.play('tap');
  renderTray(); renderIngs(); markReady();
}
function takeOven() { if (!G || !G.oven || !G.oven.done || G.tray.item) return; G.tray.item = G.oven.item; G.oven = null; renderOven(); renderTray(); renderIngs(); markReady(); }
function addPatty() { if (!G || !G.running || G.grill.length >= grillSlots()) return; G.grill.push({ t: 0 }); Sound.play('sizzle'); renderGrill(true); }
function serve(i) {
  const c = G && G.running && G.custs[i]; if (!c) return; const t = G.tray;
  if (!t.item && !t.cola && !t.beer && !t.fries) { logMsg('쟁반이 비어 있어요. 주문서대로 먼저 만들어요!'); return; }
  const seat = $('#gScene .seats').children[i];
  if (matches(c.o, t)) {
    const price = orderPrice(c.o), frac = c.p / c.max;
    const tip = Math.round(price * .5 * frac * (c.friend ? 2 : 1) * (HID[c.char] && HID[c.char].rare ? 3 : 1)), gain = price + tip;
    G.earned += gain; G.tips += tip; G.served++;
    G.rating = Math.min(5, G.rating + (frac > .5 ? .12 : .05));
    G.custs[i] = null; t.item = null; t.cola = false; t.beer = false; t.fries = false;
    Sound.play('cash'); vib(15);
    const ln = lineOf(c.char, 'good');
    chefSay($('#gScene'), pick(CHEF_LINES.good));
    logMsg(`${c.friend ? `👫 ${c.friend}님 ` : HID[c.char].rare ? `✨${nameOf(c.char)} 팁 3배! ` : ''}${orderName(c.o)} 완성! ${usd(price)} + 팁 ${usd(tip)}${ln ? ` · “${ln}”` : ''}`);
    floatTxt(seat, '+' + usd(gain)); leaveSeat(i, true);
  } else {
    G.wrong++; G.rating = Math.max(1, G.rating - .15); c.p = Math.max(0, c.p - 6);
    Sound.play('bad'); vib([20, 40, 20]);
    chefSay($('#gScene'), pick(CHEF_LINES.bad));
    logMsg('주문과 달라요! 주문서를 다시 보고, 틀렸으면 버리기로 쟁반을 비워요.');
    floatTxt(seat, '✗', true);
    const cu = seat.querySelector('.cust'); if (cu) { cu.classList.remove('mad'); void cu.offsetWidth; cu.classList.add('mad'); }
  }
  renderTray(); renderIngs(); renderHud(); markReady();
}

/* ── 게임 화면 그리기 ── */
function logMsg(s) { $('#gLog').textContent = s; }
function floatTxt(box, s, x) { if (!box) return; const f = document.createElement('div'); f.className = 'float' + (x ? ' x' : ''); f.textContent = s; box.appendChild(f); setTimeout(() => f.remove(), 1100); }
function renderHud() {
  if (!G) return;
  $('#hMoney').textContent = usd((me ? me.money : G.base) + G.earned);
  $('#hToday').textContent = usd(G.todayBase + G.earned);
  $('#hRate').textContent = '★' + G.rating.toFixed(1);
}
function renderSeat(i) {
  const seat = $('#gScene .seats').children[i]; const c = G.custs[i];
  seat.classList.remove('ready');
  if (!c) { seat.innerHTML = '<div class="empty">빈자리</div>'; seat.setAttribute('aria-label', '빈자리'); return; }
  seat.innerHTML = `<div class="cust${HID[c.char] && HID[c.char].rare ? ' sr' : ''}">
      <div class="ticket"><div class="food">${orderSVG(c.o, 30)}</div><div class="tname">${esc(orderName(c.o))}</div><div class="price">${usd(orderPrice(c.o))}</div></div>
      <div class="who">${c.friend ? `<span class="ftag">👫${esc(c.friend)}</span>` : ''}${HID[c.char] && HID[c.char].rare ? '<span class="srtag">✨초희귀</span>' : ''}<img src="${imgOf(c.char)}" alt="${esc(nameOf(c.char))}"><div class="body" style="--c:${c.shirt}"></div></div>
    </div><div class="pat"><i></i></div>`;
  seat.setAttribute('aria-label', `${nameOf(c.char)} 손님 주문: ${orderName(c.o)}. 눌러서 내주기`);
  renderPatience(i);
}
function leaveSeat(i, happy) {
  const seat = $('#gScene .seats').children[i]; const cu = seat.querySelector('.cust');
  seat.classList.remove('ready');
  const pat = seat.querySelector('.pat'); if (pat) pat.remove();
  if (cu) { cu.classList.add(happy ? 'happy' : 'mad'); setTimeout(() => cu.classList.add('out'), happy ? 380 : 300); }
  setTimeout(() => { if (G && !G.custs[i]) { const fl = seat.querySelector('.float'); seat.innerHTML = '<div class="empty">빈자리</div>'; if (fl) seat.appendChild(fl); } }, happy ? 800 : 700);
}
function renderPatience(i) {
  const seat = $('#gScene .seats').children[i], c = G.custs[i]; if (!seat || !c) return;
  const pb = seat.querySelector('.pat'); if (!pb) return;
  const f = c.p / c.max; pb.firstChild.style.width = (f * 100).toFixed(1) + '%';
  const cls = 'pat' + (f < .3 ? ' low' : f < .6 ? ' mid' : ''); if (pb.className !== cls) pb.className = cls;
}
function markReady() { if (!G) return; [...$('#gScene .seats').children].forEach((b, i) => { const c = G.custs[i]; b.classList.toggle('ready', !!c && matches(c.o, G.tray)); }); }
function renderTray() {
  const tr = $('#tray'), t = G.tray;
  if (!t.item && !t.cola && !t.beer && !t.fries) { tr.innerHTML = `<div class="hint">${has('oven') ? '아래빵이나 도우를 눌러 시작해요' : '아래빵을 눌러 버거를 시작해요 🍔'}</div>`; $('#trayName').textContent = '비어 있음'; return; }
  let h = '';
  if (t.item) h += t.item.kind === 'burger' ? burgerSVG(t.item.fill, t.item.closed, 92) : pizzaSVG(t.item, 92);
  if (t.fries) h += friesSVG(40); if (t.cola) h += colaSVG(30); if (t.beer) h += beerSVG(42);
  tr.innerHTML = h;
  let n = '';
  if (t.item) n = t.item.kind === 'burger' ? (t.item.closed ? '완성된 버거 ✔' : '버거 만드는 중') : (t.item.baked ? '구운 피자 ✔' : '피자 만드는 중 → 오븐에!');
  ['fries', 'cola', 'beer'].forEach(k => { if (t[k]) n += (n ? ' + ' : '') + NAMES[k]; });
  $('#trayName').textContent = n;
}
function ib(a, label, sub, cls, dis) { return `<button class="ib ${cls || ''}" type="button" data-a="${a}" ${dis ? 'disabled' : ''}>${iconSVG(a)}${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`; }
function renderIngs() {
  const t = G.tray; let h = '';
  if (!t.item) {
    h += ib('bun', '아래빵', '버거 시작', 'start');
    h += ib('dough', '도우', has('oven') ? '피자 시작' : '오븐 필요', 'start', !has('oven'));
  } else if (t.item.kind === 'burger' && !t.item.closed) {
    h += ib('patty', '패티', `준비 ${G.warm}개`, '', G.warm < 1);
    ['cheese', 'lettuce', 'tomato'].forEach(k => h += ib(k, NAMES[k]));
    h += ib('bacon', '베이컨', G.st.lv >= 2 ? '' : 'Lv.2부터', '', G.st.lv < 2);
    h += ib('top', '위빵', '버거 완성', 'act', t.item.fill.length < 1);
  } else if (t.item.kind === 'pizza' && !t.item.baked) {
    h += ib('sauce', '소스', '', '', t.item.sauce);
    h += ib('pcheese', '모차렐라', '', '', t.item.cheese);
    ['pepperoni', 'mushroom', 'olive'].forEach(k => h += ib(k, NAMES[k], '', '', t.item.tops.includes(k)));
    h += ib('bake', '오븐에', G.oven ? '오븐 사용 중' : '5초', 'act', !!G.oven || !t.item.sauce || !t.item.cheese);
  }
  if (has('fryer')) h += ib('fries', '감튀', t.fries ? '담았어요' : G.fry != null ? '튀기는 중…' : '3초 · +$3', '', t.fries || G.fry != null);
  if (has('cola')) h += ib('cola', '콜라', t.cola ? '담았어요' : '+$2', '', t.cola);
  if (has('tap')) h += ib('beer', '생맥주', t.beer ? '담았어요' : G.pour != null ? '따르는 중…' : '2초 · +$4', '', t.beer || G.pour != null);
  h += ib('trash', '버리기', '쟁반 비우기', 'trash', !t.item && !t.cola && !t.beer && !t.fries);
  $('#ings').innerHTML = h;
}
const PATTY_ICON = cooked => `<svg viewBox="0 0 100 34"><ellipse cx="50" cy="19" rx="46" ry="12" fill="${cooked >= 1 ? 'url(#gPatty)' : cooked > .5 ? '#A85D3A' : 'url(#gRaw)'}" stroke="#2E160A" stroke-width="2.4"/>${cooked > .5 ? '<path d="M24 16h14M46 21h14M68 16h12" stroke="#2B130A" stroke-width="3" stroke-linecap="round" opacity=".55"/>' : ''}</svg>`;
function renderGrill(full) {
  const box = $('#grill'), n = grillSlots();
  if (full || box.querySelectorAll('.gs').length !== n) {
    box.innerHTML = `<div class="flames">${'<i></i>'.repeat(6)}</div>` + Array.from({ length: n }, () => '<div class="gs"><div class="pt"></div><div class="bar"><i></i></div></div>').join('');
    box._k = [];
  }
  [...box.querySelectorAll('.gs')].forEach((s, i) => {
    const g = G.grill[i], bar = s.querySelector('.bar i'), pt = s.querySelector('.pt');
    const f = g ? Math.min(1, g.t / cookTime()) : -1, k = f < 0 ? 'x' : f < .5 ? 'r' : 'm';
    if (box._k[i] !== k) { box._k[i] = k; pt.innerHTML = f < 0 ? '' : PATTY_ICON(f) + '<span class="stm"></span><span class="stm b"></span>'; }
    bar.style.width = (Math.max(0, f) * 100) + '%';
  });
  $('#warm').textContent = G.warm;
  $('#grillInfo').textContent = `그릴 ${G.grill.length}/${n} · ${cookTime()}초${has('helper') ? ' · 🧑‍🍳알바' : ''}`;
  $('#addPatty').disabled = G.grill.length >= n;
}
function renderOven() {
  const box = $('#ovenBox');
  if (!has('oven')) { box.innerHTML = `<div class="locked">🔒<br>Lv.3부터</div>`; return; }
  const o = G.oven;
  box.innerHTML = `<button class="oven ${o && !o.done ? 'on' : ''}" type="button" id="ovenBtn"><span class="mouth"></span><span class="lbl">${!o ? '비어 있음' : o.done ? (G.tray.item ? '쟁반 비워요' : '눌러 꺼내기!') : '굽는 중…'}</span><span class="bar"><i style="width:${o ? Math.min(100, o.t / 5 * 100) : 0}%"></i></span></button>`;
  $('#ovenBtn').onclick = takeOven;
}
function renderFry() {
  const box = $('#fryBox');
  if (!has('fryer')) { box.innerHTML = `<div class="locked">🔒<br>설비에서 설치</div>`; return; }
  box.innerHTML = `<div class="fryer ${G.fry != null ? 'on' : ''}"><span class="oil"></span><span class="lbl">${G.fry != null ? '지글지글' : '대기'}</span><span class="bar"><i style="width:0%"></i></span></div>`;
}
function renderBar(sel, f) { const i = document.querySelector(sel + ' .bar i'); if (i) i.style.width = Math.min(100, f * 100) + '%'; }
function renderAll() { renderHud(); for (let i = 0; i < G.custs.length; i++) renderSeat(i); renderTray(); renderIngs(); renderGrill(true); renderOven(); renderFry(); logMsg('주문서를 보고 쟁반에 만든 뒤, 손님을 눌러서 내줘요!'); }

/* ── 영업 끝: 번 돈 저장 (key로 한 번만) ── */
async function settleRound(g) {
  const d = todayKST();
  const r = await txMe(c => {
    c.tx = c.tx || {}; if (c.tx[g.key]) return undefined;
    c.money = (c.money || 0) + g.earned; c.total = (c.total || 0) + g.earned;
    c.rounds = (c.rounds || 0) + 1; c.served = (c.served || 0) + g.served;
    c.best = Math.max(c.best || 0, g.earned); c.rating = Math.round(g.rating * 100) / 100;
    c.sales = c.sales || {}; const x = c.sales[d] = c.sales[d] || { rev: 0, n: 0, r: 0 };
    x.rev += g.earned; x.n += g.served; x.r += 1; pruneDates(c.sales, 120);
    c.tx[g.key] = Date.now(); const ks = Object.keys(c.tx); if (ks.length > 40) ks.sort((a, b) => c.tx[a] - c.tx[b]).slice(0, ks.length - 40).forEach(k => delete c.tx[k]);
    return c;
  });
  return r && (r.committed || !!(r.value && r.value.tx && r.value.tx[g.key]));
}
async function endRound(quit) {
  const g = G; if (!g) return;
  g.running = false;
  Sound.play('end');
  let ok = false;
  for (let n = 0; n < 4 && !ok; n++) { try { ok = await settleRound(g); } catch (e) { await sleep(800 * (n + 1)); } }
  if (quit) { G = null; show('lobby'); toast(ok ? `영업을 접었어요. ${usd(g.earned)} 챙겼어요` : '저장하지 못했어요. 연결을 확인해 주세요', 2600); return; }
  const best = me && g.earned >= (me.best || 0) && g.earned > 0;
  $('#ovRoot').innerHTML = `<div class="ov"><div class="sheet">
    <h2>${best ? '🎉 최고 매출 신기록!' : '오늘 영업 끝, 수고했다고!'}</h2>
    <div class="row">${chefImg(110)}<p>${esc(pick(g.served >= 8 ? ['이게 바로 어메리카 스타일이지!', '대박! 오늘 장사 끝내줬다!'] : g.served >= 3 ? ['Alright! 이 정도면 괜찮지!', '내일은 더 팔아 보자고!'] : ['괜찮아, 다음 영업은 더 잘할 거야!', '그릴 미리 달궈 두자고!']))}</p></div>
    <div class="sum"><div>이번 매출<b class="num" style="color:var(--red-d)">${usd(g.earned)}</b></div><div>손님<b>${g.served}명</b></div><div>놓친 손님<b>${g.missed}명</b></div></div>
    <p class="small muted">팁 ${usd(g.tips)} · 잘못 낸 음식 ${g.wrong}번 · 평점 ★${g.rating.toFixed(1)} · 오늘 매출 합계 <b>${usd(g.todayBase + g.earned)}</b>${ok ? '' : ' · ⚠️ 저장 실패 (연결 확인)'}</p>
    <div class="grid2"><button class="btn ghost" id="erHome">🏠 가게로</button><button class="btn red" id="erAgain">🍔 한 번 더 영업</button></div>
    <button class="btn teal" id="erShop">🛠️ 가게 키우기 (현금 ${usd(me ? me.money : 0)})</button></div></div>`;
  const close = () => { $('#ovRoot').innerHTML = ''; };
  $('#erHome').onclick = () => { close(); G = null; show('lobby'); };
  $('#erAgain').onclick = () => { close(); startRound(); };
  $('#erShop').onclick = () => { close(); G = null; show('shop'); };
}
$('#gQuit').onclick = () => {
  if (!G || !G.running) return;
  modal(`<h2>영업을 접을까요?</h2><p>지금까지 번 <b>${usd(G.earned)}</b>는 챙겨서 나가요.</p><div class="grid2"><button class="btn ghost" data-close>계속 영업</button><button class="btn red" id="qGo">접기</button></div>`, (s, close) => { $('#qGo', s).onclick = () => { close(); endRound(true); }; });
};
$('#ings').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled) act(b.dataset.a); });
$('#addPatty').innerHTML = `${PATTY_ICON(0).replace('<svg ', '<svg style="width:34px;height:20px" ')}패티 굽기<small>그릴에 올리기</small>`;
$('#addPatty').onclick = addPatty;
document.addEventListener('visibilitychange', () => { last = performance.now(); });
addEventListener('pagehide', () => { if (G && G.running && G.earned > 0) { G.running = false; settleRound(G).catch(() => {}); } });

/* ══════════ 새 버전 확인 ══════════ */
async function checkVersion() {
  try {
    const v = (await (await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })).text()).trim();
    if (v && v !== APP_VERSION && !(G && G.running) && ['login', 'lobby'].includes(cur) && !document.querySelector('#modalRoot .modal')) location.reload();
  } catch (e) {}
}

/* ══════════ 확대·축소 막기 (빠르게 연타해도 확대되지 않게) ══════════ */
(function lockZoom() {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = e.timeStamp || Date.now(), quick = now - lastEnd < 350; lastEnd = now;
    if (!quick) return;
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    e.preventDefault();
    const b = t && t.closest && t.closest('button,a,label');
    if (b && !b.disabled) b.click();
  }, { passive: false });
  addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
})();

/* ══════════ 시작 ══════════ */
function bootMsg(text, sub) { $('#s-boot').innerHTML = `<div style="margin:auto;text-align:center;display:grid;gap:10px;justify-items:center">${chefImg(180)}<b style="font:400 20px/1.3 var(--d)">${esc(text)}</b>${sub ? `<p class="small muted">${esc(sub)}</p>` : ''}</div>`; }
requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
(async function boot() {
  bootMsg('가게 문 여는 중… 🍔');
  const qs = new URLSearchParams(location.search);
  if (qs.get('local') === '1') db = new LocalDB();
  else {
    db = new FireDB();
    for (let n = 1; ; n++) {
      try { await db.init(); break; }
      catch (e) { console.warn('Firebase 연결 재시도', n, e); bootMsg('서버에 연결하는 중…', n > 1 ? `${n}번째 시도 중이에요. 와이파이나 데이터가 켜져 있는지 확인해 주세요` : ''); await sleep(Math.min(6000, 1000 * n)); }
    }
    setInterval(checkVersion, 120000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(checkVersion, 3000); });
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && me) dailyCheck(); });
  setInterval(() => { if (me && !document.hidden) dailyCheck(); }, 60000);
  const saved = savedCode();
  if (saved) {
    for (let n = 1; n < 6; n++) {
      let r;
      try { r = await login(saved); }
      catch (e) { bootMsg('내 코드로 들어가는 중…', `연결이 불안정해서 다시 시도하고 있어요 (${n}번째)`); await sleep(Math.min(6000, 1000 * n)); continue; }
      if (!r.err) return enter(r.code, r.player);
      if (r.replaced) clearCode();
      toast(r.err, 3000);
      break;
    }
  }
  show('login');
})();
