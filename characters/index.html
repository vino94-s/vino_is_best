<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>벙참 캐릭터 카드</title>
<meta property="og:title" content="벙참 캐릭터 카드">
<meta property="og:description" content="벙참 게임 공용 캐릭터 12명의 얼굴·말투·대사">
<meta property="og:image" content="https://vino94-s.github.io/vino_is_best/characters/img/kkaegul.png">
<link rel="icon" href="img/eomji.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 트레이딩 카드처럼 한 장씩: 얼굴 → 이름·정체 → 말투 → 상황별 대사. 카드를 누르면 대사가 새로 뽑혀요. */
:root{--bg:#F4EFE4;--card:#FFFDF7;--ink:#2A2420;--muted:#76695E;--line:#E2D7C6;--accent:#B4410E;
  --f-d:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-b:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1C1916;--card:#26221E;--ink:#F2EBDF;--muted:#B3A595;--line:#3A332C;--accent:#F28A55}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-b)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 64px}
h1{font-family:var(--f-d);font-weight:400;font-size:clamp(30px,8vw,48px);line-height:1.1;margin:0}
.lead{color:var(--muted);margin:8px 0 0;max-width:60ch}
.lead a{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.face{position:relative;background:var(--tone);aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.face::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(0,0,0,.18),transparent 60%)}
.face img{width:62%;height:auto;max-height:88%;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.no{position:absolute;top:10px;left:12px;z-index:2;font-family:var(--f-d);font-size:14px;color:rgba(0,0,0,.45)}
.hi{position:absolute;right:10px;bottom:10px;z-index:2;background:#fff;color:#2A2420;border-radius:14px 14px 4px 14px;padding:4px 10px;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.body{padding:14px 16px 16px;display:grid;gap:8px;align-content:start}
.nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nm b{font-family:var(--f-d);font-weight:400;font-size:26px;line-height:1}
.nm code{font-size:12px;color:var(--muted)}
.nm span{font-size:13px;color:var(--muted)}
.persona{margin:0;font-size:14px}
.voice{margin:0;font-size:13px;color:var(--muted);border-left:3px solid var(--tone);padding-left:8px}
.lines{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:5px}
.lines li{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:13.5px;align-items:baseline}
.lines li i{font-style:normal;font-size:11.5px;color:var(--muted)}
.foot{margin-top:28px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1>벙참 캐릭터 카드</h1>
  <p class="lead">벙참 게임에 나오는 공식 캐릭터 12명이에요. 어느 게임이든 이름·얼굴·말투는 이 카드를 따라요. 카드를 누르면 대사가 새로 뽑혀요. 데이터는 <a href="characters.json">characters.json</a>, 쓰는 법은 <a href="https://github.com/vino94-s/vino_is_best/tree/main/characters">README</a>에 있어요.</p>
  <div class="grid" id="grid"></div>
  <p class="foot">출처: 손모가지 조심! 캐릭터 · 공용 대사 상황 — 시작 · 잘함 · 실수 · 승리 · 패배 · 도발</p>
</main>
<script src="bung-chars.js"></script>
<script>
(function(){
  var KEYS = [['start','시작'],['good','잘함'],['bad','실수'],['win','승리'],['lose','패배'],['taunt','도발']];
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); };
  var grid = document.getElementById('grid');
  function lines(c){ return KEYS.map(function(k){ return '<li><i>' + k[1] + '</i><span>' + esc(BUNG_CHARS.line(c.id, k[0])) + '</span></li>'; }).join(''); }
  BUNG_CHARS.list.forEach(function(c, i){
    var el = document.createElement('article');
    el.className = 'card'; el.tabIndex = 0; el.style.setProperty('--tone', c.color);
    el.setAttribute('aria-label', c.name + ' 카드');
    el.innerHTML = '<div class="face"><span class="no">' + String(i + 1).padStart(2, '0') + '</span><img src="' + esc(c.file) + '" alt="' + esc(c.name) + ' 얼굴" loading="lazy"><span class="hi">' + esc(c.hi) + '</span></div>'
      + '<div class="body"><div class="nm"><b>' + esc(c.name) + '</b><span>' + esc(c.animal) + '</span><code>' + esc(c.id) + '</code></div>'
      + '<p class="persona">' + esc(c.persona) + '</p><p class="voice">' + esc(c.voice) + '</p><ul class="lines">' + lines(c) + '</ul></div>';
    var reroll = function(){ el.querySelector('.lines').innerHTML = lines(c); };
    el.addEventListener('click', reroll);
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reroll(); } });
    grid.appendChild(el);
  });
})();
</script>
</body>
</html>
