<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>수염은 스타벅스만 잡아</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* Layout: one-column arcade cabinet — HUD strip, 3×3 kraft-sleeve holes on green felt, live leaderboard below. Single dark look by design. */
:root{
  --felt:#0d3a2c; --felt-deep:#072219; --felt-line:#1d5a45;
  --kraft:#c99a66; --kraft-dark:#7c5631; --pit:#1a0f07;
  --ink:#f2ecdf; --ink-dim:#a9bfb3;
  --gold:#ffcf5a; --alarm:#ff5b47; --go:#2fd28a;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--felt-deep);color:var(--ink);height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.5;box-sizing:border-box;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  background:radial-gradient(120% 60% at 50% 0%, #114a37 0%, var(--felt-deep) 70%) var(--felt-deep);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.wrap{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex:none}
.titles{display:flex;flex-direction:column;gap:2px;min-width:0}
.rankBtn{all:unset;cursor:pointer;flex:none;font:800 13px var(--body);padding:8px 14px;border-radius:999px;color:var(--gold);box-shadow:inset 0 0 0 2px rgba(255,207,90,.45)}
.rankBtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--go);font-weight:800}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,7.4vw,36px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em;word-break:keep-all}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:var(--ink-dim);font-size:13.5px;margin:0}

.hud{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;padding:12px 14px;border-radius:14px;background:var(--felt);border:1px solid var(--felt-line)}
.hud .lbl{font-size:10.5px;letter-spacing:.14em;color:var(--ink-dim);font-weight:800;text-transform:uppercase}
.score{font-family:var(--display);font-size:38px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.lives{display:flex;gap:6px;justify-content:center;padding-bottom:4px}
.life{width:22px;height:30px;border-radius:4px 4px 7px 7px;background:var(--kraft);position:relative;transition:transform .25s,opacity .25s,filter .25s}
.life::before{content:"";position:absolute;left:3px;right:3px;top:-6px;height:8px;border-radius:8px 8px 2px 2px;background:#e6efe9;opacity:.85}
.life::after{content:"";position:absolute;left:0;right:0;top:11px;height:9px;background:var(--felt)}
.life.lost{opacity:.18;filter:grayscale(1);transform:scale(.8)}
.right{text-align:right}
.speed{font-family:var(--display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.speed small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--ink-dim)}
.speed.max{color:var(--alarm)}

.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:22px;padding:18px 12px 10px;background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 6px,transparent 6px 12px),var(--felt);
  border:1px solid var(--felt-line);box-shadow:inset 0 -18px 40px rgba(0,0,0,.35)}
.stage.hurt{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.flash{position:absolute;inset:0;border-radius:22px;background:var(--alarm);opacity:0;pointer-events:none;transition:opacity .35s}
.flash.on{opacity:.28;transition:none}
.board{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hole{all:unset;position:relative;aspect-ratio:1/1.18;cursor:pointer;max-width:100%;contain:layout}
.hole:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
.hole::before{content:"";position:absolute;left:7%;right:7%;bottom:9%;height:22%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,#000 0 45%,var(--pit) 70%);z-index:0}
.clip{position:absolute;left:0;right:0;top:0;bottom:19%;overflow:hidden;z-index:1;transform:translateZ(0)}
.char{position:absolute;left:4%;bottom:-3%;width:92%;height:100%;max-width:none;object-fit:contain;object-position:50% 100%;
  transform:translate3d(0,110%,0);will-change:transform;backface-visibility:hidden;pointer-events:none;
  transition:transform var(--down,460ms) cubic-bezier(.45,0,.55,1)}
.hole.up .char{transform:translate3d(0,0,0);transition:transform var(--rise,560ms) cubic-bezier(.16,.84,.3,1)}
.hole.hit .char{transform:translate3d(0,8%,0) scale(1.04,.92);transition:transform 110ms ease-out}
.hole.bad .char{opacity:.7;transition:transform 110ms ease-out,opacity .1s}
.rim{position:absolute;left:3%;right:3%;bottom:4%;height:16%;border-radius:50%;z-index:2;
  background:linear-gradient(var(--kraft) 0 55%,var(--kraft-dark));
  -webkit-mask:radial-gradient(ellipse 46% 60% at 50% 0%,transparent 98%,#000 100%);mask:radial-gradient(ellipse 46% 60% at 50% 0%,transparent 98%,#000 100%)}
.pop{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-family:var(--display);font-size:26px;line-height:1;z-index:5;pointer-events:none;white-space:nowrap;text-align:center;
  animation:pop .7s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.pop small{display:block;font-size:14px;color:var(--go);margin-top:2px}
.burst{position:absolute;left:50%;top:44%;width:0;height:0;z-index:4;pointer-events:none}
.burst .glow{position:absolute;left:-46px;top:-46px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,190,.95),rgba(255,207,90,.35) 45%,transparent 70%);animation:glow .35s ease-out forwards}
.burst .ring{position:absolute;left:-38px;top:-38px;width:76px;height:76px;border-radius:50%;border:4px solid var(--gold);animation:ring .45s ease-out forwards}
.burst .sp{position:absolute;left:-6px;top:-6px;width:12px;height:12px;background:var(--c);transform:rotate(var(--a));
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:spark .55s cubic-bezier(.15,.8,.3,1) forwards}
.burst.bad .ring{border-color:var(--alarm)}
.burst.bad .x{position:absolute;left:-24px;top:-30px;width:48px;text-align:center;font:400 52px/1 var(--display);color:var(--alarm);animation:xmark .5s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.4)}
@keyframes glow{from{transform:scale(.4);opacity:1}to{transform:scale(1.3);opacity:0}}
@keyframes ring{from{transform:scale(.35);opacity:1}to{transform:scale(1.55);opacity:0;border-width:1px}}
@keyframes spark{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) rotate(90deg) scale(.4);opacity:0}}
@keyframes xmark{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.score{transition:transform .12s}
.score.bump{transform:scale(1.22);transition:none}
.pop.good{color:var(--gold)} .pop.bad{color:var(--alarm)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}

.toast{position:absolute;left:50%;top:-14px;transform:translate(-50%,0);z-index:6;white-space:nowrap;padding:6px 12px;border-radius:999px;
  font-weight:800;font-size:13px;background:var(--gold);color:#2a1a05;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,-6px)}
.toast.warn{background:var(--alarm);color:#fff}

.overlay{position:absolute;inset:0;z-index:5;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:20px;text-align:center;background:rgba(5,24,18,.86);backdrop-filter:blur(3px)}
.overlay h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.1}
.overlay p{word-break:keep-all;margin:0;color:var(--ink-dim);font-size:13.5px;max-width:30ch}
.final{font-family:var(--display);font-size:56px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.cast{display:flex;gap:10px;align-items:flex-end;justify-content:center}
.cast figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--ink-dim)}
.cast img{height:62px;width:auto;max-width:none}
.cast .ok{color:var(--go)} .cast .no{color:var(--alarm)}
.btn{all:unset;cursor:pointer;font-family:var(--display);font-size:20px;padding:12px 26px;border-radius:999px;background:var(--go);color:#062418;
  box-shadow:0 4px 0 #11704a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #11704a}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--felt-line);font-size:16px;padding:10px 20px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
input#nick{user-select:text;-webkit-user-select:text;font:600 16px var(--body);color:var(--ink);background:var(--felt-deep);border:2px solid var(--felt-line);border-radius:12px;padding:10px 12px;width:13ch;max-width:100%;text-align:center}
input#nick:focus{outline:none;border-color:var(--gold)}
.note{font-size:12px;color:var(--ink-dim);min-height:1.2em}
.note.err{color:var(--alarm)} .note.okc{color:var(--go)}

.rank{background:var(--felt);border:1px solid var(--felt-line);border-radius:16px;padding:14px 14px 8px}
.rank-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rank-head h3{flex:1}
.rank h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.live{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--go);display:flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
.live.off{color:var(--ink-dim)} .live.off::before{animation:none}
@keyframes blink{50%{opacity:.25}}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-top:1px solid var(--felt-line);font-variant-numeric:tabular-nums}
li:first-child{border-top:0}
li .n{font-family:var(--display);font-size:17px;color:var(--ink-dim)}
li:nth-child(1) .n{color:var(--gold)} li:nth-child(2) .n{color:#dfe6ea} li:nth-child(3) .n{color:var(--kraft)}
li .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
li .pts{font-family:var(--display);font-size:18px}
li.me{background:rgba(255,207,90,.08);border-radius:8px}
li.me .who::after{content:" · 나";color:var(--gold);font-size:12px}
.empty{color:var(--ink-dim);font-size:13.5px;padding:10px 2px 12px}
.rules{color:var(--ink-dim);font-size:12px;display:grid;gap:3px;text-align:left;max-width:34ch;line-height:1.45}
.rules b{color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,15,11,.72);
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .rank{width:100%;max-width:520px;max-height:72%;display:flex;flex-direction:column;animation:sheetIn .32s cubic-bezier(.16,.84,.3,1)}
.sheet ol{overflow-y:auto;overscroll-behavior:contain;min-height:0}
.close{all:unset;cursor:pointer;font:800 13px var(--body);color:var(--ink-dim);padding:4px 8px}
.close:focus-visible{outline:2px solid var(--gold)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.char{transition-duration:1ms!important}.burst *{animation-duration:1ms!important}.stage.hurt{animation:none}.pop{animation-duration:1ms}}
/* standalone page: clear the phone notch / home bar */
body{padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles"><span class="eyebrow">Whack-a-Siren · 무한 모드</span><h1>수염은 <em>스타벅스</em>만 잡아</h1></div>
    <button class="rankBtn" id="rankOpen" type="button">랭킹</button>
  </header>

  <div class="hud" aria-live="polite">
    <div><div class="lbl">Score</div><div class="score" id="score">0</div></div>
    <div><div class="lbl" style="text-align:center">Lives</div><div class="lives" id="lives"><i class="life"></i><i class="life"></i><i class="life"></i></div></div>
    <div class="right"><div class="lbl">Speed</div><div class="speed" id="speed">100%<small>다음 단계 250점</small></div></div>
  </div>

  <div class="stage" id="stage">
    <div class="toast" id="toast"></div>
    <div class="board" id="board"></div>
    <div class="flash" id="flash"></div>

    <div class="overlay" id="startOv">
      <h2>준비됐나요?</h2>
      <div class="cast" id="cast"></div>
      <p>컵만 탭! 방해꾼을 치면 목숨이 하나 줄어요. 목숨 3개가 다 떨어지면 끝.</p>
      <div class="rules">
        <div><b>점수</b> 컵 하나에 +10점, 250점마다 속도 +5% (1500점에서 130%로 고정)</div>
        <div><b>1500점 이후</b> 방해꾼이 점점 더 자주 나와요 (최대 45%)</div>
      </div>
      <button class="btn" id="startBtn" type="button">게임 시작</button>
    </div>

    <div class="overlay" id="overOv" hidden>
      <h2>게임 오버</h2>
      <div class="final" id="final">0</div>
      <p id="bestLine">랭킹에 이름을 남겨 보세요</p>
      <div class="row">
        <input id="nick" maxlength="12" placeholder="닉네임" autocomplete="off" aria-label="닉네임">
        <button class="btn ghost" id="submitBtn" type="button">랭킹 등록</button>
      </div>
      <div class="note" id="note"></div>
      <div class="row"><button class="btn" id="againBtn" type="button">다시 하기</button><button class="btn ghost" id="rankOpen2" type="button">랭킹 보기</button></div>
    </div>
  </div>

</div>

<div class="sheet" id="sheet" hidden>
  <section class="rank" role="dialog" aria-modal="true" aria-labelledby="rankTitle">
    <div class="rank-head"><h3 id="rankTitle">오픈 랭킹</h3><span class="live off" id="liveTag">불러오는 중</span><button class="close" id="rankClose" type="button">닫기</button></div>
    <ol id="rankList"></ol>
    <div class="empty" id="rankEmpty">랭킹을 불러오는 중이에요.</div>
  </section>
</div>

/* ---------- tuning ---------- */
const BASE_UP = 1350, BASE_GAP = 800, STEP = 250, SPEED_CAP_SCORE = 1500;
const BASE_FAKE = 0.25, FAKE_STEP = 0.05, FAKE_MAX = 0.45;
const speedLevel = s => Math.min(Math.floor(s/STEP), SPEED_CAP_SCORE/STEP);   // 0..6
const speedMul   = s => Math.pow(1.05, speedLevel(s));
const fakeRate   = s => s < SPEED_CAP_SCORE ? BASE_FAKE : Math.min(FAKE_MAX, BASE_FAKE + FAKE_STEP*(Math.floor((s-SPEED_CAP_SCORE)/STEP)+1));
const maxActive  = s => s >= 1000 ? 3 : s >= 400 ? 2 : 1 + (s >= 150 ? 1 : 0);

/* ---------- board ---------- */
const $ = id => document.getElementById(id);
const board = $("board"), holes = [];
for (let i=0;i<9;i++){
  const b = document.createElement("button");
  b.type="button"; b.className="hole"; b.setAttribute("aria-label",`구멍 ${i+1}`);
  b.innerHTML = '<div class="clip"><img class="char" alt="" draggable="false"></div><div class="rim"></div>';
  board.appendChild(b);
  const h = {el:b, img:b.querySelector(".char"), up:false, busy:false, hit:false, fake:false, t:0, freeT:0};
  holes.push(h);
  b.addEventListener("pointerdown", e => { e.preventDefault(); whack(i); });
  b.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); whack(i);} });
}
/* preload */
const DECODED = [CUP, ...FAKES.map(f=>f.src)].map(s => { const im = new Image(); im.src = s; if (im.decode) im.decode().catch(()=>{}); return im; });

/* cast preview on start screen */
const cast = $("cast");
[[CUP,"잡아!","ok"],[FAKES[4].src,"방해꾼 X","no"],[FAKES[5].src,"방해꾼 X","no"]].forEach(([src,t,c])=>{
  const f=document.createElement("figure"); const im=document.createElement("img"); im.src=src; im.alt="";
  const cap=document.createElement("figcaption"); cap.textContent=t; cap.className=c; f.append(im,cap); cast.appendChild(f);
});

/* ---------- state ---------- */
let score=0, hits=0, lastHits=0, lives=3, running=false, spawnTimer=0, lastLevel=0, lastFakeTier=0;
const scoreEl=$("score"), livesEls=[...document.querySelectorAll(".life")], speedEl=$("speed");

function hud(){
  scoreEl.textContent = score.toLocaleString("ko-KR");
  livesEls.forEach((l,i)=>l.classList.toggle("lost", i>=lives));
  const lv = speedLevel(score), pct = Math.round(speedMul(score)*100);
  if (score >= SPEED_CAP_SCORE){
    speedEl.className="speed max";
    speedEl.innerHTML = `${pct}%<small>가짜 ${Math.round(fakeRate(score)*100)}%</small>`;
  } else {
    speedEl.className="speed";
    speedEl.innerHTML = `${pct}%<small>다음 단계 ${(lv+1)*STEP}점</small>`;
  }
}

let toastT=0;
function toast(msg, warn){
  const t=$("toast"); t.textContent=msg; t.className="toast on"+(warn?" warn":"");
  clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast"+(warn?" warn":""),1400);
}

function popText(h, txt, good, sub){
  const p=document.createElement("span"); p.className="pop "+(good?"good":"bad"); p.textContent=txt;
  if (sub){ const sm=document.createElement("small"); sm.textContent=sub; p.appendChild(sm); }
  h.el.appendChild(p); setTimeout(()=>p.remove(),750);
}
const SPARK_COLORS=["var(--gold)","var(--go)","#fff4c9","var(--gold)"];
function burst(h, good){
  const b=document.createElement("div"); b.className="burst"+(good?"":" bad");
  if (good){
    b.innerHTML='<i class="glow"></i><i class="ring"></i>';
    const n=10, off=Math.random()*36;
    for (let k=0;k<n;k++){
      const sp=document.createElement("i"); sp.className="sp";
      sp.style.setProperty("--a",(off+k*360/n)+"deg");
      sp.style.setProperty("--d",(38+Math.random()*22)+"px");
      sp.style.setProperty("--c",SPARK_COLORS[k%SPARK_COLORS.length]);
      b.appendChild(sp);
    }
  } else {
    b.innerHTML='<i class="ring"></i><span class="x">✕</span>';
  }
  h.el.appendChild(b); setTimeout(()=>b.remove(),600);
}
let combo=0;

function hide(h){
  const wasShown = h.el.classList.contains("up");
  h.up=false; h.el.classList.remove("up","hit","good","bad"); clearTimeout(h.t); clearTimeout(h.freeT);
  if (!wasShown){ h.busy=false; return; }
  const down = parseFloat(h.el.style.getPropertyValue("--down")) || 460;
  h.freeT = setTimeout(()=>{ h.busy=false; }, down + 40);
}

function spawn(){
  if (!running) return;
  const active = holes.filter(h=>h.up||h.pending).length;
  const free = holes.filter(h=>!h.busy);
  if (active < maxActive(score) && free.length){
    const h = free[Math.floor(Math.random()*free.length)];
    const fake = Math.random() < fakeRate(score);
    h.fake = fake; h.hit = false;
    h.img.src = fake ? FAKES[Math.floor(Math.random()*FAKES.length)].src : CUP;
    const mul = speedMul(score);
    h.el.style.setProperty("--rise", Math.round(560/mul)+"ms");
    h.el.style.setProperty("--down", Math.round(460/mul)+"ms");
    h.busy = true; h.pending = true;
    const stay = (BASE_UP/mul) * (0.85 + Math.random()*0.35) * (fake ? 1.15 : 1);
    const show = ()=>{
      if (!running){ h.busy=false; h.pending=false; return; }
      void h.img.offsetHeight;                       // commit the hidden pose first
      requestAnimationFrame(()=>{ h.pending=false; if(!running){h.busy=false;return;} h.up = true; h.el.classList.add("up"); h.t = setTimeout(()=>hide(h), stay); });
    };
    (h.img.decode ? h.img.decode() : Promise.resolve()).then(show, show);
  }
  const gap = (BASE_GAP/speedMul(score)) * (0.6 + Math.random()*0.6);
  spawnTimer = setTimeout(spawn, gap);
}

function whack(i){
  const h = holes[i];
  if (!running || !h.up || h.hit) return;
  h.hit = true; clearTimeout(h.t);
  h.el.classList.add("hit");
  if (h.fake){
    lives--; combo=0; h.el.classList.add("bad"); burst(h,false); popText(h,"-1 ♥",false);
    const st=$("stage"); st.classList.remove("hurt"); void st.offsetWidth; st.classList.add("hurt");
    const fl=$("flash"); fl.classList.add("on"); requestAnimationFrame(()=>requestAnimationFrame(()=>fl.classList.remove("on")));
    if (navigator.vibrate) try{navigator.vibrate(60)}catch(e){}
  } else {
    score += 10; hits++; combo++;
    h.el.classList.add("good"); burst(h,true);
    popText(h,"+10",true, combo>=3 ? `${combo} 콤보` : "");
    scoreEl.classList.add("bump"); requestAnimationFrame(()=>requestAnimationFrame(()=>scoreEl.classList.remove("bump")));
    if (navigator.vibrate) try{navigator.vibrate(12)}catch(e){}
  }
  h.t = setTimeout(()=>hide(h), 200);
  const lv = speedLevel(score);
  if (lv > lastLevel){
    lastLevel = lv;
    if (score >= SPEED_CAP_SCORE) toast("최고 속도! 이제 가짜가 늘어나요", true);
    else toast(`속도 +5% · ${Math.round(speedMul(score)*100)}%`);
  }
  if (score >= SPEED_CAP_SCORE){
    const tier = Math.floor((score-SPEED_CAP_SCORE)/STEP)+1;
    if (tier > lastFakeTier){ if (lastFakeTier>0 && fakeRate(score) > BASE_FAKE+FAKE_STEP*lastFakeTier) toast(`가짜 등장률 ${Math.round(fakeRate(score)*100)}%`, true); lastFakeTier = tier; }
  }
  hud();
  if (lives <= 0) gameOver();
}

function start(){
  score=0; hits=0; lives=3; combo=0; lastLevel=0; lastFakeTier=0; running=true;
  holes.forEach(hide); hud();
  $("startOv").hidden=true; $("overOv").hidden=true;
  clearTimeout(spawnTimer); spawnTimer=setTimeout(spawn, 500);
}

function gameOver(){
  running=false; lastHits=hits; clearTimeout(spawnTimer);
  setTimeout(()=>holes.forEach(hide), 250);
  $("final").textContent = score.toLocaleString("ko-KR");
  const prev = myBest();
  $("bestLine").textContent = prev == null ? "랭킹에 이름을 남겨 보세요"
    : score > prev ? `내 최고기록 ${prev.toLocaleString("ko-KR")}점을 넘었어요!` : `내 최고기록 ${prev.toLocaleString("ko-KR")}점`;
  setNote("");
  $("submitBtn").disabled = false;
  syncSubmitAvailability();
  setTimeout(()=>{ $("overOv").hidden=false; }, 450);
}

const stage=$("stage");
function fit(){
  const cs=getComputedStyle(stage);
  const w=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const hgt=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const cell=Math.max(60, Math.min((w-20)/3, (hgt-8)/(3*1.18)));
  board.style.width=Math.round(cell*3+20)+"px";
}
fit(); addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
const sheet=$("sheet");
const openRank=()=>{ sheet.hidden=false; $("rankClose").focus(); };
$("rankOpen").addEventListener("click", openRank);
$("rankOpen2").addEventListener("click", openRank);
$("rankClose").addEventListener("click", ()=>{ sheet.hidden=true; });
sheet.addEventListener("click", e=>{ if (e.target===sheet) sheet.hidden=true; });
document.addEventListener("keydown", e=>{ if (e.key==="Escape") sheet.hidden=true; });
$("startBtn").addEventListener("click", start);
$("againBtn").addEventListener("click", start);
document.addEventListener("keydown", e=>{
  if (!running || e.target.tagName==="INPUT") return;
  const map={"7":0,"8":1,"9":2,"4":3,"5":4,"6":5,"1":6,"2":7,"3":8};
  if (e.key in map){ e.preventDefault(); whack(map[e.key]); }
});

/* ---------- ranking: claude.ai live db → Google Sheet (GitHub Pages) → this device ---------- */
// 깃허브 페이지에서 쓰는 공유 랭킹 서버 (구글 시트 + Apps Script 웹 앱 주소). 비어 있으면 이 기기에만 저장.
const RANK_API = "https://script.google.com/macros/s/AKfycby58ArqCsEETODw_pV38u9OsBvmkoqVjd10cVbGwQsS5yMIC-Ov3ZNlp1nMKRwhjFfKlw/exec";
let mode="local", db=null, uid=null, canWrite=null, readOnly=false, rows=[], myDoc=null;
const nick=$("nick"), note=$("note"), list=$("rankList"), empty=$("rankEmpty"), liveTag=$("liveTag");
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
nick.value = LS.get("whack.nick","") || "";

function setNote(t, cls){ note.textContent=t; note.className="note"+(cls?" "+cls:""); }
function cleanName(s){ return String(s||"").replace(/[\u0000-\u001f]/g,"").replace(/\s+/g," ").trim().slice(0,12); }
function myBest(){
  if (mode==="claude") return myDoc && typeof myDoc.score==="number" ? myDoc.score : null;
  const b = LS.get("whack.best", null); return typeof b==="number" ? b : null;
}
function setLive(text, on){ liveTag.textContent=text; liveTag.className="live"+(on?"":" off"); }

function syncSubmitAvailability(){
  const btn=$("submitBtn");
  if (mode==="claude" && (!uid || readOnly || canWrite===false)){
    btn.disabled=true; nick.disabled=true; setNote("이 링크 권한은 보기 전용이라 기록을 등록할 수 없어요.");
  }
}

function renderRank(){
  list.textContent="";
  const valid = rows.filter(r=>typeof r.score==="number" && r.score>0);
  empty.hidden = valid.length>0;
  if (!valid.length) empty.textContent = "아직 기록이 없어요. 첫 번째 이름을 올려 보세요.";
  const myName = cleanName(nick.value);
  valid.forEach((r,i)=>{
    const li=document.createElement("li");
    if (mode==="claude" ? r.id===uid : (myName && cleanName(r.name)===myName)) li.className="me";
    const n=document.createElement("span"); n.className="n"; n.textContent=i+1;
    const w=document.createElement("span"); w.className="who"; w.textContent=cleanName(r.name)||"익명";
    const p=document.createElement("span"); p.className="pts"; p.textContent=r.score.toLocaleString("ko-KR");
    li.append(n,w,p); list.appendChild(li);
  });
}

/* best score per nickname, high → low, earlier record wins ties */
function bestPerName(entries){
  const best={};
  entries.forEach(r=>{ const k=cleanName(r.name); if(!k) return; const c=best[k];
    if (!c || r.score>c.score || (r.score===c.score && r.at<c.at)) best[k]={name:k, score:Number(r.score)||0, at:Number(r.at)||0}; });
  return Object.values(best).sort((a,b)=>b.score-a.score||a.at-b.at).slice(0,30);
}
function loadLocal(){ rows = bestPerName(LS.get("whack.local", [])); renderRank(); }
async function loadSheet(){
  try{
    const r = await fetch(RANK_API+"?t="+Date.now()); const j = await r.json();
    if (!j.ok) throw 0;
    rows = bestPerName(j.rows||[]); setLive("공유 랭킹", true); renderRank(); return true;
  }catch(e){ setLive("연결 안 됨", false); return false; }
}

async function submit(){
  const name = cleanName(nick.value);
  if (!name){ setNote("닉네임을 입력해 주세요.","err"); nick.focus(); return; }
  LS.set("whack.nick", name);
  const prev = myBest();
  const btn=$("submitBtn");
  if (mode==="claude"){
    if (!db || !uid) return;
    const best = Math.max(score, prev||0);
    if (prev!=null && score<=prev && myDoc && myDoc.name===name){ setNote(`최고기록 ${prev.toLocaleString("ko-KR")}점이 이미 올라가 있어요.`,"okc"); return; }
    btn.disabled=true; setNote("등록 중…");
    try{
      await db.doc("scores/"+uid).set({name, score:best, at:Date.now()});
      myDoc = {name, score:best};
      setNote(score>(prev||0) ? "랭킹에 등록했어요!" : `닉네임을 바꿨어요. 최고기록 ${best.toLocaleString("ko-KR")}점 유지`,"okc");
    }catch(e){
      if (e && e.code==="invalid_argument"){ readOnly=true; syncSubmitAvailability(); }
      else { setNote("등록하지 못했어요. 잠시 뒤 다시 눌러 주세요.","err"); btn.disabled=false; }
    }
    return;
  }
  if (score<=0){ setNote("0점은 등록되지 않아요.","err"); return; }
  btn.disabled=true; setNote("등록 중…");
  if (mode==="local" && RANK_API) await retrySheet();
  const entry = {name, score, hits:lastHits, at:Date.now()};
  if (mode==="sheet"){
    try{
      const r = await fetch(RANK_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(entry)});
      const j = await r.json(); if (!j.ok) throw 0;
      if (score>(prev||0)) LS.set("whack.best", score);
      setNote("공유 랭킹에 등록했어요!","okc"); loadSheet(); return;
    }catch(e){ setNote("공유 랭킹에 연결하지 못해서 이 기기에만 저장했어요.","err"); }
  } else {
    setNote("이 기기 랭킹에 저장했어요.","okc");
  }
  const all = LS.get("whack.local", []); all.push(entry); LS.set("whack.local", all.slice(-200));
  if (score>(prev||0)) LS.set("whack.best", score);
  if (mode==="local") loadLocal();
}
$("submitBtn").addEventListener("click", submit);
nick.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } });
async function retrySheet(){
  if (!RANK_API || mode==="claude") return mode==="sheet";
  if (await loadSheet()){ mode="sheet"; return true; }
  mode="local"; setLive("공유 랭킹 연결 안 됨 · 이 기기", false); loadLocal(); return false;
}
$("rankOpen").addEventListener("click", ()=>{ retrySheet(); });
$("rankOpen2").addEventListener("click", ()=>{ retrySheet(); });

async function useLocalOrSheet(){
  if (RANK_API){
    mode="sheet"; setLive("불러오는 중", false);
    if (await loadSheet()) return;
  }
  mode="local"; setLive(RANK_API?"공유 랭킹 연결 안 됨 · 이 기기":"이 기기", false); loadLocal();
}

(async ()=>{
  if (!window.claude || typeof window.claude.use!=="function"){ await useLocalOrSheet(); return; }
  let user=null;
  try{ [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); }catch(e){ db=null; }
  if (!db){ await useLocalOrSheet(); return; }
  mode="claude";
  try{ uid = user ? await user.id() : null; }catch(e){ uid=null; }
  try{ canWrite = user ? await user.can("data.write") : null; }catch(e){ canWrite=null; }
  if (uid){
    try{ const s = await db.doc("scores/"+uid).get(); if (s.exists){ myDoc = s.data(); if (!nick.value && myDoc.name) nick.value = myDoc.name; } }catch(e){}
  }
  db.collection("scores").orderBy("score","desc").limit(30).onSnapshot(snap=>{
    rows = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const mine = rows.find(r=>r.id===uid); if (mine) myDoc = {name:mine.name, score:mine.score};
    setLive("LIVE", true);
    renderRank();
  }, ()=>{ setLive("연결 끊김", false); });
})();

hud();
})();
</script>
