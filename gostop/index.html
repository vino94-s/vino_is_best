<script>
// 카톡·라인 인앱 브라우저는 채팅방에 다녀오면 게임이 닫혀서, 휴대폰 기본 브라우저로 옮겨 열어요.
(function () {
  var ua = navigator.userAgent || '';
  if (/KAKAOTALK/i.test(ua)) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  else if (/\bLine\//.test(ua) && !/openExternalBrowser=1/.test(location.search)) location.href = location.href + (location.search ? '&' : '?') + 'openExternalBrowser=1';
})();
</script>
</head>
<body>
<main id="app">
  <section id="scr-boot" class="screen wrap"><div class="title-stamp">손모가지<br>조심!</div><p class="mode-note">판 까는 중…</p></section>
  <section id="scr-login" class="screen hidden"></section>
  <section id="scr-lobby" class="screen hidden"></section>
  <section id="scr-room" class="screen hidden"></section>
  <section id="scr-game" class="hidden"></section>
  <section id="scr-rank" class="screen hidden"></section>
  <section id="scr-admin" class="screen hidden"></section>
</main>
<div id="modal-root"></div>
<div id="taunt-root" class="taunt-layer hidden" aria-live="polite"></div>
<div id="toast-root"></div>
<noscript>자바스크립트를 켜야 게임을 할 수 있어요.</noscript>
<script type="module" src="js/app.js?v=20261017e"></script>
<!-- 벙참 뒤로가기 버튼 -->
<a id="bungBack" href="../" aria-label="게임 나가기" title="게임 나가기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<style>#bungBack{position:fixed;z-index:2147483000;left:env(safe-area-inset-left);top:40%;width:30px;height:46px;box-sizing:border-box;border-radius:0 14px 14px 0;display:flex;align-items:center;justify-content:center;background:rgba(15,20,25,.5);color:#fff;border:1px solid rgba(255,255,255,.3);border-left:0;text-decoration:none;-webkit-tap-highlight-color:transparent;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);touch-action:manipulation;user-select:none;-webkit-user-select:none}#bungBack:hover{background:rgba(15,20,25,.75)}#bungBack:focus-visible{outline:2px solid #fff;outline-offset:2px}#bungBack svg{margin-left:-2px}</style>
<script>(function(){var a=document.getElementById('bungBack');if(!a)return;
['pointerdown','mousedown','touchstart','keydown'].forEach(function(t){a.addEventListener(t,function(e){e.stopPropagation();},{passive:true});});
a.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
if(!confirm('게임을 나가서 게임 목록으로 돌아갈까요?'))return;
var r=document.referrer,same=false;try{same=!!r&&new URL(r).origin===location.origin;}catch(_){}
if(same&&history.length>1){history.back();return;}
try{window.close();}catch(_){}
setTimeout(function(){location.href=a.getAttribute('href');},300);});})();</script>
</body>
