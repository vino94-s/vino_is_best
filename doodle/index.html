const playerIds = v => Object.keys((v && v.players) || {}).filter(id => !gone(v, id)).sort((a, b) => (v.players[a].j || 0) - (v.players[b].j || 0));

async function createRoom() {
  const btn = $('#lbCreate'); if (btn) btn.disabled = true;
  try {
    for (let n = 0; n < 8; n++) {
      const code = genCode(4), now = db.now();
      const r = await db.tx(PATH.room(code), c => {
        if (c && c.updatedAt && now - c.updatedAt < 86400e3) return undefined; // 쓰는 중인 코드
        return { code, host: me.pid, status: 'wait', createdAt: now, updatedAt: now, set: { draw: 60, guess: 30 }, players: { [me.pid]: { nick: me.nick, j: now } } };
      });
      if (r.committed) return enterRoom(code);
    }
    toast('방을 못 만들었어요. 다시 해 주세요');
  } catch (e) { console.warn(e); toast('연결이 불안정해요. 다시 해 주세요'); }
  finally { if (btn) btn.disabled = false; }
}
async function joinRoom(code, quiet) {
  code = String(code).toUpperCase();
  let why = '';
  try {
    const now = db.now();
    const r = await db.tx(PATH.room(code), c => {
      if (c == null) return null;
      const inGame = c.game && (c.game.order || []).includes(me.pid);
      if (c.status !== 'wait' && !inGame) { why = 'play'; return undefined; }
      c.players = c.players || {};
      if (c.status === 'wait') for (const id of Object.keys(c.players)) if (id !== me.pid && gone(c, id)) delete c.players[id];
      if (!c.players[me.pid] && playerIds(c).length >= CFG.maxPlayers) { why = 'full'; return undefined; }
      c.players[me.pid] = { nick: me.nick, j: (c.players[me.pid] && c.players[me.pid].j) || now };
      if (!c.host || gone(c, c.host)) c.host = me.pid;
      c.updatedAt = now;
      why = '';
      return c;
    });
    if (r.committed && r.value && r.value.players && r.value.players[me.pid]) return enterRoom(code);
    if (!r.value) why = 'none';
  } catch (e) { console.warn(e); why = 'net'; }
  store.sset('doodle-room', null);
  const msg = { none: '그런 방이 없어요. 코드를 확인해 주세요', play: '이미 게임 중인 방이에요. 끝나면 다시 들어와 주세요', full: '방이 꽉 찼어요 (최대 8명)', net: '연결이 불안정해요. 다시 해 주세요' }[why] || '들어가지 못했어요';
  if (quiet && why === 'none') { show('lobby'); return; }
  toast(msg, 2800);
  if (cur !== 'lobby') show('lobby');
  const e = $('#lbErr'); if (e) e.textContent = msg;
}
function enterRoom(code) {
  roomCode = code; leaving = false; store.sset('doodle-room', code);
  const pp = PATH.room(code) + '/players/' + me.pid;
  db.onDisconnectStamp(pp + '/off');
  if (roomOff) roomOff();
  room = null; phaseKey = '';
  roomOff = db.on(PATH.room(code), onRoom);
  if (connOff) connOff();
  let first = true;
  connOff = db.onConnected(ok => {
    if (!ok || leaving || !roomCode) return;
    if (first) { first = false; return; }
    // 다시 연결되면 나를 다시 넣어요 (끊긴 동안 빠졌을 수 있어요)
    db.onDisconnectStamp(pp + '/off');
    db.tx(PATH.room(code), c => {
      if (c == null) return null;
      const inGame = c.game && (c.game.order || []).includes(me.pid);
      if (c.status !== 'wait' && !inGame) return undefined;
      c.players = c.players || {};
      const mine = c.players[me.pid];
      if (mine && !mine.off) return undefined;
      if (!mine && playerIds(c).length >= CFG.maxPlayers) return undefined;
      c.players[me.pid] = { nick: me.nick, j: (mine && mine.j) || db.now() };
      return c;
    }).catch(() => {});
  });
  clearInterval(beatT); clearInterval(sweepT);
  beatT = setInterval(heartbeat, 20000);
  sweepT = setInterval(sweep, 5000);
}
// 대기실에서 나간 지 오래된 사람을 정리하고, 방장이 나갔으면 이어받아요
function sweep() {
  const v = room; if (!v || !roomCode) return;
  const ids = Object.keys(v.players || {});
  const stale = v.status === 'wait' && ids.some(id => gone(v, id));
  const hostGone = gone(v, v.host) && playerIds(v)[0] === me.pid;
  if (stale || hostGone) db.tx(PATH.room(roomCode), c => {
    if (c == null) return null;
    let ch = false;
    if (c.status === 'wait') for (const id of Object.keys(c.players || {})) if (gone(c, id)) { delete c.players[id]; ch = true; }
    if (gone(c, c.host)) { const n = playerIds(c)[0]; if (n && n !== c.host) { c.host = n; ch = true; } }
    return ch ? c : undefined;
  }).catch(() => {});
  else if (cur === 'room' && ids.some(id => v.players[id].off)) renderRoom();
}
async function leaveRoom() {
  if (!roomCode) return;
  const code = roomCode; leaving = true;
  if (roomOff) { roomOff(); roomOff = null; }
  if (connOff) { connOff(); connOff = null; }
  clearInterval(beatT); clearInterval(sweepT); stopTick();
  roomCode = null; room = null; phaseKey = ''; store.sset('doodle-room', null);
  try {
    db.cancelDisconnect(PATH.room(code) + '/players/' + me.pid + '/off');
    let empty = false;
    await db.tx(PATH.room(code), c => {
      if (c == null) return null;
      if (c.players) delete c.players[me.pid];
      const ids = playerIds(c);
      if (!ids.length && c.status === 'wait') { empty = true; return null; }
      if (c.host === me.pid) c.host = ids[0] || null;
      c.updatedAt = db.now();
      return c;
    });
    if (empty) db.remove(PATH.open + '/' + code);
  } catch (e) {}
}
// 방장이 '지금 모이는 방' 목록을 살아 있게 유지해요
function heartbeat() {
  if (!room || !roomCode) return;
  if (room.host === me.pid && room.status === 'wait') db.set(PATH.open + '/' + roomCode, { host: me.nick, n: playerIds(room).length, ts: db.now() }).catch(() => {});
}
let lastOpenSig = '';
function onRoom(v) {
  if (leaving) return;
  if (!v) { toast('방이 없어졌어요'); roomCode = null; room = null; store.sset('doodle-room', null); stopTick(); show('lobby'); return; }
  room = v;
  const ids = playerIds(v);
  // 방장이 나갔으면 가장 먼저 들어온 사람이 이어받아요
  if (gone(v, v.host) && ids[0] === me.pid) {
    db.tx(PATH.room(roomCode), c => { if (c == null) return null; if (!gone(c, c.host)) return undefined; c.host = me.pid; return c; }).catch(() => {});
  }
  if (v.status === 'wait') {
    if (v.host === me.pid) {
      const sig = ids.length + '|' + me.nick;
      if (sig !== lastOpenSig) { lastOpenSig = sig; heartbeat(); }
      db.onDisconnect(PATH.open + '/' + roomCode, null);
    }
    stopTick();
    if (cur !== 'room') show('room'); else renderRoom();
    return;
  }
  lastOpenSig = '';
  const g = v.game;
  if (!g || !(g.order || []).includes(me.pid)) { if (cur !== 'room') show('room'); else renderRoom(); return; }
  if (v.status === 'play') return onPlay(v);
  if (v.status === 'reveal') {
    stopTick();
    if (cur !== 'reveal' || revealGid !== g.gid) startReveal(v);
    else if (revealHost !== v.host && revealBooks.length) renderReveal(); // 방장이 바뀌면 '한 판 더' 버튼을 다시 그려요
    return;
  }
}

async function startGame() {
  const btn = $('#rmStart'); if (btn) btn.disabled = true;
  const code = roomCode;
  const r = await db.tx(PATH.room(code), c => {
    if (c == null) return null;
    const ids = playerIds(c).slice(0, CFG.maxPlayers);
    if (c.status !== 'wait' || c.host !== me.pid || ids.length < CFG.minPlayers) return undefined;
    const now = db.now();
    const order = shuffle(ids), deck = shuffle(WORDS), cards = {}, nicks = {};
    order.forEach((id, i) => { cards[id] = deck.slice(i * CFG.cards, (i + 1) * CFG.cards); nicks[id] = c.players[id].nick; });
    const set = { draw: (c.set && c.set.draw) || 60, guess: (c.set && c.set.guess) || 30 };
    c.game = { gid: now.toString(36) + rid(5), order, nicks, cards, R: order.length, r: 0, ends: now + CFG.pickSec * 1000, set, started: now };
    c.status = 'play'; c.updatedAt = now;
    return c;
  }).catch(() => ({ committed: false }));
  if (r.committed) { db.remove(PATH.open + '/' + code).catch(() => {}); db.cancelDisconnect(PATH.open + '/' + code); }
  else { toast('시작하지 못했어요. 다시 눌러 주세요'); if (btn) btn.disabled = false; }
}

/* ══════════ 게임 진행 ══════════
   단계 0: 카드 고르기 · 홀수 단계: 그리기 · 짝수 단계: 맞히기
   seat i는 단계 r(≥1)에 seat (i-(r-1)) 의 스케치북을 받아요 → 1단계는 내 단어를 내가 그려요 */
let phaseKey = '', submittedKey = '', tickT = 0, advTry = 0, lastTickSec = -1;
const G = { pad: null, guessDraft: '' };
const seatOf = (g, pid) => (g.order || []).indexOf(pid);
const bookFor = (g, pid, r) => { const N = g.order.length, i = seatOf(g, pid); return g.order[((i - (r - 1)) % N + N) % N]; };
const workerFor = (g, owner, r) => { const N = g.order.length, s = seatOf(g, owner); return g.order[(s + r - 1) % N]; };
const kindOf = r => r === 0 ? 'pick' : (r % 2 ? 'draw' : 'guess');
const subOf = (g, pid) => { const s = g.sub && g.sub[pid]; return s == null ? -1 : s; };
const present = (v, pid) => !!(v.players && v.players[pid] && !v.players[pid].off);
function allIn(v) { const g = v.game; return g.order.every(p => subOf(g, p) >= g.r || gone(v, p)); }

function onPlay(v) {
  const g = v.game, key = g.gid + ':' + g.r;
  if (cur !== 'play') show('play');
  if (key !== phaseKey) { phaseKey = key; buildPhase(v); }
  updateHud(v);
  startTick();
}
function startTick() { if (!tickT) tickT = setInterval(tick, 250); }
function stopTick() { clearInterval(tickT); tickT = 0; }
function tick() {
  const v = room; if (!v || v.status !== 'play' || !v.game) return;
  const g = v.game, left = g.ends - db.now();
  updateTimer(g, left);
  // 내 시간이 끝나면 지금까지 한 걸 자동으로 내요
  if (left <= 0 && subOf(g, me.pid) < g.r && submittedKey !== phaseKey) autoSubmit(g);
  // 모두 냈거나 시간이 지나면 다음 단계로 (누가 먼저 넘겨도 한 번만 넘어가요)
  if ((allIn(v) || left < -CFG.grace) && Date.now() - advTry > 1500) { advTry = Date.now(); advance(g.r); }
}
async function advance(r) {
  const res = await db.tx(PATH.room(roomCode), c => {
    if (c == null) return null;
    const g = c.game; if (c.status !== 'play' || !g || g.r !== r) return undefined;
    const now = db.now();
    if (!(allIn(c) || now - g.ends > CFG.grace)) return undefined;
    if (r === 0) { g.words = g.words || {}; for (const p of g.order) if (!g.words[p]) g.words[p] = shuffle(g.cards[p])[0]; }
    g.r = r + 1;
    if (g.r > g.R) { c.status = 'reveal'; g.ends = 0; g.ended = now; }
    else g.ends = now + (kindOf(g.r) === 'draw' ? g.set.draw : g.set.guess) * 1000;
    c.updatedAt = now;
    return c;
  }).catch(() => null);

}
function phaseTitle(g) {
  const k = kindOf(g.r);
  return k === 'pick' ? '🃏 단어 카드 고르기' : k === 'draw' ? '🎨 그려요!' : '🤔 뭘 그린 걸까?';
}
function updateHud(v) {
  const g = v.game, box = $('#subs'); if (!box) return;
  box.innerHTML = g.order.map(p => `<span class="chip ${subOf(g, p) >= g.r ? 'ok' : ''} ${present(v, p) ? '' : 'off'}">${subOf(g, p) >= g.r ? '✓' : '…'} ${esc(g.nicks[p])}</span>`).join('');
  const w = $('#waitList'); if (w) { const left = g.order.filter(p => subOf(g, p) < g.r && !gone(v, p)).map(p => g.nicks[p]); w.textContent = left.length ? `기다리는 중: ${left.join(', ')}` : '다 냈어요! 곧 넘어가요'; }
}
function updateTimer(g, left) {

  if (!el) return;
  el.textContent = s; el.classList.toggle('low', s <= 5 && s > 0 && subOf(g, me.pid) < g.r);
  const total = (g.r === 0 ? CFG.pickSec : kindOf(g.r) === 'draw' ? g.set.draw : g.set.guess) * 1000;
  if (bar) bar.style.width = Math.max(0, Math.min(100, left / total * 100)) + '%';
  if (s <= 5 && s > 0 && s !== lastTickSec && subOf(g, me.pid) < g.r) { lastTickSec = s; Sfx.play('tick'); }
}
async function buildPhase(v) {
  const g = v.game, el = $('#s-play'), k = kindOf(g.r);
  submittedKey = ''; lastTickSec = -1; G.pad = null;
  el.innerHTML = `
    <div class="hud">
      <div class="ph"><span class="t">${phaseTitle(g)}</span><span class="chip">${g.r === 0 ? '준비' : `${g.r} / ${g.R}`}</span><span class="sec" id="sec"></span></div>
      <div class="bar"><i id="bar"></i></div>

  $('#plLeave', el).onclick = async () => { if (await confirmBox('게임에서 나갈까요? 내 차례는 빈칸으로 넘어가요', '나가기', '계속하기')) { await leaveRoom(); show('lobby'); } };

/* ── 0단계: 단어 카드 ── */
function buildPick(body, g) {
  const cards = g.cards[me.pid] || [];
  body.innerHTML = `<p class="task">카드 한 장을 골라요!<br><span class="small muted" style="font-family:var(--f)">뒤집힌 단어가 내 스케치북의 제시어가 돼요</span></p>
    <div class="cards">${cards.map((w, i) => `<button class="wc" data-i="${i}"><span class="b">?</span><span class="f">${esc(w)}</span></button>`).join('')}</div>`;
  let picked = false;
  $$('.wc', body).forEach(b => b.onclick = async () => {
    if (picked) return; picked = true;
    const w = cards[Number(b.dataset.i)];
    b.classList.add('open'); Sfx.play('flip');
    $$('.wc', body).forEach(o => { if (o !== b) o.classList.add('dim'); });
    submittedKey = phaseKey;
    await sleep(1100);
    submitPick(w);
  });
}
async function submitPick(w) {

  submittedKey = phaseKey;
  try { await db.update(PATH.room(roomCode) + '/game', { ['words/' + me.pid]: w, ['sub/' + me.pid]: 0 }); } catch (e) { toast('연결이 불안정해요'); }
  if (room && room.game && room.game.r === 0) { showWait($('#phaseBody'), room.game); updateHud(room); }
}

/* ── 앞 장 가져오기 (비어 있으면 그 앞 장) ── */
async function prevContent(g, owner, r, want) {
  // want: 'text'(그릴 때) | 'img'(맞힐 때)
  for (let k = r - 1; k >= 0; k -= 2) {

function makePad(cv, tools) {

    const p = s.p;

    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) { const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2; ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my); }

  redraw();
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * cv.width), Math.round((e.clientY - r.top) / r.height * cv.height)]; };

    if (pid !== null) return; e.preventDefault(); pid = e.pointerId; try { cv.setPointerCapture(pid); } catch (er) {}

  function renderTools() {
    tools.innerHTML = COLORS.map(c => `<button class="sw ${!st.eraser && st.color === c ? 'on' : ''}" data-c="${c}" style="background:${c}" aria-label="색"></button>`).join('')
      + `<span style="flex-basis:100%;height:0"></span>`
      + SIZES.map((s, i) => `<button class="tb ${st.size === i ? 'on' : ''}" data-s="${i}" aria-label="굵기"><span class="dot" style="width:${Math.min(20, 4 + s * .7)}px;height:${Math.min(20, 4 + s * .7)}px"></span></button>`).join('')
      + `<button class="tb ${st.eraser ? 'on' : ''}" data-e>🧽 지우개</button><button class="tb" data-u>↩️</button><button class="tb" data-x>🗑️</button>`;
    $$('[data-c]', tools).forEach(b => b.onclick = () => { st.color = b.dataset.c; st.eraser = false; renderTools(); });
    $$('[data-s]', tools).forEach(b => b.onclick = () => { st.size = Number(b.dataset.s); renderTools(); });
    $('[data-e]', tools).onclick = () => { st.eraser = !st.eraser; renderTools(); };
    $('[data-u]', tools).onclick = () => { st.strokes.pop(); redraw(); };
    $('[data-x]', tools).onclick = async () => { if (!st.strokes.length) return; if (await confirmBox('다 지울까요?', '지우기', '아니요')) { st.strokes = []; redraw(); } };
  }
  renderTools();
  return {
    empty: () => !st.strokes.length,
    // 작게 줄여서 올려요 (사파리는 webp를 못 만들어서 jpg로)
    exportImg(w = 480, h = 360, q = .62) {
      const t = document.createElement('canvas'); t.width = w; t.height = h;
      const c2 = t.getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0, 0, w, h); c2.drawImage(cv, 0, 0, w, h);

};
function hofList() {
  const arr = Object.entries(hofCache || {}).filter(([, m]) => m && m.gid).map(([id, m]) => ({ id, ...m, lk: m.lk || 0 }));
  if (hofTab === 'rank') arr.sort((a, b) => b.lk - a.lk || b.ts - a.ts);
  else if (hofTab === 'new') arr.sort((a, b) => b.ts - a.ts);
  else { const mine = arr.filter(m => (m.players || []).includes(me.nick)); mine.sort((a, b) => b.ts - a.ts); return mine; }
  return arr;
}
function renderHof() {
  const box = $('#hofBody'); if (!box) return;
  const arr = hofList();
  if (!arr.length) { box.innerHTML = `<div class="card center d" style="font-size:20px">${hofTab === 'mine' ? '아직 내가 한 판이 없어요' : '아직 스케치북이 없어요.<br>첫 번째 주인공이 되어 보세요! 🎨'}</div>`; return; }
  const top = hofTab === 'rank' && arr[0] && arr[0].lk > 0 ? `<div class="hero"><div class="d">👑 이번 명예의 전당 1등</div><div class="sumline" style="margin:4px 0 0">${esc(arr[0].word)} ➜ ${esc(arr[0].last)}</div><div class="small">${esc(arr[0].owner)}의 스케치북 · ❤️ ${arr[0].lk}</div></div>` : '';
  box.innerHTML = top + `<div class="hofgrid">${arr.slice(0, hofLimit).map((m, i) => `
      <button class="hc" data-id="${esc(m.id)}">
        ${hofTab === 'rank' && m.lk > 0 && i < 3 ? `<span class="medal m${i + 1}">${i + 1}</span>` : hofTab === 'rank' && m.lk > 0 ? `<span class="medal">${i + 1}</span>` : ''}
        <span class="im" data-th="${esc(m.id)}"></span>
        <span class="tx"><span class="w">${esc(m.word)} ➜ ${esc(m.last)}</span>
        <span class="m"><span>${esc(m.owner)} · ${(m.players || []).length}명</span><span class="h">❤️ ${m.lk}</span></span>
        <span class="m"><span>${ago(m.ts)}</span><span>${LIKED[m.id] ? '내가 ❤️' : ''}</span></span></span>
      </button>`).join('')}</div>
    ${arr.length > hofLimit ? `<button class="btn" id="hfMore" style="margin-top:12px">더 보기 (${arr.length - hofLimit}개 더)</button>` : ''}`;
  $$('[data-id]', box).forEach(b => b.onclick = () => openBook(b.dataset.id, 'hof'));
  const mo = $('#hfMore', box); if (mo) mo.onclick = () => { hofLimit += 40; renderHof(); };
  // 미리보기 그림은 화면에 보일 때만 불러요
  if (thumbObs) thumbObs.disconnect();
  const load = async t => { if (t.dataset.done) return; t.dataset.done = 1; const u = await db.get(PATH.thumb(t.dataset.th)).catch(() => null); if (u && /^data:image\//.test(u)) t.style.backgroundImage = `url("${u}")`; };
  if ('IntersectionObserver' in window) { thumbObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { thumbObs.unobserve(e.target); load(e.target); } }), { rootMargin: '200px' }); $$('[data-th]', box).forEach(t => thumbObs.observe(t)); }
  else $$('[data-th]', box).forEach(load);
}

/* ── 명예의 전당 스케치북 보기 ── */
let bookBack = 'hof', bookId = null;
async function openBook(id, back) {
  bookBack = back || 'hof'; bookId = id;
  show('book');
  const el = $('#s-book');
  el.innerHTML = `<div class="waitbox"><div class="big"><span class="wiggle">📖</span> 펼치는 중…</div></div>`;
  let m = hofCache && hofCache[id];
  try { m = (await db.get(PATH.hof + '/' + id)) || m; } catch (e) {}
  if (!m) { el.innerHTML = `<div class="top"><button class="back" id="bkBack">←</button></div><div class="card center">스케치북을 찾지 못했어요</div>`; $('#bkBack', el).onclick = () => show(bookBack); return; }
  const raw = (await db.get(PATH.pg(m.gid) + '/' + m.opid).catch(() => null)) || {};
  const pages = [{ t: 'w', v: m.word, by: m.owner, pid: m.opid }];
  for (let r = 1; r < (m.n || 1); r++) { const p = raw[r]; pages.push(p || { t: r % 2 ? 'd' : 'g', v: r % 2 ? null : '???', by: '?', pid: '?' }); }
  const sibs = Object.entries(hofCache || {}).filter(([k, x]) => x && x.gid === m.gid && k !== id);
  if (cur !== 'book' || bookId !== id) return;
  const d = new Date(m.ts + 9 * 3600e3);
  el.innerHTML = `
    <div class="top"><button class="back" id="bkBack">←</button><div class="grow d" style="font-size:24px">${esc(m.owner)}의 스케치북</div><button class="btn sm ghost" id="bkShare" style="flex:none">🔗 공유</button></div>
    <div class="card center" style="margin-top:4px">
      <div class="sumline"><span class="a">${esc(m.word)}</span> ➜ <span class="z">${esc(m.last)}</span></div>
      <p class="small muted" style="margin:4px 0 10px">${d.getUTCFullYear()}.${d.getUTCMonth() + 1}.${d.getUTCDate()} · 함께한 사람: ${esc((m.players || []).join(', '))}</p>
      <div id="likeBox"></div>
    </div>
    <div class="book">${pages.map((p, i) => (i ? '<div class="arrow">▼</div>' : '') + pageHtml(p, i, pages.length)).join('')}</div>
    ${sibs.length ? `<h3>같은 판의 다른 스케치북</h3><div class="tabs" style="flex-wrap:wrap">${sibs.map(([k, x]) => `<button data-sib="${esc(k)}">${esc(x.owner)} · ${esc(x.word)} ➜ ${esc(x.last)}</button>`).join('')}</div>` : ''}`;
  $('#bkBack', el).onclick = () => show(bookBack);
  $('#bkShare', el).onclick = () => { const u = location.origin + location.pathname + '?book=' + encodeURIComponent(id) + (db.mode === 'local' ? '&local=1' : ''); try { navigator.clipboard.writeText(u).then(() => toast('스케치북 링크를 복사했어요'), () => toast(u, 4000)); } catch (e) { toast(u, 4000); } };
  $$('[data-sib]', el).forEach(b => b.onclick = () => openBook(b.dataset.sib, bookBack));
  renderLike($('#likeBox', el), id, m.opid);
}

/* ══════════ 새 버전 확인 ══════════ */
async function checkVersion() {
  try {
    const v = (await (await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })).text()).trim();
    if (v && v !== APP_VERSION && !roomCode && ['lobby', 'hof', 'nick'].includes(cur)) location.reload();
  } catch (e) {}
}

/* ══════════ 확대 막기 ══════════ */
(function lockZoom() {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = e.timeStamp || Date.now(), quick = now - lastEnd < 320; lastEnd = now;
    if (!quick) return;
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'CANVAS') return;
    e.preventDefault();
    const b = t && t.closest && t.closest('button,a');
    if (b && !b.disabled) b.click();
  }, { passive: false });
  addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
})();

/* ══════════ 시작 ══════════ */
(async function boot() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('room')) pendingRoom = qs.get('room').toUpperCase().slice(0, 4);
  if (qs.get('book')) pendingBook = qs.get('book');
  if (qs.get('local') === '1') db = new LocalDB();
  else {
    db = new FireDB();
    for (let n = 1; ; n++) {
      try { await db.init(); break; }
      catch (e) { console.warn('Firebase 연결 재시도', n, e); $('#s-boot p').textContent = n > 1 ? `서버에 연결하는 중… (${n}번째)` : '서버에 연결하는 중…'; await sleep(Math.min(6000, 1000 * n)); }
    }
    setInterval(checkVersion, 120000);
  }
  if (qs.get('room') || qs.get('book')) { try { history.replaceState(null, '', location.pathname + (db.mode === 'local' ? '?local=1' : '')); } catch (e) {} }
  if (!me.nick) show('nick'); else afterNick();
})();
</script>
