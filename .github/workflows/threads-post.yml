# 쓰레드(@geppetto_wood94) 예약 게시. Claude 크레딧과 무관하게 GitHub에서 실행된다.
# 큐·스크립트는 threads-images 브랜치의 automation/ 폴더에 있다.
# automation/GH_ACTIVE 파일이 있을 때만 게시한다(Claude 쪽 예약 게시와 겹치지 않게 전환용).
name: threads-post
on:
  schedule:
    # GitHub 예약 실행은 늦거나 빠지는 일이 있어서 15분마다 돌린다.
    # 시간이 안 된 글은 게시하지 않으므로, 글이 없을 땐 바로 끝난다.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: threads-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: threads-images
      - name: 시간이 된 글 1건 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          if [ ! -f automation/GH_ACTIVE ]; then echo "GH_ACTIVE 없음: 건너뜀"; exit 0; fi
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ]; then echo "시크릿 없음: 건너뜀"; exit 0; fi
          cd automation && python3 threads_post.py
      - name: 게시 결과 저장
        run: |
          git config user.name "threads-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation
          git diff --cached --quiet && exit 0
          git commit -m "게시 결과 기록"
          for i in 1 2 3; do git pull --rebase -q origin threads-images && git push -q origin HEAD:threads-images && exit 0; sleep 5; done
          exit 1
