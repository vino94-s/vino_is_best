<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>대환장 바둑벙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-column game console — a wooden 바둑판 sits on a deep navy tournament table; every screen is a stack of large tap targets. Single committed dark look. */
:root{
  --bg:#13203a; --panel:#1c2b4b; --panel-2:#243659; --line:#33476f;
  --fg:#f4ede0; --muted:#9db0d0; --accent:#ffcf3f; --accent-ink:#2a1f05;
  --wood:#dcac5f; --wood-2:#c48f42; --ink:#2b1c0c; --win:#7be0a0; --lose:#ff7a7a;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 50% -10%,#22355c 0,transparent 60%);overflow-x:hidden}
.app{max-width:520px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
h1,h2,.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:40px;line-height:1.05;color:var(--accent)}
h2{font-size:24px}
.sub{color:var(--muted);font-size:14px;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;text-align:left;display:flex;align-items:center;gap:12px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--panel-2)}
.btn.big{padding:18px;font-family:var(--f-display);font-size:24px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;justify-content:center;font-family:var(--f-display);font-size:20px}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:2px}
.btn.primary small{color:inherit;opacity:.7}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none}
.chip{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
input[type=text]{font:inherit;font-size:16px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.parade{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:6px 0}
.parade img{width:42px;height:42px;border-radius:50%;box-shadow:0 3px 0 #0006;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.gamebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gamebtns .btn{flex-direction:column;align-items:flex-start;gap:4px}
.ico{width:44px;height:44px;flex:none}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;border:2px solid transparent;background:var(--panel);position:relative}
.pk img{width:100%;max-width:64px;aspect-ratio:1;border-radius:50%;box-shadow:0 3px 0 #0007}
.pk span{font-size:13px}
.pk[aria-pressed=true]{border-color:var(--accent);background:var(--panel-2)}
.pk:disabled{opacity:.3}
.pk .tag{position:absolute;top:2px;right:4px;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 5px}
.say{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--f-display);font-size:15px;pointer-events:none;animation:pop .9s ease-out forwards;text-shadow:0 2px 0 #0008}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}20%{opacity:1;transform:translate(-50%,-100%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.st{aspect-ratio:1;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-display);font-size:20px;position:relative;font-variant-numeric:tabular-nums}
.st img{width:44%;border-radius:50%}
.st.cleared{border-color:var(--win)}
.st.boss{background:linear-gradient(160deg,#3a2d55,var(--panel))}
.st:disabled{opacity:.3}
.tierlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.tier{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:baseline}
.tier b{font-family:var(--f-display);font-weight:400;color:var(--fg);font-size:16px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;border:2px solid transparent;min-width:0}
.pl.r{flex-direction:row-reverse;text-align:right}
.pl img{width:38px;height:38px;border-radius:50%;flex:none}
.pl .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ct{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.pl.on{border-color:var(--accent);background:var(--panel)}
.vs .mid{font-family:var(--f-display);color:var(--muted)}
.stagebox{position:relative}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:1;border-radius:10px;touch-action:none;box-shadow:0 10px 0 #0b1427,0 18px 30px #0008}
.status{min-height:22px;text-align:center;color:var(--muted);font-size:14px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0b1427cc;border-radius:10px;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.card img{width:96px;height:96px;border-radius:50%;margin:0 auto;box-shadow:0 5px 0 #0008}
.card h2{font-size:34px}
.card .w{color:var(--win)} .card .l{color:var(--lose)}
.tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-radius:12px;font-variant-numeric:tabular-nums}
.rk .n{font-family:var(--f-display);font-size:20px;color:var(--muted);text-align:center}
.rk:nth-child(1) .n{color:#ffd54a}.rk:nth-child(2) .n{color:#d6dbe4}.rk:nth-child(3) .n{color:#e09a5b}
.rk .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .val{font-size:14px;color:var(--muted);text-align:right}
.rk .val b{color:var(--fg);font-family:var(--f-display);font-weight:400;font-size:17px}
.rk.me{outline:2px solid var(--accent)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--panel);border-radius:12px;font-size:14px;line-height:1.6}
.toggle{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.codebox{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px dashed var(--accent);border-radius:14px;padding:12px 14px}
.code{font-family:var(--f-display);font-size:40px;letter-spacing:.18em;color:var(--accent);user-select:all;-webkit-user-select:all;font-variant-numeric:tabular-nums}
.codein{text-transform:uppercase;letter-spacing:.3em;font-family:var(--f-display)!important;font-size:24px!important;text-align:center}
.slot{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--panel);border:2px solid var(--line);min-width:0}
.slot img{width:48px;height:48px;border-radius:50%;flex:none}
.slot .who{font-size:12px;color:var(--muted)}
.slot b{display:block;font-family:var(--f-display);font-weight:400;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .rdy{color:var(--win);font-size:12px}
.slot.empty{justify-content:center;color:var(--muted);font-size:13px;min-height:72px;border-style:dashed}
.slot.ready{border-color:var(--win)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{min-height:20px;font-size:14px;color:var(--muted);text-align:center;margin:0}
.msg.err{color:var(--lose)}
@media (prefers-reduced-motion:reduce){.parade img{animation:none}.say{animation-duration:.01s}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="app">
  <!-- HOME -->
  <section id="s-home" class="app" style="padding:0">
    <div class="row" style="justify-content:space-between">
      <span class="chip">알까기 · 오목</span>
      <button class="toggle" id="sndBtn"></button>
    </div>
    <h1>대환장 바둑벙</h1>
    <p class="sub">묭라닥부터 용왕까지, 열 명의 얼굴이 바둑알이 됐어요. 알을 골라 튕기고, 다섯 개를 이어 보세요.</p>
    <div class="parade" id="parade"></div>
    <div>
      <label for="nick">내 닉네임 (랭킹에 표시돼요)</label>
      <input type="text" id="nick" maxlength="10" placeholder="닉네임을 입력하세요">
    </div>
    <div class="gamebtns">
      <button class="btn big" data-game="alk"><svg class="ico" viewBox="0 0 44 44"><circle cx="14" cy="28" r="10" fill="#f4ede0"/><circle cx="31" cy="15" r="10" fill="#ffcf3f"/><path d="M22 22l5-5" stroke="#9db0d0" stroke-width="3" stroke-linecap="round"/></svg>알까기<small>손가락으로 튕겨 판 밖으로</small></button>
      <button class="btn big" data-game="omok"><svg class="ico" viewBox="0 0 44 44"><g fill="#ffcf3f"><circle cx="8" cy="36" r="5"/><circle cx="15" cy="29" r="5"/><circle cx="22" cy="22" r="5"/><circle cx="29" cy="15" r="5"/><circle cx="36" cy="8" r="5"/></g></svg>오목<small>다섯 알을 먼저 한 줄로</small></button>
    </div>
    <button class="btn" id="toRank"><svg class="ico" viewBox="0 0 44 44" style="width:28px;height:28px"><path d="M8 36V22h8v14zM18 36V10h8v26zM28 36V16h8v20z" fill="#ffcf3f"/></svg><span class="grow">공개 랭킹 보기<small>봇 대결 · 친구 대결 랭킹이 따로 있어요</small></span>›</button>
  </section>

  <!-- MODE -->
  <section id="s-mode" class="app" style="padding:0" hidden>
    <div class="top"><button class="back" data-back="home" aria-label="뒤로">‹</button><div><span class="chip" id="modeChip"></span><h2>누구랑 할까요?</h2></div></div>
    <button class="btn big" data-mode="bot"><span class="grow">봇 대결<small id="botProg"></small></span>›</button>
    <button class="btn big" data-mode="friend"><span class="grow">친구 대결<small>초대코드로 각자 휴대폰에서 원격 대결</small></span>›</button>
  </section>

  <!-- PICK -->
  <section id="s-pick" class="app" style="padding:0" hidden>
    <div class="top"><button class="back" data-back="mode" aria-label="뒤로">‹</button><div><span class="chip" id="pickChip"></span><h2 id="pickTitle">바둑알 고르기</h2></div></div>
    <p class="sub" id="pickHint">알을 누르면 그 알의 효과음과 대사가 나와요.</p>
    <div class="pick" id="pickGrid"></div>
    <button class="btn primary" id="pickGo" disabled>다음</button>
  </section>

  <!-- STAGE -->
  <section id="s-stage" class="app" style="padding:0" hidden>
    <div class="top"><button class="back" data-back="pick" aria-label="뒤로">‹</button><div><span class="chip" id="stageChip"></span><h2>단계 선택</h2></div></div>
    <p class="sub">5단계마다 봇의 급수가 올라요. 5·10·15·20단계는 보스전이에요.</p>
    <div class="stages" id="stageGrid"></div>
  </section>

  <!-- FRIEND -->
  <section id="s-friend" class="app" style="padding:0" hidden>
    <div class="top"><button class="back" data-back="mode" aria-label="뒤로">‹</button><div><span class="chip" id="friendChip"></span><h2>친구와 원격 대결</h2></div></div>
    <p class="sub">방을 만들면 4자리 초대코드가 나와요. 친구가 그 코드로 들어오면 각자 휴대폰에서 같은 판을 두게 돼요.</p>
    <div><label for="nickF">내 닉네임</label><input type="text" id="nickF" maxlength="10"></div>
    <button class="btn big" id="mkRoom"><span class="grow">방 만들기<small>초대코드를 받아 친구에게 보내기</small></span>›</button>
    <form id="joinForm" class="app" style="padding:0;gap:8px">
      <label for="codeIn" style="margin:0">초대코드로 입장</label>
      <div class="row"><input type="text" id="codeIn" class="codein grow" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD"><button class="btn primary" id="joinBtn" type="submit">입장</button></div>
    </form>
    <p class="msg" id="friendMsg"></p>
  </section>

  <!-- LOBBY -->
  <section id="s-lobby" class="app" style="padding:0" hidden>
    <div class="top"><button class="back" id="lobbyLeave" aria-label="방 나가기">‹</button><div class="grow"><span class="chip" id="lobbyChip"></span><h2>대기실</h2></div></div>
    <div class="codebox"><div><span class="chip">초대코드</span><div class="code" id="codeShow"></div></div><button class="btn" id="copyInv">초대 복사</button></div>
    <div class="slots"><div class="slot" id="slotMe"></div><div class="slot" id="slotOpp"></div></div>
    <p class="msg" id="lobbyMsg"></p>
    <div class="pick" id="lobbyGrid"></div>
    <button class="btn primary" id="readyBtn">준비 완료</button>
  </section>

  <!-- PLAY -->
  <section id="s-play" class="app" style="padding:0" hidden>
    <div class="top"><button class="back" id="quit" aria-label="그만두기">‹</button><div class="grow"><span class="chip" id="playChip"></span><h2 id="playTitle"></h2></div></div>
    <div class="vs">
      <div class="pl" id="pl0"><img alt=""><div style="min-width:0"><div class="nm"></div><div class="ct"></div></div></div>
      <div class="mid">VS</div>
      <div class="pl r" id="pl1"><img alt=""><div style="min-width:0"><div class="nm"></div><div class="ct"></div></div></div>
    </div>
    <div class="stagebox">
      <canvas id="cv" width="1000" height="1000"></canvas>
      <div class="overlay" id="over" hidden><div class="card" id="overCard"></div></div>
    </div>
    <div class="status" id="status"></div>
  </section>

  <!-- RANK -->
  <section id="s-rank" class="app" style="padding:0" hidden>
    <div class="top"><button class="back" data-back="home" aria-label="뒤로">‹</button><div><span class="chip">공개 랭킹</span><h2>명예의 바둑판</h2></div></div>
    <div class="tabs" role="tablist" id="rkMode"><button role="tab" data-v="bot" aria-selected="true">봇 대결</button><button role="tab" data-v="friend" aria-selected="false">친구 대결</button></div>
    <div class="tabs" role="tablist" id="rkGame"><button role="tab" data-v="alk" aria-selected="true">알까기</button><button role="tab" data-v="omok" aria-selected="false">오목</button></div>
    <div class="rank" id="rankList"></div>
    <p class="sub" id="rankNote"></p>
  </section>
</div>

const parade=$('#parade');CH.forEach((c,i)=>{const im=document.createElement('img');im.src=IMG[c.id];im.alt=c.name;im.style.animationDelay=(i*.15)+'s';parade.appendChild(im)});
const nickIn=$('#nick');nickIn.value=nick;
nickIn.addEventListener('change',()=>{nick=cleanName(nickIn.value);nickIn.value=nick;store.set('nick',nick)});
function cleanName(s){return (s||'').replace(/\s+/g,' ').trim().slice(0,10)}
function ensureNick(){nick=cleanName(nickIn.value)||nick;if(!nick){nick='플레이어'+Math.floor(Math.random()*900+100)}nickIn.value=nick;store.set('nick',nick)}
function setSnd(){$('#sndBtn').textContent=soundOn?'소리 켜짐':'소리 꺼짐'}setSnd();
$('#sndBtn').onclick=()=>{soundOn=!soundOn;store.set('sound',soundOn);setSnd();if(soundOn)initAudio()};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show(b.dataset.back));
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{initAudio();ensureNick();sel.game=b.dataset.game;$('#modeChip').textContent=GN[sel.game];$('#botProg').textContent=`${prog[sel.game]}/20단계 클리어 · 5단계마다 난이도 상승`;show('mode')});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode==='friend'){openFriend();return}sel.mode='bot';sel.p=[sel.p[0],null];openPick()});
$('#toRank').onclick=()=>{ensureNick();show('rank')};

function openPick(){
  $('#pickChip').textContent=GN[sel.game]+' · 봇 대결';
  renderPick();show('pick');
}
function sayPop(btn,c){const s=document.createElement('span');s.className='say';s.style.color=c.color;s.textContent=c.say;btn.appendChild(s);setTimeout(()=>s.remove(),900)}
function renderGrid(el,cur,blocked,onPick,tags){
  el.innerHTML='';
  CH.forEach(c=>{
    const b=document.createElement('button');b.className='pk';b.type='button';
    b.setAttribute('aria-pressed',cur===c.id);b.disabled=blocked===c.id;
    b.innerHTML=`<img src="${IMG[c.id]}" alt=""><span>${c.name}</span>`+(tags&&tags[c.id]?`<i class="tag">${tags[c.id]}</i>`:'');
    b.onclick=()=>{playSnd(c,.8);onPick(c.id);const nb=el.children[CH.indexOf(c)];if(nb)sayPop(nb,c)};
    el.appendChild(b);
  });
}
function renderPick(){
  $('#pickTitle').textContent='내 바둑알 고르기';
  renderGrid($('#pickGrid'),sel.p[0],null,id=>{sel.p[0]=id;renderPick()});
  const go=$('#pickGo');go.textContent='단계 고르기';go.disabled=!sel.p[0];
}
$('#pickGo').onclick=()=>openStages();
function botChar(stage){
  const mine=sel.p[0];
  if(stage%5===0){const boss=['goran','haessal','juntak','yongwang'][stage/5-1];return boss!==mine?boss:'myung'===mine?'bino':'myung'}
  let i=(stage*7+3)%10;if(CH[i].id===mine)i=(i+1)%10;return CH[i].id;
}
function openStages(){
  $('#stageChip').textContent=GN[sel.game]+' · 봇 대결';
  const g=$('#stageGrid');g.innerHTML='';
  for(let s=1;s<=20;s++){
    if(s%5===1){const t=document.createElement('div');t.className='tier';t.innerHTML=`<b>${TIERS[(s-1)/5]}</b>${s}~${s+4}단계`;g.appendChild(t)}
    const b=document.createElement('button');b.className='st'+(s<=prog[sel.game]?' cleared':'')+(s%5===0?' boss':'');
    b.disabled=s>prog[sel.game]+1;
    b.innerHTML=`<img src="${IMG[botChar(s)]}" alt="">${s}`;
    b.setAttribute('aria-label',s+'단계');
    b.onclick=()=>{sel.stage=s;startGame()};
    g.appendChild(b);
  }
  show('stage');
}

/* ---------- audio ---------- */
let AC=null;
function initAudio(){if(AC||!soundOn)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playSnd(c,str=1){
  if(!soundOn)return;initAudio();if(!AC)return;
  try{const t=AC.currentTime;const g=AC.createGain();g.connect(AC.destination);const vol=Math.min(.25,.06+.18*str);
    const o=AC.createOscillator();o.type=c.w;o.connect(g);const f=c.f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);
    if(c.sl==='up'){o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.8,t+.15);g.gain.exponentialRampToValueAtTime(.001,t+.22)}
    else if(c.sl==='up2'){o.frequency.setValueAtTime(f,t);o.frequency.setValueAtTime(f*1.5,t+.07);o.frequency.setValueAtTime(f*1.2,t+.14);g.gain.exponentialRampToValueAtTime(.001,t+.25)}
    else if(c.sl==='down'){o.frequency.setValueAtTime(f*1.4,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.3);g.gain.exponentialRampToValueAtTime(.001,t+.35)}
    else if(c.sl==='wob'){o.frequency.setValueAtTime(f,t);const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=14;lg.gain.value=f*.25;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+.4);g.gain.exponentialRampToValueAtTime(.001,t+.4)}
    else if(c.sl==='rep'){o.frequency.setValueAtTime(f,t);for(let i=1;i<5;i++)o.frequency.setValueAtTime(i%2?f*1.25:f,t+i*.04);g.gain.exponentialRampToValueAtTime(.001,t+.24)}
    else{o.frequency.setValueAtTime(f,t);g.gain.exponentialRampToValueAtTime(.001,t+.12)}
    o.start(t);o.stop(t+.45);
  }catch(e){}
}

/* ---------- canvas / effects ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');const L=1000;
function fitCanvas(){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);const px=Math.round((r.width||400)*d);if(cv.width!==px){cv.width=px;cv.height=px}}
window.addEventListener('resize',fitCanvas);
let parts=[],texts=[],shake=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function burst(c,x,y,k=1){
  if(FLIP){x=L-x;y=L-y}
  k=Math.max(.35,Math.min(1.6,k));const n=Math.round(10*k)+4;const P=(o)=>parts.push(Object.assign({x,y,vx:0,vy:0,life:0,max:50,s:10,rot:rnd(0,6.28),vr:rnd(-.2,.2),col:c.color,t:c.fx,g:0},o));
  switch(c.fx){
    case'feather':for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(2,7)*k;P({vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.06,max:rnd(50,80),s:rnd(10,18),col:i%4?'#ffffff':'#ff4a3d',drag:.93})}break;
    case'star':for(let i=0;i<n;i++){const a=i/n*6.28,v=rnd(5,10)*k;P({vx:Math.cos(a)*v,vy:Math.sin(a)*v,max:40,s:rnd(10,18),col:i%2?'#ffcf3f':'#fff2b0',drag:.9})}P({t:'flash',max:14,s:60*k,col:'#ffcf3f'});break;
    case'steam':for(let i=0;i<n;i++)P({x:x+rnd(-30,30),y:y+rnd(-10,10),vx:rnd(-.8,.8),vy:rnd(-2.5,-1),max:rnd(45,70),s:rnd(12,22),col:'#ffffff',grow:.5});break;
    case'drip':for(let i=0;i<n;i++){const a=rnd(-2.6,-.5),v=rnd(3,8)*k;P({vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.35,max:55,s:rnd(7,12),col:i%3?'#6fb7ff':'#bfe1ff'})}P({t:'puddle',max:40,s:30*k,col:'#6fb7ff'});break;
    case'sweat':for(let i=0;i<Math.max(3,n/3);i++){const a=rnd(-2.4,-.7),v=rnd(3,6);P({t:'drip',vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.3,max:40,s:9,col:'#cfe9ff'})}for(let i=0;i<n;i++){const a=rnd(0,6.28);P({t:'dust',vx:Math.cos(a)*rnd(1,3),vy:Math.sin(a)*rnd(1,3),max:35,s:rnd(8,14),col:'#9a8f80',grow:.4,drag:.92})}break;
    case'bang':for(let i=0;i<Math.max(5,n*.6);i++){const a=i/Math.max(5,n*.6)*6.28+rnd(-.2,.2),v=rnd(5,9)*k;P({vx:Math.cos(a)*v,vy:Math.sin(a)*v,max:38,s:rnd(26,40),rot:a+1.57,vr:0,col:'#1a1a1a',drag:.9})}shake=Math.max(shake,10*k);break;
    case'rays':P({t:'rays',max:40,s:120*k,col:'#ffb300'});for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(2,6);P({t:'spark',vx:Math.cos(a)*v,vy:Math.sin(a)*v,max:45,s:rnd(5,9),col:'#fff3a0',drag:.95})}break;
    case'ring':for(let i=0;i<3;i++)P({t:'ring',life:-i*6,max:36,s:40+i*10,col:i%2?'#ffffff':'#111111',k});break;
    case'confetti':for(let i=0;i<n*1.5;i++){const a=rnd(0,6.28),v=rnd(3,9)*k;P({vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.18,max:rnd(50,75),s:rnd(8,13),vr:rnd(-.4,.4),col:['#7ed957','#ff5d48','#ffd54a','#4fa8ff','#7ed957'][i%5],drag:.96})}break;
    case'wave':for(let i=0;i<3;i++)P({t:'wave',life:-i*7,max:45,s:30,col:'#4fc3f7',k});for(let i=0;i<n*.6;i++){const a=rnd(0,6.28),v=rnd(1,4);P({t:'spark',vx:Math.cos(a)*v,vy:Math.sin(a)*v,max:50,s:rnd(5,9),col:'#ffd54a',drag:.96})}break;
  }
  texts.push({x,y:y-50,txt:c.say,col:c.color,life:0,max:50,k});
  playSnd(c,k);
}
function updFx(){
  for(const p of parts){p.life++;if(p.life<0)continue;p.vy+=p.g;if(p.drag){p.vx*=p.drag;p.vy*=p.drag}p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.grow)p.s+=p.grow}
  parts=parts.filter(p=>p.life<p.max);for(const t of texts)t.life++;texts=texts.filter(t=>t.life<t.max);if(shake>0)shake*=.85;if(shake<.3)shake=0;
}
function drawFx(){
  for(const p of parts){if(p.life<0)continue;const a=1-p.life/p.max;ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.strokeStyle=p.col;
    switch(p.t){
      case'feather':ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.38,0,0,6.28);ctx.fill();ctx.strokeStyle='#0003';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-p.s,0);ctx.lineTo(p.s,0);ctx.stroke();break;
      case'star':star(p.s);break;
      case'flash':ctx.globalAlpha=a*.5;ctx.beginPath();ctx.arc(0,0,p.s*(1.5-a),0,6.28);ctx.fill();break;
      case'steam':ctx.globalAlpha=a*.7;ctx.beginPath();ctx.arc(0,0,p.s,0,6.28);ctx.fill();break;
      case'drip':ctx.rotate(-p.rot);ctx.beginPath();ctx.moveTo(0,-p.s*1.6);ctx.quadraticCurveTo(p.s,0,0,p.s);ctx.quadraticCurveTo(-p.s,0,0,-p.s*1.6);ctx.fill();break;
      case'puddle':ctx.rotate(-p.rot);ctx.globalAlpha=a*.6;ctx.beginPath();ctx.ellipse(0,20,p.s*(1.3-a*.5),p.s*.3,0,0,6.28);ctx.fill();break;
      case'dust':ctx.globalAlpha=a*.5;ctx.beginPath();ctx.arc(0,0,p.s,0,6.28);ctx.fill();break;
      case'bang':ctx.font='bold '+p.s+'px "Black Han Sans",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText('!',0,0);ctx.fillText('!',0,0);break;
      case'rays':{ctx.rotate(p.life*.03);const r=p.s*(1-a*.4);ctx.globalAlpha=a*.85;for(let i=0;i<12;i++){ctx.rotate(6.28/12);ctx.beginPath();ctx.moveTo(r*.35,-7);ctx.lineTo(r,0);ctx.lineTo(r*.35,7);ctx.fill()}ctx.globalAlpha=a*.4;ctx.beginPath();ctx.arc(0,0,r*.45,0,6.28);ctx.fill();break}
      case'spark':star(p.s);break;
      case'ring':ctx.lineWidth=6*a+1;ctx.beginPath();ctx.arc(0,0,p.s+p.life*4*(p.k||1),0,6.28);ctx.stroke();break;
      case'confetti':ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);break;
      case'wave':{ctx.rotate(-p.rot);ctx.lineWidth=4;const r=p.s+p.life*3.2*(p.k||1);ctx.beginPath();for(let i=0;i<=48;i++){const t=i/48*6.28,rr=r+Math.sin(t*8+p.life*.3)*5;i?ctx.lineTo(Math.cos(t)*rr,Math.sin(t)*rr*.55):ctx.moveTo(Math.cos(t)*rr,Math.sin(t)*rr*.55)}ctx.closePath();ctx.stroke();break}
    }ctx.restore()}
  for(const t of texts){const a=1-t.life/t.max;ctx.save();ctx.globalAlpha=Math.min(1,a*2);const sc=t.life<8?.6+t.life*.07:1.15;ctx.translate(t.x,t.y-t.life*1.2);ctx.scale(sc,sc);ctx.font='44px "Black Han Sans",sans-serif';ctx.textAlign='center';ctx.lineWidth=9;ctx.strokeStyle='#1a1206';ctx.strokeText(t.txt,0,0);ctx.fillStyle=t.col;ctx.fillText(t.txt,0,0);ctx.restore()}
}
function star(s){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.45:s,a=i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill()}
function drawStone(c,x,y,r,alpha=1,ring=true){
  if(!(r>3))return;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(30,15,0,.35)';ctx.beginPath();ctx.ellipse(x+r*.12,y+r*.2,r,r*.95,0,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.save();ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(x-r,y-r,2*r,2*r);if(c.img.complete)ctx.drawImage(c.img,x-r,y-r,2*r,2*r);
  const gr=ctx.createRadialGradient(x-r*.4,y-r*.5,r*.1,x,y,r*1.1);gr.addColorStop(0,'rgba(255,255,255,.35)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.28)');ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore();
  if(ring){ctx.lineWidth=Math.max(3,r*.12);ctx.strokeStyle=c.color;ctx.beginPath();ctx.arc(x,y,Math.max(1,r-ctx.lineWidth/2),0,6.28);ctx.stroke()}
  ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.stroke();
  ctx.restore();
}
function drawBoard(n,m){
  const g=ctx.createLinearGradient(0,0,L,L);g.addColorStop(0,'#e3b468');g.addColorStop(1,'#c8913f');ctx.fillStyle=g;ctx.fillRect(0,0,L,L);
  ctx.globalAlpha=.10;ctx.strokeStyle='#6b3d0c';for(let i=0;i<26;i++){ctx.lineWidth=rnd0(i)*3+1;ctx.beginPath();ctx.moveTo(0,i*40+rnd0(i+7)*20);ctx.bezierCurveTo(300,i*40-20,700,i*40+30,L,i*40+rnd0(i+3)*20);ctx.stroke()}ctx.globalAlpha=1;
  const c=(L-2*m)/(n-1);ctx.strokeStyle='#3b250e';ctx.lineWidth=2.2;
  for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(m,m+i*c);ctx.lineTo(L-m,m+i*c);ctx.stroke();ctx.beginPath();ctx.moveTo(m+i*c,m);ctx.lineTo(m+i*c,L-m);ctx.stroke()}
  const sp=n===15?[3,7,11]:[3,9,15];ctx.fillStyle='#3b250e';for(const a of sp)for(const b of sp){ctx.beginPath();ctx.arc(m+a*c,m+b*c,7,0,6.28);ctx.fill()}
}
function rnd0(i){const x=Math.sin(i*99.13)*4375.5;return x-Math.floor(x)}

/* ---------- game core ---------- */
let G=null,raf=0;
function stopLoop(){cancelAnimationFrame(raf);raf=0;if(G)G.dead=true}
function players(){
  if(sel.mode==='bot')return[{ch:byId(sel.p[0]),name:nick,bot:false},{ch:byId(botChar(sel.stage)),name:byId(botChar(sel.stage)).name+' 봇',bot:true}];

  $('#playChip').textContent=sel.mode==='bot'?`${GN[sel.game]} · ${TIERS[Math.ceil(sel.stage/5)-1]}`:`${GN[sel.game]} · 친구 대결 ${net.code}`;
  $('#playTitle').textContent=sel.mode==='bot'?`${sel.stage}단계${sel.stage%5===0?' 보스전':''}`:`${P[0].name} vs ${P[1].name}`;

  {const sw=sel.mode==='net'&&net.myIdx===1;$('#pl0').style.order=sw?3:1;$('#pl1').style.order=sw?1:3;document.querySelector('.vs .mid').style.order=2;$('#pl0').classList.toggle('r',sw);$('#pl1').classList.toggle('r',!sw)}

function draw(){const s=cv.width/L;ctx.setTransform(s,0,0,s,shake?rnd(-shake,shake)*s:0,shake?rnd(-shake,shake)*s:0);G.draw();drawFx()}
function hud(){if(!G)return;[0,1].forEach(i=>{const el=$('#pl'+i);el.classList.toggle('on',!G.over&&G.turn===i);el.querySelector('.ct').textContent=G.count?G.count(i):(G.turn===i&&!G.over?'차례':'')});}

$('#quit').onclick=()=>{if(sel.mode==='net'){if(G&&!G.over)nsend({t:'quit'});stopLoop();G=null;backToLobby();return}stopLoop();G=null;openStages()};
const mine=i=>!!G&&!G.P[i].bot&&!G.P[i].remote;
let FLIP=false;const FX=v=>FLIP?L-v:v;
function pt(e){const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*L,y=(e.clientY-r.top)/r.height*L;return{x:FX(x),y:FX(y)}}

/* ---------- 알까기 ---------- */
const R=40,MAXV=36,FR=.965;
function physStep(S,onHit){
  const SUB=4;
  for(let k=0;k<SUB;k++){
    for(const s of S)if(!s.fall){s.x+=s.vx/SUB;s.y+=s.vy/SUB}
    for(let i=0;i<S.length;i++){const a=S[i];if(a.fall)continue;for(let j=i+1;j<S.length;j++){const b=S[j];if(b.fall)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,rr=a.r+b.r;if(d2>=rr*rr||d2===0)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      const dvn=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(dvn>0){const j2=dvn*(1+.94)/2;a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny;
        if(onHit&&dvn>1.5){const sa=a.vx*a.vx+a.vy*a.vy,sb=b.vx*b.vx+b.vy*b.vy;onHit(sa<sb?a:b,a.x+nx*a.r,a.y+ny*a.r,dvn)}}
      const ov=(rr-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov}}
  }
  for(const s of S){if(s.fall)continue;s.vx*=FR;s.vy*=FR;if(s.vx*s.vx+s.vy*s.vy<.01){s.vx=0;s.vy=0}
    if(s.x<0||s.x>L||s.y<0||s.y>L)s.fall=1}
}
function newAlk(P){
  const S=[];const xs=[180,340,500,660,820];
  xs.forEach(x=>S.push({x,y:810,vx:0,vy:0,r:R,o:0,fall:0}));xs.forEach(x=>S.push({x,y:190,vx:0,vy:0,r:R,o:1,fall:0}));
  const g={P,S,turn:sel.mode==='net'?net.round%2:0,moving:false,over:false,drag:null,aim:null,hitCd:0,inbox:[],waiting:false,
    handle(d){if(d.t==='shot'&&S[d.i]&&!S[d.i].fall){this.shoot(S[d.i],d.vx,d.vy)}else if(d.t==='st'){d.S.forEach((q,k)=>{const s=S[k];if(!s)return;s.x=q[0];s.y=q[1];s.vx=0;s.vy=0;s.fall=q[2]?30:0});this.waiting=false;this.turn=d.turn;hud();if(d.w>=0)finish(d.w);else this.prompt()}},

    down(p){if(this.moving||this.over||this.aim||this.waiting||this.inbox.length||!mine(this.turn))return;let best=null,bd=(R*1.5)**2;for(const s of S){if(s.fall||s.o!==this.turn)continue;const d=(s.x-p.x)**2+(s.y-p.y)**2;if(d<bd){bd=d;best=s}}if(best)this.drag={s:best,x:p.x,y:p.y}},

      const arr=(s0,dx,dy,pw,col)=>{const s={x:FX(s0.x),y:FX(s0.y)};if(FLIP){dx=-dx;dy=-dy}const len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,Lg=60+pw*260;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=8;ctx.setLineDash([16,12]);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.x+ux*R,s.y+uy*R);ctx.lineTo(s.x+ux*Lg,s.y+uy*Lg);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=col;ctx.beginPath();const tx=s.x+ux*(Lg+22),ty=s.y+uy*(Lg+22);ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*30-uy*16,ty-uy*30+ux*16);ctx.lineTo(tx-ux*30+uy*16,ty-uy*30-ux*16);ctx.fill();ctx.restore()};

function simAlk(S,idx,vx,vy){const C=S.filter(s=>!s.fall).map(s=>({x:s.x,y:s.y,vx:0,vy:0,r:s.r,o:s.o,fall:0}));const sh=C[S.filter(s=>!s.fall).indexOf(S[idx])];sh.vx=vx;sh.vy=vy;
  for(let f=0;f<420;f++){physStep(C,null);if(C.every(s=>s.fall||(s.vx===0&&s.vy===0)))break}return C}
function evalAlk(C,me){let v=0;for(const s of C){const edge=Math.min(s.x,s.y,L-s.x,L-s.y);if(s.o===me){if(s.fall)v-=12;else if(edge<R*1.6)v-=1.5}else{if(s.fall)v+=10;else if(edge<R*1.6)v+=.6}}return v}
function botAlk(g){
  const me=g.turn,S=g.S,T=tier(),k=sub();

  let shot=null;
  if(T===1){const a=mine[Math.floor(Math.random()*mine.length)],b=opp[Math.floor(Math.random()*opp.length)];shot={s:a,ang:Math.atan2(b.y-a.y,b.x-a.x),pw:rnd(.55,1)}}
  else if(T===2){let b=opp[0],be=1e9;for(const o of opp){const e=Math.min(o.x,o.y,L-o.x,L-o.y);if(e<be){be=e;b=o}}let a=mine[0],ad=1e9;for(const m of mine){const d=Math.hypot(m.x-b.x,m.y-b.y);if(d<ad){ad=d;a=m}}shot={s:a,ang:Math.atan2(b.y-a.y,b.x-a.x),pw:.9}}
  else{let best=-1e9;const offs=T===3?[0]:[-.06,0,.06],pws=T===3?[.75,1]:[.6,.8,1];
    for(const a of mine)for(const b of opp){const base=Math.atan2(b.y-a.y,b.x-a.x);for(const of of offs)for(const pw of pws){const ang=base+of;const C=simAlk(S,S.indexOf(a),Math.cos(ang)*pw*MAXV,Math.sin(ang)*pw*MAXV);const v=evalAlk(C,me)+Math.random()*.1;if(v>best){best=v;shot={s:a,ang,pw}}}}}
  const noise=[[.22,.19,.16,.14,.12],[.10,.09,.08,.07,.06],[.05,.045,.04,.035,.03],[.025,.02,.016,.012,.008]][T-1][k];
  const ang=shot.ang+gauss()*noise,pw=Math.max(.35,Math.min(1,shot.pw*(1+gauss()*noise)));
  g.aim={s:shot.s,vx:Math.cos(ang)*pw*MAXV,vy:Math.sin(ang)*pw*MAXV,t:0};
}

/* ---------- 오목 ---------- */
const N=15,OM=56,CELL=(L-2*OM)/(N-1);
const DIRS=[[1,0],[0,1],[1,1],[1,-1]];
function newOmok(P){
  const B=Array.from({length:N},()=>Array(N).fill(-1));
  const first=sel.mode==='net'?net.round%2:(sel.stage>=16?1:0);
  const g={P,B,turn:first,over:false,last:null,ghost:null,line:null,moves:0,inbox:[],
    count:i=>i===first?'선':'후',
    tick(){if(this.inbox.length&&!this.over){const d=this.inbox.shift();if(d.t==='mv'&&B[d.y]&&B[d.y][d.x]===-1&&P[this.turn].remote)this.place(d.x,d.y)}},
    place(x,y){B[y][x]=this.turn;this.last={x,y};this.ghost=null;this.moves++;burst(P[this.turn].ch,OM+x*CELL,OM+y*CELL,.8);
      const ln=winLine(B,x,y,this.turn);if(ln){this.line=ln;finish(this.turn);return}
      if(this.moves>=N*N){finish(-1);return}
      this.turn=1-this.turn;hud();this.prompt()},
    prompt(){const p=P[this.turn];if(p.remote){setStatus(p.name+' 차례 · 기다리는 중…');return}if(p.bot){setStatus(p.name+'가 수읽기 중…');setTimeout(()=>{if(!this.over&&!g.dead){const m=botOmok(B,this.turn);this.place(m.x,m.y)}},450+Math.random()*350)}else setStatus((sel.mode==='net'?'내 차례 · ':'')+'둘 자리를 누르고, 한 번 더 누르면 착수')},
    down(p){if(this.over||!mine(this.turn))return;const x=Math.round((p.x-OM)/CELL),y=Math.round((p.y-OM)/CELL);if(x<0||y<0||x>=N||y>=N||B[y][x]!==-1)return;
      if(this.ghost&&this.ghost.x===x&&this.ghost.y===y){if(sel.mode==='net')nsend({t:'mv',x,y});this.place(x,y)}else this.ghost={x,y}},
    draw(){drawBoard(N,OM);const r=CELL*.47;
      for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(B[y][x]>=0)drawStone(P[B[y][x]].ch,OM+x*CELL,OM+y*CELL,r,1,true);
      if(this.last){ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([8,6]);ctx.beginPath();ctx.arc(OM+this.last.x*CELL,OM+this.last.y*CELL,r+5,0,6.28);ctx.stroke();ctx.restore()}
      if(this.ghost){drawStone(P[this.turn].ch,OM+this.ghost.x*CELL,OM+this.ghost.y*CELL,r,.55,true)}
      if(this.line){const[a,b]=this.line;ctx.save();ctx.strokeStyle=P[B[a[1]][a[0]]].ch.color;ctx.lineWidth=12;ctx.lineCap='round';ctx.globalAlpha=.85;ctx.beginPath();ctx.moveTo(OM+a[0]*CELL,OM+a[1]*CELL);ctx.lineTo(OM+b[0]*CELL,OM+b[1]*CELL);ctx.stroke();ctx.restore()}
    }};
  g.prompt();return g;
}
function winLine(B,x,y,p){for(const[dx,dy]of DIRS){let a=[x,y],b=[x,y],c=1;while(1){const nx=a[0]-dx,ny=a[1]-dy;if(nx<0||ny<0||nx>=N||ny>=N||B[ny][nx]!==p)break;a=[nx,ny];c++}while(1){const nx=b[0]+dx,ny=b[1]+dy;if(nx<0||ny<0||nx>=N||ny>=N||B[ny][nx]!==p)break;b=[nx,ny];c++}if(c>=5)return[a,b]}return null}
function ptScore(B,x,y,p){let tot=0;
  for(const[dx,dy]of DIRS){let c=1,open=0;
    for(const s of[1,-1]){let i=1;while(true){const nx=x+dx*i*s,ny=y+dy*i*s;if(nx<0||ny<0||nx>=N||ny>=N){break}const v=B[ny][nx];if(v===p){c++;i++}else{if(v===-1)open++;break}}}
    if(c>=5)tot+=1e7;else if(c===4)tot+=open===2?2e5:open===1?2.2e4:0;else if(c===3)tot+=open===2?8e3:open===1?700:0;else if(c===2)tot+=open===2?300:open===1?40:0;else tot+=open*4;}
  return tot}
function cands(B){const out=[];let any=false;for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(B[y][x]!==-1){any=true;continue}let near=false;for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&B[ny][nx]!==-1){near=true;break}}if(near)out.push({x,y})}if(!any)out.push({x:7,y:7});return out}
function botOmok(B,me){
  const op=1-me,T=tier(),k=sub();
  const defW=[.55,.85,1.0,1.05][T-1];
  const noise=[[.9,.8,.7,.6,.5],[.45,.4,.35,.3,.25],[.15,.12,.1,.08,.06],[.04,.03,.02,.01,0]][T-1][k];
  let C=cands(B).map(c=>{const a=ptScore(B,c.x,c.y,me),d=ptScore(B,c.x,c.y,op);return{...c,a,d,s:a+d*defW}});
  const win=C.find(c=>c.a>=1e7);if(win&&(T>1||Math.random()<.7+k*.06))return win;
  const blk=C.filter(c=>c.d>=1e7).sort((p,q)=>q.a-p.a)[0];if(blk&&(T>1||Math.random()<.45+k*.1))return blk;
  if(T===1&&Math.random()<.32-k*.05){C.sort((p,q)=>q.s-p.s);return C[Math.floor(Math.random()*Math.min(8,C.length))]}
  if(T===4){C.sort((p,q)=>q.s-p.s);const top=C.slice(0,10);let best=null,bv=-1e18;
    for(const c of top){B[c.y][c.x]=me;let rep=0;for(const r of cands(B)){const v=Math.max(ptScore(B,r.x,r.y,op),ptScore(B,r.x,r.y,me)*.8);if(v>rep)rep=v}B[c.y][c.x]=-1;const v=c.s-rep*.9;if(v>bv){bv=v;best=c}}
    if(best&&noise===0)return best;C=C.map(c=>c===best?{...c,s:c.s*1.5+1e3}:c)}
  for(const c of C)c.r=c.s*(1+gauss()*noise*.6)+Math.random()*noise*400;
  C.sort((p,q)=>q.r-p.r);return C[0];
}

  me:{name:'',ci:null,ready:false},opp:null,oppSid:null,oppPeer:null,round:0,myIdx:0,game:null,note:'',
  raw:null,outSeq:0,unacked:[],inSeq:0,buf:{},lastHeard:0,timer:0,helloTimer:0,peer:null,conn:null,room:null};

let roomNS;
async function getRoomNS(){if(roomNS!==undefined)return roomNS;try{roomNS=(window.claude&&window.claude.use)?await window.claude.use('room'):null}catch(e){roomNS=null}return roomNS}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function loadPeer(){if(window.Peer)return true;try{await loadScript('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js')}catch(e){try{await loadScript('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js')}catch(e2){return false}}return !!window.Peer}

function relReset(){net.outSeq=0;net.unacked=[];net.inSeq=0;net.buf={}}
function rawSend(m){m.f=net.sid;if(net.oppSid&&!m.to)m.to=net.oppSid;try{net.raw&&net.raw(m)}catch(e){}}
function nsend(d){if(!net.oppSid)return;const m={t:'r',s:++net.outSeq,d};net.unacked.push(m);rawSend(m)}
function onRaw(m){
  if(!m||typeof m!=='object'||m.f===net.sid||typeof m.f!=='string')return;
  if(m.to&&m.to!==net.sid)return;
  if(m.t==='hello'){
    if(!net.host)return;
    if(net.oppSid&&net.oppSid!==m.f&&Date.now()-net.lastHeard<8000){rawSend({t:'full',to:m.f});return}
    if(net.oppSid!==m.f){net.oppSid=m.f;relReset();net.opp=null;net.note=''}
    net.oppPeer=m._peer||null;net.lastHeard=Date.now();
    rawSend({t:'welcome',to:m.f,game:sel.game});sendMe();renderLobby();return;
  }
  if(m.t==='welcome'){
    if(net.host||net.oppSid===m.f)return;
    net.oppSid=m.f;net.oppPeer=m._peer||null;relReset();clearInterval(net.helloTimer);net.lastHeard=Date.now();
    sel.game=m.game==='omok'?'omok':'alk';net.note='';enterLobby();sendMe();return;
  }
  if(m.t==='full'){if(!net.host&&!net.oppSid){closeNet();friendMsg('이미 두 명이 대결 중인 방이에요.',true);friendBusy(false)}return}
  if(m.f!==net.oppSid)return;
  net.lastHeard=Date.now();
  if(m.t==='a'){net.unacked=net.unacked.filter(x=>x.s>m.s);return}
  if(m.t==='bye'){oppGone();return}
  if(m.t==='r'&&typeof m.s==='number'){
    if(m.s>net.inSeq)net.buf[m.s]=m.d;
    while(net.buf[net.inSeq+1]!==undefined){const d=net.buf[++net.inSeq];delete net.buf[net.inSeq];try{onData(d)}catch(e){}}
    rawSend({t:'a',s:net.inSeq});
  }
}
function onData(d){
  if(!d||typeof d!=='object')return;
  switch(d.t){
    case'me':net.opp={name:cleanName(d.name)||'친구',ci:byId(d.ci)?d.ci:null,ready:!!d.ready};renderLobby();maybeStart();break;
    case'start':if(!net.host&&Array.isArray(d.c)&&byId(d.c[0])&&byId(d.c[1]))startNet(d);break;
    case'shot':case'st':case'mv':if(G&&sel.mode==='net'&&!G.over)G.inbox.push(d);break;
    case'quit':if(G&&sel.mode==='net'&&!G.over){G.over=true;hud();showNetNote((net.opp?net.opp.name:'친구')+'님이 대결을 그만뒀어요.')}break;
  }
}
function tickNet(){
  if(!net.active)return;
  if(net.oppSid){
    for(const m of net.unacked.slice(0,8))rawSend(m);
    if(Date.now()-net.lastHeard>2500)rawSend({t:'hb'});
    if(Date.now()-net.lastHeard>15000)oppGone();
  }
}
async function openTransport(code,host){

    let r;try{r=await room.join('bdb-'+code.toLowerCase())}catch(e){return '연결하지 못했어요. 잠시 뒤 다시 시도해 주세요.'}
    net.room=r;
    r.on('g',msg=>{if(msg.sameTab)return;const d=msg.data;if(d&&typeof d==='object'){d._peer=msg.peer;onRaw(d)}},()=>{});
    r.onPeers(ch=>{if(net.oppPeer&&ch.left.some(p=>p.peer===net.oppPeer))oppGone()},()=>{});
    net.raw=m=>{r.emit('g',m).catch(()=>{})};
    if(host){try{await r.presence({role:'host'})}catch(e){}await sleep(1200);
      if(r.peers().some(p=>!p.sameTab&&p.presence&&p.presence.role==='host')){try{await r.leave()}catch(e){}net.room=null;return 'taken'}}
    return 'ok';
  }
  if(!(await loadPeer()))return '연결 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';
  net.kind='peer';
  net.raw=m=>{const c=net.conn;if(c&&c.open)c.send(m)};
  return await new Promise(res=>{
    let done=false;const fin=v=>{if(!done){done=true;res(v)}};
    if(host){
      const peer=new window.Peer(PEER_PREFIX+code.toLowerCase());net.peer=peer;
      peer.on('open',()=>fin('ok'));
      peer.on('connection',c=>{
        if(net.conn&&net.conn.open&&net.oppSid&&Date.now()-net.lastHeard<8000){c.on('open',()=>{try{c.send({t:'full',f:net.sid})}catch(e){}setTimeout(()=>c.close(),400)});return}
        try{if(net.conn)net.conn.close()}catch(e){}net.conn=c;wireConn(c);
      });
      peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
      peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy()}catch(x){}fin('taken')}else fin('연결 서버에 문제가 있어요. 잠시 뒤 다시 시도해 주세요.')});
    }else{
      const peer=new window.Peer();net.peer=peer;
      peer.on('open',()=>{const c=peer.connect(PEER_PREFIX+code.toLowerCase(),{reliable:true,serialization:'json'});net.conn=c;wireConn(c);fin('ok')});
      peer.on('error',e=>{if(e.type==='peer-unavailable'){if(!net.oppSid){closeNet();friendMsg('그 코드의 방이 없어요. 코드를 다시 확인해 주세요.',true);friendBusy(false)}}else fin('연결에 실패했어요. 잠시 뒤 다시 시도해 주세요.')});
    }
    setTimeout(()=>fin('연결 서버가 응답하지 않아요. 잠시 뒤 다시 시도해 주세요.'),12000);
  });
}
function wireConn(c){c.on('data',onRaw);c.on('close',()=>{if(c===net.conn&&net.oppSid)oppGone()});c.on('error',()=>{})}
function closeNet(){
  clearInterval(net.timer);clearInterval(net.helloTimer);
  try{if(net.conn)net.conn.close()}catch(e){}
  try{if(net.peer)net.peer.destroy()}catch(e){}
  try{if(net.room)net.room.leave().catch(()=>{})}catch(e){}
  Object.assign(net,{active:false,conn:null,peer:null,room:null,raw:null,oppSid:null,oppPeer:null,opp:null,note:''});relReset();
}
function genCode(){let c='';for(let k=0;k<4;k++)c+=CODE_CHARS[(Math.random()*CODE_CHARS.length)|0];return c}

/* 화면: 친구 대결 입구 */
function friendMsg(t,err){const m=$('#friendMsg');m.textContent=t||'';m.className='msg'+(err?' err':'')}
function friendBusy(b){$('#mkRoom').disabled=b;$('#joinBtn').disabled=b}
function openFriend(){ensureNick();closeNet();$('#friendChip').textContent=GN[sel.game];$('#nickF').value=nick;friendMsg('');friendBusy(false);show('friend')}
$('#nickF').addEventListener('change',()=>{const n=cleanName($('#nickF').value);if(n){nick=n;nickIn.value=n;store.set('nick',n)}$('#nickF').value=nick});
function myIdentity(){const n=cleanName($('#nickF').value);if(n){nick=n;nickIn.value=n;store.set('nick',n)}net.me={name:nick,ci:sel.p[0]||null,ready:false}}
$('#mkRoom').onclick=async()=>{
  initAudio();myIdentity();friendBusy(true);friendMsg('방을 만드는 중…');
  closeNet();net.host=true;net.myIdx=0;net.round=0;
  let r='taken';
  for(let n=0;n<5&&r==='taken';n++){net.code=genCode();r=await openTransport(net.code,true)}
  if(r!=='ok'){closeNet();friendBusy(false);friendMsg(r==='taken'?'방을 만들지 못했어요. 다시 눌러 주세요.':r,true);return}
  net.active=true;net.lastHeard=Date.now();net.timer=setInterval(tickNet,900);
  net.note='';enterLobby();
};
$('#joinForm').addEventListener('submit',async e=>{
  e.preventDefault();initAudio();
  const code=$('#codeIn').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==4){friendMsg('코드 4자리를 입력해 주세요.',true);return}
  myIdentity();friendBusy(true);friendMsg('방을 찾는 중…');
  closeNet();net.host=false;net.myIdx=1;net.code=code;
  const r=await openTransport(code,false);
  if(r!=='ok'){closeNet();friendBusy(false);friendMsg(r,true);return}
  net.active=true;net.timer=setInterval(tickNet,900);
  let tries=0;rawSend({t:'hello',name:net.me.name});
  net.helloTimer=setInterval(()=>{
    if(net.oppSid){clearInterval(net.helloTimer);return}
    if(++tries>12){clearInterval(net.helloTimer);closeNet();friendBusy(false);friendMsg('그 코드의 방을 찾지 못했어요. 코드를 확인하거나 친구에게 방을 다시 만들어 달라고 해 주세요.',true);return}
    rawSend({t:'hello',name:net.me.name});
  },1000);
});
$('#codeIn').addEventListener('input',e=>{const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(v!==e.target.value)e.target.value=v});

/* 화면: 대기실 */
function sendMe(){nsend({t:'me',name:net.me.name,ci:net.me.ci,ready:net.me.ready})}
function enterLobby(){
  sel.mode='net';FLIP=false;
  $('#lobbyChip').textContent=GN[sel.game]+' 방 · '+(net.host?'방장':'참가');
  $('#codeShow').textContent=net.code;
  show('lobby');renderLobby();
}
function slotHTML(p,who){const c=p.ci&&byId(p.ci);return (c?`<img src="${IMG[c.id]}" alt="">`:'<img alt="" style="background:var(--panel-2)">')+`<div style="min-width:0"><span class="who">${who}${p.ready?' · <span class="rdy">준비 완료</span>':''}</span><b>${esc(p.name)}</b><span class="who">${c?c.name:'알 고르는 중'}</span></div>`}
function renderLobby(){
  if($('#s-lobby').hidden)return;
  const me=net.me,op=net.opp,conn=!!net.oppSid;
  const sm=$('#slotMe');sm.className='slot'+(me.ready?' ready':'');sm.innerHTML=slotHTML(me,'나');
  const so=$('#slotOpp');
  if(op){so.className='slot'+(op.ready?' ready':'');so.innerHTML=slotHTML(op,'친구')}
  else{so.className='slot empty';so.textContent=conn?'친구가 들어오는 중…':(net.host?'친구를 기다리는 중…':'방장과 연결하는 중…')}
  const same=me.ci&&op&&op.ci===me.ci;
  let t;
  if(net.note&&!conn)t=net.note;
  else if(!conn)t=net.host?'초대코드를 친구에게 보내 주세요.':'방장과 연결하는 중…';
  else if(same)t='둘이 같은 알이에요. 한 명이 다른 알로 바꿔 주세요.';
  else if(!me.ci)t='내 바둑알을 고르고 준비 완료를 눌러 주세요.';
  else if(!me.ready)t='준비 완료를 누르면 시작해요.';
  else if(!op||!op.ready)t='친구가 준비하기를 기다리는 중…';
  else t='곧 시작해요!';
  const m=$('#lobbyMsg');m.textContent=t;m.className='msg'+(same?' err':'');
  const tags={};if(op&&op.ci)tags[op.ci]='친구';
  renderGrid($('#lobbyGrid'),me.ci,op?op.ci:null,id=>{if(net.me.ready){$('#lobbyMsg').textContent='준비를 풀어야 알을 바꿀 수 있어요.';return}net.me.ci=id;sel.p[0]=id;sendMe();renderLobby()},tags);
  const rb=$('#readyBtn');rb.textContent=me.ready?'준비 취소':'준비 완료';rb.disabled=!me.ci||!conn;
  rb.style.background=me.ready?'var(--panel-2)':'';rb.style.color=me.ready?'var(--fg)':'';
}
$('#readyBtn').onclick=()=>{net.me.ready=!net.me.ready;sendMe();renderLobby();maybeStart()};
$('#lobbyLeave').onclick=()=>leaveRoom();
function maybeStart(){
  const me=net.me,op=net.opp;
  if(!net.host||$('#s-lobby').hidden||!op||!me.ready||!op.ready||!me.ci||!op.ci||me.ci===op.ci)return;
  net.round++;
  const d={t:'start',game:sel.game,c:[me.ci,op.ci],names:[me.name,op.name===me.name?op.name+'2':op.name],round:net.round};
  nsend(d);startNet(d);
}
function startNet(d){
  sel.mode='net';sel.game=d.game==='omok'?'omok':'alk';
  net.game={c:d.c,names:d.names.map(n=>cleanName(n)||'친구')};net.round=d.round|0;
  net.me.ready=false;if(net.opp)net.opp.ready=false;
  startGame();
}
function backToLobby(){FLIP=false;net.me.ready=false;sendMe();enterLobby()}
function leaveRoom(){
  if(net.oppSid)rawSend({t:'bye'});
  setTimeout(closeNet,200);
  stopLoop();G=null;sel.mode='bot';FLIP=false;show('mode');
}
function oppGone(){
  if(!net.oppSid)return;
  const name=net.opp?net.opp.name:'친구';
  net.oppSid=null;net.oppPeer=null;net.opp=null;relReset();
  if(G&&sel.mode==='net'){stopLoop();G=null}
  if(net.host){net.me.ready=false;net.note=name+'님이 나갔어요. 같은 코드로 다시 들어올 수 있어요.';enterLobby()}
  else{closeNet();sel.mode='bot';FLIP=false;openFriend();friendMsg('방장과의 연결이 끊겼어요.',true)}
}
function showNetNote(t){const card=$('#overCard');card.innerHTML=`<h2>대결 종료</h2><p class="sub">${esc(t)}</p><button class="btn primary" data-a="lobby">대기실로</button><button class="btn" data-a="leave" style="justify-content:center">방 나가기</button>`;$('#over').hidden=false;setStatus('')}
$('#copyInv').onclick=async()=>{
  const link=net.kind==='peer'?'\n'+location.origin+location.pathname+'?room='+net.code:'';
  const text=`대환장 바둑벙 ${GN[sel.game]} 한 판 하자! 초대코드 ${net.code}${link}`;
  if(net.kind==='peer'&&navigator.share&&('ontouchstart' in window)){try{await navigator.share({title:'대환장 바둑벙',text});return}catch(e){}}
  try{await navigator.clipboard.writeText(text);$('#lobbyMsg').textContent='초대 문구를 복사했어요. 친구에게 붙여넣어 보내 주세요.'}
  catch(e){const r=document.createRange();r.selectNodeContents($('#codeShow'));const sl=getSelection();sl.removeAllRanges();sl.addRange(r);$('#lobbyMsg').textContent='코드를 선택해 뒀어요. 길게 눌러 복사해 주세요.'}
};
(function(){try{
  const q=(new URLSearchParams(location.search).get('room')||location.hash.replace('#','')||'').toUpperCase();
  if(/^[A-Z0-9]{4}$/.test(q)){
    if(location.search)history.replaceState(null,'',location.pathname);
    openFriend();$('#codeIn').value=q;friendMsg('초대받은 방이에요. 닉네임을 확인하고 입장을 눌러 주세요.');
  }
}catch(e){}})();

/* ---------- 공개 랭킹 ----------
   claude.ai 에서 열면: 아티팩트 공유 DB
   GitHub Pages 등에서 열면: RANK_API (구글 시트 Apps Script 웹 앱, ranking-apps-script.gs 참고)
   둘 다 없으면: 이 기기에만 저장 */
const RANK_API="https://script.google.com/macros/s/AKfycbxptjUMFgQChHRweHcX4Ypo4cg8wGjUb4ShICO8ZTTt8Ggw7DbHrZdNNotZ8Ss7d7aE/exec";
let db=null,uid=null,rankBot=[],rankFriend=[],dbState='loading';
let myBot=store.get('lbot',null),myFriend=store.get('lfriend',null);
let wq=Promise.resolve();const queue=fn=>{wq=wq.then(fn).catch(()=>{})};
function useLocal(){dbState='local';rankBot=myBot?[{id:'me',...myBot}]:[];rankFriend=myFriend?[myFriend]:[];renderRank()}
async function apiLoad(){try{const r=await fetch(RANK_API+'?t='+Date.now());const j=await r.json();if(!j||!j.ok)throw 0;rankBot=(j.bot||[]).map(x=>({...x,id:x.nick===nick?'me':x.nick}));rankFriend=[{players:j.friend||{}}];renderRank();return true}catch(e){return false}}
async function apiPost(body){for(let n=0;n<2;n++){try{const r=await fetch(RANK_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const j=await r.json();if(j&&j.ok){apiLoad();return}}catch(e){await new Promise(res=>setTimeout(res,600))}}}
(async()=>{
  try{
    let d=null,u=null;
    if(window.claude&&window.claude.use){[d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}
    if(d&&u)uid=await u.id();
    if(d&&uid){
      db=d;
      const [b,f]=await Promise.all([db.doc('rank_bot/'+uid).get(),db.doc('rank_friend/'+uid).get()]);
      if(b.exists)myBot=b.data();if(f.exists)myFriend=f.data();
      if(myBot){for(const g of['alk','omok']){const best=myBot[g]?.best||0;if(best>prog[g])prog[g]=best}store.set('prog',prog)}
      if(!nick&&myBot?.nick){nick=myBot.nick;nickIn.value=nick}
      dbState='on';
      db.collection('rank_bot').limit(500).onSnapshot(s=>{rankBot=s.docs.map(x=>({id:x.id===uid?'me':x.id,...x.data()}));renderRank()},()=>{});
      db.collection('rank_friend').limit(500).onSnapshot(s=>{rankFriend=s.docs.map(x=>x.data());renderRank()},()=>{});
      renderRank();return;
    }
    if(RANK_API){dbState='api';if(await apiLoad())return}
    useLocal();
  }catch(e){useLocal()}
})();
function saveBot(game,won){
  const d=myBot||{};d.alk=d.alk||{best:0,wins:0,plays:0};d.omok=d.omok||{best:0,wins:0,plays:0};
  d[game].plays=(d[game].plays||0)+1;if(won){d[game].wins=(d[game].wins||0)+1;d[game].best=Math.max(d[game].best||0,prog[game])}
  d.nick=nick;d.at=Date.now();myBot=d;store.set('lbot',d);
  if(dbState==='on'){const snap=JSON.parse(JSON.stringify(d));queue(()=>db.doc('rank_bot/'+uid).set(snap))}
  else if(dbState==='api')apiPost({kind:'bot',game,nick,stage:sel.stage,best:d[game].best,won});
  else useLocal();
}
function saveFriend(game,wn,ln){
  const d=myFriend||{players:{}};d.players=d.players||{};
  const up=(n,k)=>{const p=d.players[n]=d.players[n]||{};const g=p[game]=p[game]||{w:0,l:0};g[k]++};
  up(wn,'w');up(ln,'l');
  const keys=Object.keys(d.players);if(keys.length>60)keys.slice(0,keys.length-60).forEach(k=>delete d.players[k]);
  d.at=Date.now();myFriend=d;store.set('lfriend',d);
  if(dbState==='on'){const snap=JSON.parse(JSON.stringify(d));queue(()=>db.doc('rank_friend/'+uid).set(snap))}
  else if(dbState==='api')apiPost({kind:'friend',game,winner:wn,loser:ln});
  else useLocal();
}
const rk={mode:'bot',game:'alk'};
['rkMode','rkGame'].forEach(id=>$('#'+id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$('#'+id).children].forEach(x=>x.setAttribute('aria-selected',x===b));rk[id==='rkMode'?'mode':'game']=b.dataset.v;renderRank()}));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderRank(){
  if($('#s-rank').hidden)return;
  const list=$('#rankList'),note=$('#rankNote');
  if(dbState==='loading'){list.innerHTML='<div class="empty">랭킹을 불러오는 중이에요…</div>';note.textContent='';return}
  const where=dbState==='local'?' 지금은 공유 랭킹에 연결되지 않아 이 기기 기록만 보여요.':'';
  let rows=[];
  if(rk.mode==='bot'){
    rows=rankBot.filter(r=>r[rk.game]&&(r[rk.game].best>0||r[rk.game].wins>0)).map(r=>({me:r.id==='me',name:r.nick||'익명',best:r[rk.game].best||0,wins:r[rk.game].wins||0,plays:r[rk.game].plays||0}))
      .sort((a,b)=>b.best-a.best||b.wins-a.wins||a.plays-b.plays);
    list.innerHTML=rows.length?rows.slice(0,50).map((r,i)=>`<div class="rk${r.me?' me':''}"><div class="n">${i+1}</div><div class="who">${esc(r.name)}</div><div class="val"><b>${r.best}</b>단계 · ${r.wins}승</div></div>`).join(''):`<div class="empty">아직 ${GN[rk.game]} 봇 대결 기록이 없어요.<br>1단계를 깨면 첫 번째로 이름이 올라가요.</div>`;
    note.textContent='최고 클리어 단계 → 승리 수 순서로 정렬해요.'+where;
  }else{
    const agg={};for(const r of rankFriend){for(const[n,v]of Object.entries(r.players||{})){const g=v[rk.game];if(!g)continue;const a=agg[n]=agg[n]||{w:0,l:0};a.w+=g.w||0;a.l+=g.l||0}}
    rows=Object.entries(agg).map(([n,a])=>({name:n,...a,rate:a.w/Math.max(1,a.w+a.l)})).filter(r=>r.w+r.l>0).sort((a,b)=>b.w-a.w||b.rate-a.rate);
    list.innerHTML=rows.length?rows.slice(0,50).map((r,i)=>`<div class="rk${r.name===nick?' me':''}"><div class="n">${i+1}</div><div class="who">${esc(r.name)}</div><div class="val"><b>${r.w}</b>승 ${r.l}패 · ${Math.round(r.rate*100)}%</div></div>`).join(''):`<div class="empty">아직 ${GN[rk.game]} 친구 대결 기록이 없어요.<br>친구와 한 판 두면 두 사람 이름이 모두 올라가요.</div>`;
    note.textContent='친구 대결에서 입력한 이름 기준으로 승수를 합산해요.'+where;
  }
}
</script>
