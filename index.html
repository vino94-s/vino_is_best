<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>벙참 게임방</title>
<style>
:root{--bg:#F1F3EF;--surface:#FFFFFF;--ink:#17202A;--muted:#5B6770;--line:#D9DED8;--accent:#0D6B5F;--mark:#F2D04A;--mark-ink:#352B00;
  --f:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#10151A;--surface:#182029;--ink:#E6ECE9;--muted:#95A2A8;--line:#29333C;--accent:#55C4B2;--mark:#E0C23C;--mark-ink:#221B00;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:40px 64px;display:grid;gap:18px}
h1{margin:0;font-size:clamp(28px,8vw,38px);font-weight:900;letter-spacing:-.01em}
p{margin:0;color:var(--muted)}
a.card{display:grid;gap:6px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card b{font-size:20px}
a.card span{color:var(--muted);font-size:14px}
a.card em{font-style:normal;justify-self:start;background:var(--mark);color:var(--mark-ink);font-weight:700;font-size:14px;padding:6px 12px;border-radius:10px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>벙참 게임방</h1>
  <p>로그인 없이 바로 플레이할 수 있어요.</p>
  <a class="card" href="golf/"><b>꼴푸왕은 홀인원</b><span>3D 골프 · 네 개 코스 · 9홀/18홀 · 멤버 공동 명예의 전당</span><em>플레이하기</em></a>
  <a class="card" href="gonake/"><b>고네이크</b><span>고라니 그만먹어 · 고기 먹고 허리 늘리는 스네이크 · 닉네임 랭킹</span><em>플레이하기</em></a>
</div>
</body>
</html>
