/* ══════════ 저장소: Firebase / 이 브라우저(localStorage, 테스트·오프라인용) ══════════ */
const splitPath = p => p.split('/').filter(Boolean);
const overlap = (a, b) => a === b || a.startsWith(b + '/') || b.startsWith(a + '/');
class LocalDB {
  constructor() {
    this.mode = 'local'; this.key = 'sachon-local-db'; this.subs = new Set(); this.discon = []; this.load();
    addEventListener('storage', e => { if (e.key === this.key) { this.load(); for (const s of this.subs) s.cb(clone(this._get(s.p))); } });

  save() { try { localStorage.setItem(this.key, JSON.stringify(this.tree)); } catch (e) {} }
  _get(p) { let n = this.tree; for (const k of splitPath(p)) { if (n == null || typeof n !== 'object') return null; n = n[k]; } return n === undefined ? null : n; }
  _write(p, v) {
    this.load();

    for (let i = 0; i < ks.length - 1; i++) { if (n[ks[i]] == null || typeof n[ks[i]] !== 'object') n[ks[i]] = {}; n = n[ks[i]]; }

  on(p, cb) { const s = { p, cb }; this.subs.add(s); setTimeout(() => this.subs.has(s) && cb(clone(this._get(p))), 0); return () => this.subs.delete(s); }

      const r = this.db.ref('.info/connected');
      const f = s => { if (s.val()) { clearTimeout(t); r.off('value', f); res(); } };
      const t = setTimeout(() => { r.off('value', f); rej(new Error('timeout')); }, 12000);

function stakePicker(sel, money, attr = 'stk') {
  return `<div class="grid4">${CFG.stakes.map(s => `<button class="btn sm ${s === sel ? 'pink on' : 'ghost'}" data-${attr}="${s}" ${money != null && money < s ? 'disabled' : ''}>${wonShort(s)}</button>`).join('')}</div>`;
}
function rulePicker(rule, sec, pre, dis) {
  return `<div class="grid2">${Object.keys(RULES).map(k => `<button class="btn sm ${k === rule ? 'pink on' : 'ghost'}" data-${pre}rule="${k}" ${dis ? 'disabled' : ''}>${RULES[k].name}</button>`).join('')}</div>
    ${rule === 'time' ? `<div class="grid3">${CFG.secs.map(x => `<button class="btn sm ${x === sec ? 'cyan on' : 'ghost'}" data-${pre}sec="${x}" ${dis ? 'disabled' : ''}>${x}초</button>`).join('')}</div>` : ''}
    <p class="small muted">${RULES[rule].desc}</p>`;

function openSolo() {
  if (!me) return;
  let stake = Number(localStorage.getItem('sachon-stake')) || CFG.stakes[0], bots = Number(localStorage.getItem('sachon-bots')) || 3, lv = localStorage.getItem('sachon-lv') || 'normal';
  if (!CFG.stakes.includes(stake)) stake = CFG.stakes[0];
  if (!BOT_LV[lv]) lv = 'normal';
  let rule = localStorage.getItem('sachon-rule') === 'single' ? 'single' : 'time', sec = Number(localStorage.getItem('sachon-sec')) || CFG.secs[0];
  if (!CFG.secs.includes(sec)) sec = CFG.secs[0];
  let noItem = localStorage.getItem('sachon-noitem') === '1';
  const draw = s => {
    s.innerHTML = `<h2>🤖 봇이랑 대결</h2>
      <b>게임 방식</b>${rulePicker(rule, sec, 's')}
      <b>아이템</b>${itemPicker(noItem, 's')}
      <b>판돈</b>${stakePicker(stake, me.money)}
      <b>봇 수</b><div class="grid3">${[1, 2, 3].map(n => `<button class="btn sm ${n === bots ? 'cyan on' : 'ghost'}" data-b="${n}">${n}명</button>`).join('')}</div>
      <b>봇 실력</b><div class="grid3">${Object.keys(BOT_LV).map(k => `<button class="btn sm ${k === lv ? 'cyan on' : 'ghost'}" data-l="${k}">${BOT_LV[k].name}</button>`).join('')}</div>
      <div class="card small">이기면 <b class="money">${won(stake * (bots + 1))}</b>을 가져와요 (내 판돈 포함, 순이익 ${won(stake * bots)}). 지면 판돈 ${won(stake)}을 잃어요.</div>
      ${me.money < stake ? `<p class="small" style="color:var(--red)">돈이 모자라요.${canHang(me) ? ' 해장국을 받고 다시 해 보세요 🍲' : ' 판돈을 낮춰 보세요.'}</p>${hangBtn()}` : ''}
      <div class="grid2"><button class="btn ghost" data-close>취소</button><button class="btn pink" id="soGo" ${me.money < stake ? 'disabled' : ''}>시작!</button></div>`;
  };
  modal('', (s, close) => {
    draw(s);
    s.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.dataset.stk) { stake = Number(b.dataset.stk); draw(s); }
      else if (b.dataset.b) { bots = Number(b.dataset.b); draw(s); }
      else if (b.dataset.l) { lv = b.dataset.l; draw(s); }
      else if (b.dataset.srule) { rule = b.dataset.srule; draw(s); }
      else if (b.dataset.ssec) { sec = Number(b.dataset.ssec); draw(s); }
      else if (b.dataset.sni) { noItem = b.dataset.sni === '1'; draw(s); }
      else if (b.id === 'soGo') { localStorage.setItem('sachon-stake', stake); localStorage.setItem('sachon-bots', bots); localStorage.setItem('sachon-lv', lv); localStorage.setItem('sachon-rule', rule); localStorage.setItem('sachon-sec', sec); localStorage.setItem('sachon-noitem', noItem ? '1' : '0'); close(); startSolo(stake, bots, lv, rule, sec, noItem); }
      else if (b.hasAttribute('data-hang')) { b.disabled = true; takeHangover(() => draw(s)); }
      else if (b.hasAttribute('data-close')) close();
    });
  });
}

/* ── 누르기 ── */

    .catch(() => ({ committed: false }))

/* ── 아이템 ── */
function renderItems() {
  if (!G.on) return;
  if (G.overShown) return renderWatch();
  $('#gItems').classList.remove('watching');
  if (G.noItem) { $('#gItems').innerHTML = '<div class="noitem">🚫 노템전 · 아이템 없이 실력으로!</div>'; return; }
  $('#gItems').innerHTML = ITEM_KEYS.map(k => { const it = ITEMS[k], n = (me.items || {})[k] || 0, left = it.limit - (G.used[k] || 0);
    const off = k === 'time' && G.rule === 'single';
    return `<button class="gi" data-it="${k}" ${n <= 0 || left <= 0 || off ? 'disabled' : ''} ${off ? 'title="단판에서는 못 써요"' : ''}><img src="${imgOf(it.icon)}" alt=""><span class="nm">${it.short}</span><span class="small muted" style="font-size:10px">이번 판 ${Math.max(0, left)}번</span><span class="n">${n}</span></button>`; }).join('');
}
$('#gItems').addEventListener('click', e => { const b = e.target.closest('[data-it]'); if (b && !b.disabled) useItem(b.dataset.it); });
async function useItem(k) {

  if (!canPlay() || G.itemBusy) { if (G.on && now() < G.blindUntil) toast('초코 때문에 안 보여요!'); return; }
  const it = ITEMS[k];
  if ((G.used[k] || 0) >= it.limit) return toast(`이번 판엔 ${it.limit}번까지만 써요`);
  if (((me.items || {})[k] || 0) <= 0) return toast('아이템이 없어요. 상점에서 사 주세요');
  G.itemBusy = true;

    const r = await txMe(c => { c.items = c.items || {}; if ((c.items[k] || 0) <= 0) return undefined; c.items[k]--; return c; });
    if (!r || !r.committed) { toast('아이템을 쓰지 못했어요'); return; }
    G.used[k] = (G.used[k] || 0) + 1;
    const ok = await applyItem(k);
    if (!ok) { G.used[k]--; await txMe(c => { c.items = c.items || {}; c.items[k] = (c.items[k] || 0) + 1; return c; }); }

}
async function applyItem(k) {

  if (k === 'hint') {
    const mv = SC.allMoves(G.V.bd);
    if (!mv.length) { toast('지금은 이어지는 쌍이 없어요'); return false; }
    const [a, b] = pick(mv); clearHints();

  }
  if (k === 'time') {

    if (G.mode === 'solo') G.dl[G.me] += CFG.timeBonus * 1000;
    else {
      const r = await db.tx(PATH.room(G.code) + '/players/' + G.me + '/dl', d => (d == null ? null : d > db.now() ? d + CFG.timeBonus * 1000 : undefined)).catch(() => ({ committed: false }));
      if (!r.committed || !r.value) return false;
      G.dl[G.me] = r.value;
    }

    return true;
  }
  if (k === 'blind') {

    if (!tgt.length) { toast('가릴 상대가 없어요'); return false; }
    const until = now() + CFG.blindSec * 1000;
    if (G.mode === 'solo') tgt.forEach(id => { G.blindOf[id] = until; });
    else { try { await db.push(PATH.room(G.code) + '/fx', { by: G.me, to: tgt, until }); } catch (e) { return false; } tgt.forEach(id => { G.blindOf[id] = until; }); }
    banner('🍫 초코 범벅 발사!');

  }
  if (k === 'pair') {
    if (G.mode === 'solo') { const ng = SC.removeAnyPair(G.g, G.me); if (!ng) return false; banner('📜 어명이오!'); syncG(ng); return true; }
    const r = await db.tx(PATH.room(G.code) + '/g', cur => (cur == null ? null : cur.bd ? SC.removeAnyPair(cur, G.me) || undefined : undefined)).catch(() => ({ committed: false }));
    if (!r.committed || !r.value || !r.value.lm) return false;
    banner('📜 어명이오!');
    const v = room.data; if (v && v.g) syncG(v.g.lm && r.value.lm && v.g.lm.n >= r.value.lm.n ? v.g : r.value);

}

/* ── 내 시간이 끝난 뒤: 시간을 늘린 사람이 계속 하는 걸 지켜봐요 ── */
const baseEnd = () => G.startAt + (G.rule === 'single' ? CFG.singleCap : G.sec) * 1000;
function stillPlaying(t) { return G.players.filter(p => p.id !== G.me && t < G.dl[p.id]); }
function renderWatch() {
  const t = now(), el = $('#gItems'), playing = stillPlaying(t);

  }).join('');
  const html = `<div class="w-panel"><div class="w-top"><span>⏰ 게임 종료 · 내 기록 ${scoreOf(G.me)}쌍</span><small>${playing.length ? '👀 관전 중' : '결과 정리 중…'}</small></div>${rows || '<div class="small muted">모두 끝났어요. 곧 결과가 나와요</div>'}</div>`;
  if (el._h !== html) { el._h = html; el.innerHTML = html; }
}

/* ── 사람들 점수 줄 ── */
function scoreOf(id) { const sc = (G.g && G.g.sc) || {}; return (sc[id] || 0) + (id === G.me ? G.pendPairs : 0); }
function renderPlayers() {
  if (!G.on) return;
  const el = $('#gPlayers');

  if (el._game !== gk || !el._cells || el._cells.length !== G.players.length) {
    el._game = gk;
    el.innerHTML = G.players.map((p, i) => `<div class="gp ${p.id === G.me ? 'me' : ''}" style="--pc:${SEAT_COLORS[i]}">${faceEl(p.char)}<div style="min-width:0;flex:1"><div class="nm">${esc(p.id === G.me ? '나' : p.bot ? p.nick.replace(/^봇 /, '') : p.nick)}</div><div class="st"></div></div><span class="sc">0</span></div>`).join('');
    el._cells = [...el.children].map(d => ({ d, st: d.querySelector('.st'), sc: d.querySelector('.sc'), k: '' }));
  }
  const t = now(), top = Math.max(...G.players.map(p => scoreOf(p.id)));
  G.players.forEach((p, i) => {
    const c = el._cells[i], s = scoreOf(p.id), done = (t >= G.dl[p.id] && t >= G.startAt) || !!G.endSeen, choc = (G.blindOf[p.id] || 0) > t || (p.id === G.me && G.blindUntil > t);
    const rp = G.mode === 'online' && room.data && room.data.players ? room.data.players[p.id] : null;
    const waiting = rp && !p.bot && p.id !== G.me && rp.ack !== G.round;
    const st = waiting ? (rp.online ? '⏳ 연결 중' : '📵 끊김') : choc ? '🍫 초코!' : done ? '⏰ 끝' : G.rule === 'time' && t >= baseEnd() ? `☀️ ${Math.ceil((G.dl[p.id] - t) / 1000)}초` : G.rule === 'time' && G.dl[p.id] > baseEnd() ? '☀️ 연장' : p.bot ? '🤖' : '';
    const k = s + '|' + st + '|' + waiting + '|' + (top > 0 && s === top) + '|' + choc;
    if (c.k === k) return; c.k = k;
    c.sc.textContent = s; c.st.textContent = st;
    c.d.classList.toggle('lead', top > 0 && s === top); c.d.classList.toggle('choc', choc);

}

/* ── 봇 ── */
function botTick(t) {
  if (G.endSeen) return;
  const lv = BOT_LV[G.botLv] || BOT_LV.normal;
  for (const p of G.players) {
    if (!p.bot || t < G.startAt || t >= G.dl[p.id]) continue;
    if (!G.botNext[p.id]) { G.botNext[p.id] = G.startAt + 700 + Math.random() * 900; continue; }
    if ((G.blindOf[p.id] || 0) > t) { G.botNext[p.id] = Math.max(G.botNext[p.id], G.blindOf[p.id] + 300); continue; }
    if (t < G.botNext[p.id] || G.botBusy[p.id]) continue;
    G.botNext[p.id] = t + lv.gap[0] + Math.random() * (lv.gap[1] - lv.gap[0]);
    const mv = SC.allMoves(G.mode === 'solo' ? G.g.bd : (room.data && room.data.g ? room.data.g.bd : G.g.bd));
    if (!mv.length) continue;
    const [a, b] = pick(mv);
    if (G.mode === 'solo') {
      const p0 = SC.findPath(G.g.bd, a, b); const ng = SC.applyMove(G.g, a, b, p.id);
      if (ng) { if (p0 && G.V.bd[a] !== '.' && G.V.bd[b] !== '.') drawPath(p0, colorOf(p.id)); G.V.lmN = ng.lm.n; syncG(ng); }
    } else {
      G.botBusy[p.id] = true;
      db.tx(PATH.room(G.code) + '/g', cur => (cur == null ? null : cur.bd ? SC.applyMove(cur, a, b, p.id) || undefined : undefined)).catch(() => {}).then(() => { G.botBusy[p.id] = false; });
    }
  }
}

/* ── 온라인: 방 소식이 올 때마다 ── */
function onlineTick(v) {
  if (v.g) syncG(v.g);
  for (const p of G.players) {
    const d = v.players[p.id] && v.players[p.id].dl; if (!d) continue;
    if (p.id !== G.me && G.dl[p.id] && d > G.dl[p.id] + 1000) { toast(`☀️ ${p.nick}님이 시간을 ${CFG.timeBonus}초 늘렸어요!`, 1800); banner(`☀️ ${p.nick} +${CFG.timeBonus}초`); }
    G.dl[p.id] = d;
  }
  for (const [k, f] of Object.entries(v.fx || {})) {
    if (G.fxSeen.has(k)) continue; G.fxSeen.add(k);
    for (const id of f.to || []) G.blindOf[id] = Math.max(G.blindOf[id] || 0, f.until);
    if ((f.to || []).includes(G.me) && f.until > db.now()) {
      G.blindUntil = Math.max(G.blindUntil, f.until);
      if (G.sel >= 0) { TILES[G.sel].classList.remove('sel'); G.sel = -1; }
      const by = G.players.find(p => p.id === f.by);
      toast(`🍫 ${by ? by.nick : '누군가'}님이 초코 범벅을 던졌어요!`, 1800); Sound.play('blind'); vib([30, 40, 30]);
    }
  }
  renderPlayers();
}
function checkFinalize(v, t) {
  if (!v || v.status !== 'playing' || v.round !== G.round) return;
  if (finalizerOf(v) !== me.pid) return;
  if (v.g && v.g.end && G.endSeen && t > G.endSeen + 1000) return finalize(v.round);
  const ids = Object.keys(v.inRound || {});
  const done = id => { const p = v.players[id]; return !p || (!p.bot && !p.online) || t > (p.dl || 0) + 1200; };
  if (t > v.startAt + 2000 && ids.every(done)) finalize(v.round);
}

/* ── 매 프레임: 시계 · 카운트다운 · 봇 (그리기는 CSS가 해요) ── */
function frame() {
  G.raf = 0;
  if (!G.on) return;
  G.raf = requestAnimationFrame(frame);
  const t = now();
  // 카운트다운
  const pre = G.startAt - t, cnt = $('#gCount');
  if (pre > 0) { const n = Math.ceil(pre / 1000); if (G.countShown !== n) { G.countShown = n; cnt.textContent = n; Sound.play('count'); } }
  else if (G.countShown !== 0) { G.countShown = 0; cnt.textContent = '시작!'; Sound.play('go'); setTimeout(() => { if (G.countShown === 0) cnt.textContent = ''; }, 600); }
  // 내 시계
  const mine = t >= G.startAt && t >= G.dl[G.me];
  const watchDl = mine ? Math.max(0, ...stillPlaying(t).map(p => G.dl[p.id])) : 0;
  const left = mine ? Math.max(0, watchDl - t) : Math.max(0, G.dl[G.me] - Math.max(t, G.startAt)), sec = Math.ceil(left / 1000);
  const remain = G.rule === 'single' ? SC.count(G.V.bd || '') : 0;
  const key = (mine ? 'w' : 'm') + sec + (G.rule === 'single' ? '|' + remain : '');
  if (key !== G.lastSec) {
    G.lastSec = key; const tm = $('#gTime');
    tm.textContent = G.rule === 'single' && !mine ? `남은 ${remain}패` : mine ? (left > 0 ? `관전 ${sec}` : '끝') : sec;
    tm.classList.toggle('hurry', G.rule === 'time' && !mine && sec <= 10 && sec > 0); tm.classList.toggle('watch', mine);
    $('#gBar').classList.toggle('watch', mine);
    renderPlayers();
    if (G.overShown) renderWatch();
  }
  $('#gBar').style.transform = `scaleX(${G.rule === 'single' && !mine ? Math.min(1, remain / (G.total || 1)) : Math.min(1, left / (G.sec * 1000))})`;
  // 초코
  const bl = G.blindUntil > t;
  $('#blind').classList.toggle('hidden', !bl);
  if (bl) $('#blindSec').textContent = Math.ceil((G.blindUntil - t) / 1000) + '초 뒤에 녹아요';
  // 내 시간이 끝나면
  if (t >= G.dl[G.me] && t >= G.startAt && !G.overShown) {
    G.overShown = true; if (G.sel >= 0) { TILES[G.sel].classList.remove('sel'); G.sel = -1; }
    clearHints();
    banner(stillPlaying(t).length ? '⏰ 게임 종료! 관전 중' : '⏰ 게임 종료!');

  else if ((G.tickAt || 0) + 500 < t) { G.tickAt = t; checkFinalize(room.data, t); }
}
function endSolo() {
  G.ended = true;

  const list = G.players.map(p => ({ id: p.id, nick: p.nick, char: p.char, bot: !!p.bot, score: sc[p.id] || 0 })).sort((a, b) => b.score - a.score);
  const top = list[0].score, winners = list.filter(p => top > 0 && p.score === top), pot = stake * list.length;
  list.forEach(p => { p.win = winners.includes(p); p.payout = top === 0 ? stake : p.win ? Math.floor(pot / winners.length) : 0; });
  const mine = list.find(p => p.id === me.pid);
  settle(me.pid, 's-' + G.key, { payout: mine.payout, stake, score: mine.score, win: mine.win });
  const qp = recordMine('q-' + G.key, mine);

}
function recordMine(key, mine) {

  return recordQuest(key, { win: !!mine.win, score: mine.score || 0, kills: G.kills, combo: G.maxCombo, noItem: G.noItem })
    .then(() => Math.max(0, claimable(me).length - before));
}
function showResult(list, stake, myId, onBack, backLabel, again, qp) {

    <p style="text-align:center" class="muted">${faceEl(me.char, 's')} ${esc(say(me.char, mine.win ? 'win' : 'lose'))}</p>
    <div class="card" style="text-align:center"><span class="small muted">이번 판</span><div class="money" style="font-size:30px;color:${delta >= 0 ? 'var(--yellow)' : 'var(--red)'}">${delta >= 0 ? '+' : '−'}${won(Math.abs(delta))}</div><span class="small muted">${ruleLabel(G.rule, G.sec, G.noItem)} · 판돈 ${won(stake)} · 내 기록 ${mine.score}쌍</span></div>
    <div class="list">${list.map((p, i) => `<div class="li ${p.id === myId ? 'me' : ''}"><span class="rk">${p.win ? '👑' : i + 1}</span>${faceEl(p.char, 's')}<div class="grow nm">${esc(p.nick)}</div><b class="num">${p.score}쌍<small>${p.bot ? '봇' : (p.payout - stake >= 0 ? '+' : '−') + won(Math.abs(p.payout - stake))}</small></b></div>`).join('')}</div>
    <div class="grid2">${again ? '<button class="btn pink" id="rsAgain">한 판 더!</button>' : ''}<button class="btn ${again ? 'ghost' : 'pink'}" id="rsBack" ${again ? '' : 'style="grid-column:1/-1"'}>${backLabel}</button></div>`, (s, close, m) => {
    m.dataset.lock = '1';

      const d = document.createElement('button'); d.className = 'btn'; d.innerHTML = `📜 ${n ? `퀘스트 ${n}개 달성!` : '받을 수 있는 퀘스트가 있어요'}<small>${tot}개 받으러 가기 · 최고 콤보 ${G.maxCombo}</small>`;
      d.onclick = () => { close(); show('quest'); }; s.insertBefore(d, s.lastElementChild);

$('#gQuit').onclick = () => {
  if (!G.on) return;

  modal(`<h2>나가기</h2><p class="muted">${msg}</p><div class="grid2"><button class="btn ghost" data-close>계속하기</button><button class="btn orange" id="qGo">나가기</button></div>`, (s, close) => {

/* ══════════ 새 버전 확인 (휴대폰에서 예전 화면이 남지 않게) ══════════ */

/* ══════════ 화면 확대·축소 막기 ══════════ */
(function lockZoom() {
  const VP = 'width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
  const vp = document.getElementById('vp');
  // 혹시 확대됐으면 원래 크기로 돌려놔요 (메타 태그를 다시 넣으면 브라우저가 배율을 다시 적용해요)
  window.resetZoom = () => { if (!vp) return; vp.setAttribute('content', VP + ',width=device-width'); requestAnimationFrame(() => vp.setAttribute('content', VP)); };
  // 아이폰 사파리: 두 손가락 확대(gesture 이벤트)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  // 두 손가락 이상 움직이면 막아요
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  // 빠르게 두 번 탭하면 확대되는 것 막기. 막으면 click이 안 생기니까 버튼은 직접 눌러줘요
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = e.timeStamp || Date.now();
    const quick = now - lastEnd < 350; lastEnd = now;
    if (!quick) return;
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    e.preventDefault();
    const b = t && t.closest && t.closest('button,a,[data-it],label');
    if (b && !b.disabled) b.click();
  }, { passive: false });
  // PC: Ctrl + 휠 / Ctrl + +,-,0 확대 막기
  addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
  addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', '_'].includes(e.key)) e.preventDefault(); });
  // 길게 누르기 메뉴·드래그 막기 (게임 화면)
  document.addEventListener('contextmenu', e => { if (document.body.classList.contains('playing')) e.preventDefault(); });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  // 화면 방향이 바뀌거나 앱으로 돌아오면 배율을 다시 맞춰요
  addEventListener('orientationchange', () => setTimeout(resetZoom, 300));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resetZoom(); });
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { if (visualViewport.scale > 1.01 && document.body.classList.contains('playing')) resetZoom(); });
})();

/* ══════════ 시작 ══════════ */
function bootMsg(text, sub) {
  $('#s-boot').innerHTML = `<div style="margin:auto;text-align:center;display:grid;gap:10px;justify-items:center"><img src="img/eomji.webp" alt="" style="width:72px;height:72px;object-fit:contain"><b style="font:400 20px/1.3 var(--d)">${esc(text)}</b>${sub ? `<p class="small muted">${esc(sub)}</p>` : ''}</div>`;
}
(async function boot() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('local') === '1') db = new LocalDB();
  else {
    db = new FireDB();
    const slow = setTimeout(() => { if (cur === 'boot') bootMsg('서버에 연결하는 중…'); }, 2500);
    for (let n = 1; ; n++) {
      try { await db.init(); clearTimeout(slow); break; }
      catch (e) { console.warn('Firebase 연결 재시도', n, e); bootMsg('서버에 연결하는 중…', n > 1 ? `${n}번째 시도 중이에요. 와이파이나 데이터가 켜져 있는지 확인해 주세요` : ''); await sleep(Math.min(6000, 1000 * n)); }
    }
  }
  if (db.mode === 'firebase') { setInterval(checkVersion, 120000); document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(checkVersion, 3000); }); }
  const saved = savedCode();
  if (saved) {
    for (let n = 1; ; n++) {
      let r;
      try { r = await login(saved); }
      catch (e) { bootMsg('내 코드로 들어가는 중…', n > 1 ? `연결이 불안정해서 다시 시도하고 있어요 (${n}번째)` : ''); await sleep(Math.min(6000, 1000 * n)); continue; }
      if (!r.err) return enter(r.code, r.player);
      if (r.replaced) clearCode();
      toast(r.err, 3000);
      break;
    }
  }
  show('login');
})();
</script>
