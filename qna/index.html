<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D6B5F">
<title>벙참 정모 Q&amp;A</title>
<meta property="og:title" content="벙참 정모 Q&amp;A">
<meta property="og:description" content="활동간에 궁금했던점, 모두 질문해주세요! 운영진이 정모에서 답해드립니다!">
<meta property="og:image" content="https://vino94-s.github.io/vino_is_best/characters/img/yongwang.png">
<link rel="icon" href="../characters/img/yongwang.png">
<style>
/* 정모 Q&A: 위에 설명과 질문 쓰는 칸, 아래 공감 많은 순 질문 목록. ?embed=1 이면 벙참 보드 안에 들어가는 모양. */
:root{--bg:#F1F3EF;--surface:#FFFFFF;--ink:#17202A;--muted:#5B6770;--line:#D9DED8;--accent:#0D6B5F;--accent-soft:#DCEBE6;--mark:#F2D04A;--mark-ink:#352B00;--heart:#E5484D;--heart-soft:#FDE7E8;--done:#5B6770;
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#10151A;--surface:#182029;--ink:#E6ECE9;--muted:#95A2A8;--line:#29333C;--accent:#55C4B2;--accent-soft:#18332F;--mark:#E0C23C;--mark-ink:#221B00;--heart:#FF6B70;--heart-soft:#3A1E22;--done:#95A2A8}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);-webkit-text-size-adjust:100%}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 48px;display:grid;gap:16px}
.embed .wrap{padding-top:14px}
.embed header{display:none}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.lead{margin:6px 0 0;font-size:15.5px;font-weight:600;color:var(--accent);word-break:keep-all}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.ask label{font-size:13px;font-weight:700;color:var(--muted)}
.ask textarea{width:100%;min-height:92px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font-size:16px;line-height:1.5}
.ask textarea:focus-visible{outline:none;border-color:var(--accent)}
.askrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink)}
.send{border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px;border-radius:12px;padding:11px 18px}
.send:disabled{opacity:.45;cursor:default}
.send:focus-visible,.like:focus-visible,.seg button:focus-visible,.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13px;margin:0;min-height:1.2em;color:var(--accent)}
.msg.err{color:var(--heart)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar h2{margin:0;font-size:16px}
.bar h2 small{font-weight:600;color:var(--muted);margin-left:6px;font-size:13px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.q.top{border-color:var(--mark);box-shadow:0 0 0 1px var(--mark) inset}
.q.done{opacity:.72}
.q .tx{margin:0;font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all}
.q .meta{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--muted)}
.chip{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.rank{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.chip.mine{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--accent);color:#fff;border-color:transparent}
.like{grid-column:2;grid-row:1 / span 2;align-self:center;display:grid;justify-items:center;gap:0;min-width:56px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 8px;color:var(--muted)}
.like svg{width:22px;height:22px}
.like b{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.like small{font-size:10.5px;font-weight:700}
.like[aria-pressed="true"]{border-color:var(--heart);background:var(--heart-soft);color:var(--heart)}
.like[aria-pressed="true"] b{color:var(--heart)}
.like[aria-pressed="true"] svg path{fill:currentColor}
@media (prefers-reduced-motion:no-preference){.like.pop svg{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}}
.mini{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:8px;font-size:12px;padding:2px 8px;color:var(--muted)}
.mini.warn{color:var(--heart);border-color:color-mix(in srgb,var(--heart) 40%,var(--line))}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1.5px dashed var(--line);border-radius:14px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.foot button{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:4px}
.adminbar{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.status{font-size:13px;color:var(--muted);text-align:center;margin:0}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>❓ 정모 Q&amp;A</h1>
    <p class="lead">활동간에 궁금했던점, 모두 질문해주세요! 운영진이 정모에서 답해드립니다!</p>
  </header>

  <form class="ask" id="askForm" autocomplete="off">
    <label for="qtext">익명으로 질문하기</label>
    <textarea id="qtext" maxlength="300" placeholder="궁금한 점을 적어 주세요. 닉네임 없이 올라가요."></textarea>
    <div class="askrow">
      <span class="hint"><b id="qlen">0</b>/300 · 누가 썼는지는 아무도 몰라요 (운영진도 몰라요)</span>
      <button class="send" id="sendBtn" type="submit" disabled>질문 올리기</button>
    </div>
    <p class="msg" id="askMsg" role="status"></p>
  </form>

  <div class="adminbar" id="adminBar" hidden><span>🔐 운영진 모드 · 질문마다 ‘답변 완료’·‘삭제’를 할 수 있어요</span><button class="mini" id="adminOut" type="button">나가기</button></div>

  <section>
    <div class="bar">
      <h2>질문 목록<small id="count"></small></h2>
      <div class="seg" role="group" aria-label="정렬">
        <button type="button" data-sort="like" aria-pressed="true">❤️ 공감순</button>
        <button type="button" data-sort="new" aria-pressed="false">🕒 최신순</button>
      </div>
    </div>
    <p class="status" id="status">질문을 불러오는 중…</p>
    <ol class="list" id="list"></ol>
  </section>

  <div class="foot"><span>❤️는 한 사람당 질문마다 한 번씩 누를 수 있어요. 다시 누르면 취소돼요.</span><button type="button" id="adminIn">운영진</button></div>
</main>

<script>
(function(){
// 손모가지 조심!·수다방과 같은 Firebase를 써요. rooms/bung-qna/q/<id> = { text, ts, likes:{기기id:true}, done }
var FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCMl9Ukya3XqIV0BHjKTx1mryvUru0kYXA',
  authDomain: 'gostop-7c4a2.firebaseapp.com',
  databaseURL: 'https://gostop-7c4a2-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'gostop-7c4a2',
  appId: '1:686060440785:web:d5f6445e4bcd2a481b89f0'
};
var ROOM = 'rooms/bung-qna';
var FB_V = '10.12.2';
var ADMIN_SHA256 = '713688ae63ee6e422b7dbe78f4d8fbc7289172126e04b143d33d59850375d6f1'; // 손모가지 조심! 어드민과 같은 비밀번호
var GAP_MS = 30e3; // 같은 기기에서 연달아 올리는 간격

var qs = new URLSearchParams(location.search), EMBED = qs.get('embed') === '1';
if (EMBED) document.body.classList.add('embed');
var $ = function(id){ return document.getElementById(id); };
var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
function rid(n){ var c = 'abcdefghijkmnopqrstuvwxyz23456789', s = ''; for (var i = 0; i < n; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
// 이 기기 표시 (좋아요 중복 막기용). 이름·닉네임과는 연결되지 않아요.
var DEV = store.get('bung-qna-dev'); if (!DEV) { DEV = 'd' + rid(14); store.set('bung-qna-dev', DEV); }
var MINE = {}; try { MINE = JSON.parse(store.get('bung-qna-mine') || '{}') || {}; } catch(e){}
function saveMine(){ store.set('bung-qna-mine', JSON.stringify(MINE)); }
var ADMIN = false; try { ADMIN = sessionStorage.getItem('bung-qna-admin') === '1'; } catch(e){}
var sortBy = 'like', db = null, Q = {};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function ago(ts){
  if (!ts) return '방금';
  var s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  if (s < 86400 * 7) return Math.floor(s / 86400) + '일 전';
  var d = new Date(ts + 9 * 3600e3); return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일';
}
function likeN(q){ return q && q.likes ? Object.keys(q.likes).length : 0; }
var HEART = '<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 20.5C5.6 15.4 1.5 11.8 1.5 7.4 1.5 4.2 4 1.7 7.1 1.7c2 0 3.8 1 4.9 2.6 1.1-1.6 2.9-2.6 4.9-2.6 3.1 0 5.6 2.5 5.6 5.7 0 4.4-4.1 8-10.5 13.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';

/* ── 목록 ── */
function render(){
  var ids = Object.keys(Q).filter(function(id){ return Q[id] && typeof Q[id].text === 'string'; });
  ids.sort(function(a, b){
    var A = Q[a], B = Q[b];
    if (!!A.done !== !!B.done) return A.done ? 1 : -1;            // 답변 끝난 질문은 아래로
    if (sortBy === 'like') { var d = likeN(B) - likeN(A); if (d) return d; }
    return (B.ts || 0) - (A.ts || 0);
  });
  $('count').textContent = ids.length ? ids.length + '개' : '';
  var rank = 0;
  $('list').innerHTML = ids.map(function(id){
    var q = Q[id], n = likeN(q), on = !!(q.likes && q.likes[DEV]);
    var top = sortBy === 'like' && !q.done && n > 0 && rank < 3 ? ++rank : 0;
    return '<li class="q' + (top ? ' top' : '') + (q.done ? ' done' : '') + '" data-id="' + esc(id) + '">' +
      '<p class="tx">' + esc(q.text) + '</p>' +
      '<button type="button" class="like" data-like="' + esc(id) + '" aria-pressed="' + on + '" aria-label="공감 ' + n + '개, ' + (on ? '공감 취소하기' : '공감하기') + '">' + HEART + '<b>' + n + '</b><small>공감</small></button>' +
      '<div class="meta">' + (top ? '<span class="chip rank">공감 ' + top + '위</span>' : '') + (q.done ? '<span class="chip ok">✅ 정모에서 답변함</span>' : '') +
        (MINE[id] ? '<span class="chip mine">내 질문</span>' : '') + '<span>익명 · ' + ago(q.ts) + '</span>' +
        (MINE[id] && !ADMIN ? '<button type="button" class="mini warn" data-del="' + esc(id) + '">삭제</button>' : '') +
        (ADMIN ? '<button type="button" class="mini" data-done="' + esc(id) + '">' + (q.done ? '답변 완료 취소' : '답변 완료') + '</button><button type="button" class="mini warn" data-del="' + esc(id) + '">삭제</button>' : '') +
      '</div></li>';
  }).join('');
  $('status').hidden = ids.length > 0;
  if (!ids.length) $('status').textContent = '아직 질문이 없어요. 첫 질문을 올려 보세요!';
  $('adminBar').hidden = !ADMIN;
}
document.querySelector('.seg').addEventListener('click', function(e){
  var b = e.target.closest('[data-sort]'); if (!b) return;
  sortBy = b.getAttribute('data-sort');
  [].forEach.call(document.querySelectorAll('[data-sort]'), function(x){ x.setAttribute('aria-pressed', String(x === b)); });
  render();
});
$('list').addEventListener('click', function(e){
  if (!db) return;
  var b = e.target.closest('[data-like]');
  if (b) {
    var id = b.getAttribute('data-like'), q = Q[id]; if (!q) return;
    var on = !!(q.likes && q.likes[DEV]), ref = db.ref(ROOM + '/q/' + id + '/likes/' + DEV);
    // 화면은 먼저 바꾸고 서버에 저장해요
    q.likes = q.likes || {}; if (on) delete q.likes[DEV]; else q.likes[DEV] = true;
    (on ? ref.remove() : ref.set(true)).catch(function(){ toast('저장하지 못했어요. 다시 눌러 주세요.', true); });
    render();
    var nb = document.querySelector('[data-like="' + id + '"]'); if (nb && !on) { nb.classList.add('pop'); nb.focus(); } else if (nb) nb.focus();
    return;
  }
  var d = e.target.closest('[data-del]');
  if (d) {
    var did = d.getAttribute('data-del');
    if (!confirmBtn(d, '정말 삭제')) return;
    db.ref(ROOM + '/q/' + did).remove().then(function(){ delete MINE[did]; saveMine(); toast('질문을 지웠어요.'); });
    return;
  }
  var k = e.target.closest('[data-done]');
  if (k && ADMIN) { var kid = k.getAttribute('data-done'); db.ref(ROOM + '/q/' + kid + '/done').set(Q[kid] && Q[kid].done ? null : true); }
});
// 삭제는 한 번 더 눌러야 해요 (창 띄우지 않고 버튼 글자로 확인)
function confirmBtn(btn, label){
  if (btn.dataset.armed === '1') return true;
  btn.dataset.armed = '1'; var old = btn.textContent; btn.textContent = label + '?';
  setTimeout(function(){ if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = old; } }, 3000);
  return false;
}

/* ── 질문 올리기 ── */
function toast(t, bad){ var m = $('askMsg'); m.textContent = t; m.classList.toggle('err', !!bad); clearTimeout(toast.t); toast.t = setTimeout(function(){ m.textContent = ''; }, 4000); }
function syncSend(){ var n = $('qtext').value.trim().length; $('qlen').textContent = $('qtext').value.length; $('sendBtn').disabled = !db || n < 5; }
$('qtext').addEventListener('input', syncSend);
$('askForm').addEventListener('submit', function(e){
  e.preventDefault();
  var text = $('qtext').value.replace(/\s+$/, '').replace(/^\s+/, '').slice(0, 300);
  if (!db) return;
  if (text.length < 5) { toast('질문은 5자 이상 적어 주세요.', true); return; }
  var last = +(store.get('bung-qna-last') || 0);
  if (Date.now() - last < GAP_MS) { toast('조금 있다가 다시 올려 주세요. (' + Math.ceil((GAP_MS - (Date.now() - last)) / 1000) + '초)', true); return; }
  var id = 'q' + Date.now().toString(36) + rid(5);
  $('sendBtn').disabled = true;
  db.ref(ROOM + '/q/' + id).set({ text: text, ts: firebase.database.ServerValue.TIMESTAMP }).then(function(){
    MINE[id] = 1; saveMine(); store.set('bung-qna-last', String(Date.now()));
    $('qtext').value = ''; syncSend(); toast('질문을 올렸어요! 공감을 많이 받을수록 위로 올라가요.');
    if (sortBy !== 'new') render();
  }).catch(function(){ syncSend(); toast('올리지 못했어요. 인터넷 연결을 확인해 주세요.', true); });
});

/* ── 운영진 ── */
function sha256(t){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2, '0'); }).join(''); }); }
$('adminIn').onclick = function(){
  if (ADMIN) return;
  var pw = window.prompt('운영진 비밀번호');
  if (!pw) return;
  sha256(pw).then(function(h){
    if (h !== ADMIN_SHA256) { toast('비밀번호가 맞지 않아요.', true); return; }
    ADMIN = true; try { sessionStorage.setItem('bung-qna-admin', '1'); } catch(e){}
    render(); toast('운영진 모드예요.');
  }).catch(function(){ toast('이 브라우저에서는 운영진 로그인을 할 수 없어요.', true); });
};
$('adminOut').onclick = function(){ ADMIN = false; try { sessionStorage.removeItem('bung-qna-admin'); } catch(e){} render(); };

/* ── 시작 ── */
function load(src){ return new Promise(function(ok, no){ var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
load('https://www.gstatic.com/firebasejs/' + FB_V + '/firebase-app-compat.js')
  .then(function(){ return load('https://www.gstatic.com/firebasejs/' + FB_V + '/firebase-database-compat.js'); })
  .then(function(){
    firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database();
    db.ref(ROOM + '/q').on('value', function(s){ Q = s.val() || {}; render(); syncSend(); });
  })
  .catch(function(){ $('status').textContent = '질문 서버에 연결하지 못했어요. 회사·학교 와이파이라면 휴대폰 데이터로 바꿔 보세요.'; });
setInterval(function(){ if (Object.keys(Q).length) render(); }, 60e3); // '몇 분 전' 갱신
if (EMBED && window.parent !== window) { try { window.parent.postMessage({ bungQna: 'ready' }, '*'); } catch(e){} }
})();
</script>
</body>
</html>
