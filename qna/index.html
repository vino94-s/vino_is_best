<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D6B5F">
<title>벙참 정모 Q&amp;A (종료)</title>
<link rel="icon" href="../characters/img/yongwang.png">
<style>
/* 정모 Q&A는 운영을 끝냈어요. 예전 링크로 들어오면 안내만 보여 줘요. */
:root{--bg:#F1F3EF;--surface:#FFFFFF;--ink:#17202A;--muted:#5B6770;--line:#D9DED8;--accent:#0D6B5F;
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#10151A;--surface:#182029;--ink:#E6ECE9;--muted:#95A2A8;--line:#29333C;--accent:#55C4B2}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f)}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 48px) 16px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.card img{width:72px;height:72px;object-fit:contain}
h1{margin:0;font-size:21px;font-weight:800}
p{margin:0;color:var(--muted);word-break:keep-all}
a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img src="../characters/img/yongwang.png" alt="">
    <h1>정모 Q&amp;A는 종료됐어요</h1>
    <p>질문 게시판 운영을 마쳤어요. 그동안 질문 남겨 주셔서 고마워요!</p>
    <p><a href="https://claude.ai/artifact/BenbcvFyS5yZeGkyQwy5fm" target="_top" rel="noopener">벙참 보드로 가기</a></p>
  </div>
</div>
<script>
try{if(/[?&]embed=1/.test(location.search)&&window.parent!==window)window.parent.postMessage({bungQna:'ready'},'*');}catch(e){}
</script>
</body>
</html>
