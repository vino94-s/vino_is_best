<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>고네이크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one fixed screen like a notebook page — title, score tabs, the graph-paper board, then the numpad. Ranking opens as a sheet when the game ends. Single paper theme by choice. */
:root {
  color-scheme: light;
  --paper: #fbf7ec;
  --grid: #dfe6ea;
  --ink: #2d2a26;
  --ink-soft: #6b655c;
  --tan: #f2c27e;
  --tan-deep: #d9a05a;
  --meat: #b9502e;
  --margin: #e98a8a;
  --card: #fffdf6;
  --veil: rgba(251, 247, 236, .9);
  --f-display: "Gaegu", "Comic Sans MS", "Apple SD Gothic Neo", cursive;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  padding-inline: 12px;
  padding-block: 8px;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}
/* 한 화면 고정: 제목 · 점수 · 게임판(남는 공간 전부) · 방향키 */
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
header { flex: none; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1 {
  font-family: var(--f-display); font-weight: 700; margin: 0;
  font-size: clamp(32px, 6.5vh, 60px); line-height: .95; letter-spacing: -1px;
}
h1 .go { color: var(--tan-deep); }
.tag { font-family: var(--f-display); font-size: clamp(17px, 2.6vh, 22px); color: var(--ink-soft); margin: 0; }

.stats { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stat {
  background: var(--card); border: 2px solid var(--ink); border-radius: 12px 14px 10px 13px;
  padding: 4px 10px; display: grid; min-width: 0;
}
.stat b { font-family: var(--f-display); font-size: clamp(20px, 3.4vh, 30px); line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.stage-wrap { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; container-type: size; }
.stage { position: relative; width: min(100cqw - 6px, 100cqh - 6px); height: min(100cqw - 6px, 100cqh - 6px); }
canvas#game {
  width: 100%; height: 100%; display: block; touch-action: none;
  border: 3px solid var(--ink); border-radius: 6px 10px 8px 12px;
  background: var(--card); box-shadow: 4px 5px 0 var(--ink);
}
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  padding: 16px; background: var(--veil); border-radius: 6px 10px 8px 12px;
}
.overlay[hidden], .sheet[hidden] { display: none; }
.big { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 6vh, 52px); line-height: 1; margin: 0 0 6px; }
.overlay p, .result p { margin: 0 0 4px; color: var(--ink-soft); }
.overlay p:not(.big) { font-size: clamp(12px, 1.9vh, 15px); line-height: 1.5; }
.overlay-inner { display: grid; gap: 10px; justify-items: center; max-width: 340px; width: 100%; }
.btn {
  font-family: var(--f-display); font-weight: 700; font-size: 24px;
  background: var(--tan); color: var(--ink); border: 2px solid var(--ink);
  border-radius: 12px 10px 14px 9px; padding: 6px 22px; cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  touch-action: manipulation;
}
.btn:hover { background: var(--tan-deep); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, input:focus-visible, .pad button:focus-visible { outline: 3px dashed var(--meat); outline-offset: 3px; }
.btn.ghost { background: transparent; box-shadow: none; font-size: 19px; border-style: dashed; }
.hint { font-size: 13px; color: var(--ink-soft); margin: 0; }
.keys-hint { flex: none; text-align: center; }
kbd { font-family: var(--f-body); border: 1.5px solid var(--ink-soft); border-bottom-width: 3px; border-radius: 5px; padding: 0 5px; font-size: 12px; }

/* 숫자패드 배열: 8(위) / 4(왼) · 6(오) / 2(아래), 가운데는 비움. 화면이 낮으면 버튼 높이만 줄어듦 */
.pad {
  flex: none; display: none; justify-content: center;
  grid-template-columns: repeat(3, clamp(60px, 19vw, 76px));
  grid-template-rows: repeat(3, clamp(42px, 7.2vh, 62px));
  gap: clamp(6px, 1.2vh, 10px);
}
.pad button {
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  font-size: 24px; border: 2px solid var(--ink); background: var(--card); color: var(--ink);
  border-radius: 10px; cursor: pointer;
}
.pad button:active { background: var(--tan); }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 3; }
.pad .right { grid-column: 3; grid-row: 2; }
@media (pointer: coarse) { .pad { display: grid; } .keys-hint { display: none; } }

/* 게임 종료 시트: 결과 + 닉네임 등록 + 랭킹 (이 안에서만 스크롤) */
.sheet {
  position: fixed; inset: 0; z-index: 10; background: var(--veil);
  display: flex; justify-content: center; align-items: flex-start;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  -webkit-user-select: text; user-select: text;
}
.sheet-card {
  margin-block: auto; width: 100%; max-width: 420px; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
  background: var(--card); border: 2px solid var(--ink); border-radius: 10px 14px 12px 8px;
  box-shadow: 5px 6px 0 var(--ink); padding: 18px 18px 18px 30px; position: relative;
}
.sheet-card::before { content: ""; position: absolute; left: 16px; top: 0; bottom: 0; border-left: 2px solid var(--margin); }
.result { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; text-align: center; padding-bottom: 14px; border-bottom: 2px dashed var(--grid); }
.result[hidden] { display: none; }
.name-row { display: flex; gap: 8px; width: 100%; }
.name-row input {
  flex: 1 1 0; width: 0; min-width: 0; font-family: var(--f-display); font-size: 24px;
  border: 2px solid var(--ink); border-radius: 10px; padding: 4px 12px; background: var(--paper); color: var(--ink);
}
.err { color: var(--meat); font-size: 13px; min-height: 1em; }
.err.ok { color: var(--ink-soft); }
.rank h2 { font-family: var(--f-display); font-size: clamp(24px, 7vw, 30px); margin: 0; line-height: 1.05; word-break: keep-all; text-wrap: balance; }
.rank-sub { font-size: 12px; color: var(--ink-soft); margin: 4px 0 8px; }
ol.list { list-style: none; margin: 0; padding: 0; display: grid; }
ol.list li {
  display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 8px; align-items: baseline;
  padding: 6px 4px; border-bottom: 1px dashed var(--grid);
}
ol.list li.me { background: rgba(242, 194, 126, .4); border-radius: 6px; }
.pos { font-family: var(--f-display); font-weight: 700; font-size: 22px; text-align: center; }
ol.list li:nth-child(1) .pos { color: var(--meat); }
.who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who small { display: block; font-size: 11px; color: var(--ink-soft); }
.pts { font-family: var(--f-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-soft); font-size: 14px; padding: 10px 0; line-height: 1.5; }
.toast { font-size: 12px; color: var(--ink-soft); margin-top: 8px; min-height: 1em; }
.sheet-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<div class="app">
  <header>
    <h1><span class="go">고</span>네이크</h1>
    <p class="tag">고라니 그만먹어</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="sScore">0</b><span>점수</span></div>
    <div class="stat"><b id="sWaist">30cm</b><span>허리 길이</span></div>
    <div class="stat"><b id="sMeat">0</b><span>먹은 고기</span></div>
    <div class="stat"><b id="sBest">0</b><span>내 최고점</span></div>
  </div>

  <div class="stage-wrap">
    <div class="stage">
      <canvas id="game" aria-label="고네이크 게임판"></canvas>
      <div class="overlay" id="ovStart">
        <div class="overlay-inner">
          <p class="big">고네이크</p>
          <p>고기를 먹으면 허리가 한 칸씩 길어져요.<br>140점부터는 3칸짜리 큰 고기도 나와요.<br>벽이나 허리에 부딪히면 끝!</p>
          <button class="btn" id="btnStart" type="button">시작하기</button>
          <button class="btn ghost" id="btnRank" type="button">랭킹 보기</button>
        </div>
      </div>
      <div class="overlay" id="ovPause" hidden>
        <div class="overlay-inner">
          <p class="big">잠깐 쉬는 중</p>
          <button class="btn" id="btnResume" type="button">계속하기</button>
        </div>
      </div>
    </div>
  </div>

  <p class="hint keys-hint"><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>Space</kbd> 일시정지</p>

  <div class="pad" aria-label="방향 버튼">
    <button class="up" data-d="up" type="button" aria-label="위">▲</button>
    <button class="left" data-d="left" type="button" aria-label="왼쪽">◀</button>
    <button class="down" data-d="down" type="button" aria-label="아래">▼</button>
    <button class="right" data-d="right" type="button" aria-label="오른쪽">▶</button>
  </div>
</div>

<div class="sheet" id="ovOver" hidden>
  <div class="sheet-card">
    <form class="result" id="nameForm" novalidate>
      <p class="big">허리 삐끗!</p>
      <p><b id="oScore">0</b>점 · 허리 <b id="oWaist">0</b>cm · 고기 <b id="oMeat">0</b>개</p>
      <label class="hint" for="nick">닉네임을 남기고 랭킹에 올리세요</label>
      <div class="name-row">
        <input id="nick" name="nick" maxlength="12" autocomplete="nickname" placeholder="닉네임">
        <button class="btn" id="btnSave" type="submit">등록</button>
      </div>
      <div class="err" id="err"></div>
    </form>
    <section class="rank">
      <h2>고기 제일많이 먹인사람</h2>
      <p class="rank-sub" id="rankSub">모두가 함께 보는 랭킹 · 상위 15명</p>
      <ol class="list" id="rankList"></ol>
      <div class="empty" id="rankEmpty">아직 기록이 없어요.<br>첫 번째 고기 먹방의 주인공이 되어 보세요.</div>
      <div class="toast" id="toast"></div>
    </section>
    <div class="sheet-actions">
      <button class="btn" id="btnAgain" type="button">다시 하기</button>
    </div>
  </div>
</div>

    // 1) 허리: 엉덩이에서 머리까지 이어지는 몸통 (먹을수록 길어짐)
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const path = () => { ctx.beginPath(); ctx.moveTo(...pts[L - 1]); for (let i = L - 2; i >= 0; i--) ctx.lineTo(...pts[i]); };
    path(); ctx.strokeStyle = BODY_LINE; ctx.lineWidth = SPR.bodyH * k; ctx.stroke();
    path(); ctx.strokeStyle = BODY_FILL; ctx.lineWidth = (SPR.bodyH - 16) * k; ctx.stroke();

    // 방향: 오른쪽이 원본 그림 기준
    const dirOf = (a, b) => b[0] > a[0] ? "right" : b[0] < a[0] ? "left" : b[1] > a[1] ? "down" : "up";
    const orient = d => {
      if (d === "left") ctx.scale(-1, 1);
      else if (d === "up") ctx.rotate(-Math.PI / 2);
      else if (d === "down") ctx.rotate(Math.PI / 2);
    };
    ctx.imageSmoothingEnabled = true;

    // 2) 엉덩이 + 뒷다리: 맨 뒤에서 따라옴
    if (rear.complete && rear.naturalWidth) {
      const [tx, ty] = pts[L - 1];
      ctx.save(); ctx.translate(tx, ty); orient(dirOf(snake[n - 1], snake[n - 2]));
      ctx.drawImage(rear, cell * 0.3 - SPR.rearSeam * k, -SPR.bodyY * k, rear.naturalWidth * k, SPR.h * k);
      ctx.restore();
    }

    // 3) 머리 + 앞발: 고기를 향해 앞장섬
    if (front.complete && front.naturalWidth) {
      const [hx, hy] = pts[0];
      const s = k * (1 + popT * 0.18);
      ctx.save(); ctx.translate(hx, hy); orient(dir);
      ctx.drawImage(front, -cell * 0.3, -SPR.bodyY * s, front.naturalWidth * s, SPR.h * s);
      ctx.restore();
    }
  }

  function draw(t) {
    if (!pal.ink) readPal();
    drawGrid(); drawMeat(t); drawSnake();
  }

  // ---------- flow ----------
  function show(name) { for (const k in ov) ov[k].hidden = k !== name; }
  function start() {
    reset(); state = "play"; acc = 0; show(null);
    $("nick").disabled = false; $("btnSave").disabled = false;
    try { document.activeElement && document.activeElement.blur(); cv.focus({ preventScroll: true }); } catch (e) {}
  }
  // 랭킹 시트 열기: withResult=true면 방금 판 결과와 닉네임 입력 칸도 함께 보여줌
  function openSheet(withResult) {
    $("nameForm").hidden = !withResult;
    $("btnAgain").textContent = withResult ? "다시 하기" : "시작하기";
    $("toast").textContent = "";
    show("over"); $("ovOver").scrollTop = 0;
    refreshRank();
  }
  function pause() { if (state === "play") { state = "pause"; show("pause"); } else if (state === "pause") { state = "play"; show(null); } }
  function gameOver() {
    state = "over";
    if (score() > best) { best = score(); try { localStorage.setItem("gonake_best", best); } catch (e) {} }
    updateStats();
    $("oScore").textContent = score(); $("oWaist").textContent = waist(); $("oMeat").textContent = eaten;
    $("err").textContent = ""; $("err").className = "err"; $("btnSave").disabled = false; $("nick").disabled = false;
    let saved = ""; try { saved = localStorage.getItem("gonake_nick") || ""; } catch (e) {}
    $("nick").value = saved;
    openSheet(true);
  }

  $("btnStart").onclick = start;
  $("btnResume").onclick = pause;
  $("btnAgain").onclick = start;
  $("btnRank").onclick = () => openSheet(false);

  const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (state === "over" && (e.key === " " || KEYS[e.key])) { if (e.key === " ") { e.preventDefault(); start(); } return; }
    if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
    else if (e.key === " " || e.key === "p" || e.key === "P") {
      e.preventDefault();
      if (state === "ready" || state === "over") start(); else pause();
    }
  });
  document.querySelectorAll(".pad button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); turn(b.dataset.d); }));
  let sx = 0, sy = 0;
  let swiping = false;
  // 손가락을 떼지 않아도 일정 거리만 밀면 바로 방향 전환, 이어서 다른 방향으로도 밀 수 있음
  cv.addEventListener("pointerdown", e => {
    swiping = true; sx = e.clientX; sy = e.clientY;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener("pointermove", e => {
    if (!swiping) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 14) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    sx = e.clientX; sy = e.clientY;
  });
  const endSwipe = () => { swiping = false; };
  cv.addEventListener("pointerup", endSwipe);
  cv.addEventListener("pointercancel", endSwipe);
  cv.tabIndex = 0;

  // ---------- ranking ----------
  // 깃허브 등 일반 웹에서 쓰는 공유 랭킹 서버 (구글 시트 + Apps Script 웹 앱 주소)
  const RANK_API = "https://script.google.com/macros/s/AKfycbwxZ9mc_M7ujTB35wWV4ySIpGhmyg5D7O6lCq0DSDLSJv85Go3-52cm46r-abZckzAiLA/exec";
  const hasApi = () => /^https:\/\/script\.google\.com\//.test(RANK_API);
  let db = null, shared = false, mode = "local", myId = null, rows = [];
  const LOCAL_KEY = "gonake_local_rank";
  const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch (e) { return []; } };
  const saveLocal = r => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(r)); } catch (e) {} };

  function clean(s) { return String(s || "").replace(/\s+/g, " ").trim().slice(0, 12); }
  function renderRank() {
    const list = $("rankList"); list.textContent = "";
    const sorted = rows.filter(r => typeof r.score === "number")
      .sort((a, b) => b.score - a.score || (a.at || 0) - (b.at || 0)).slice(0, 15);
    $("rankEmpty").hidden = sorted.length > 0;
    sorted.forEach((r, i) => {
      const li = document.createElement("li");
      if (r.id && r.id === myId) li.className = "me";
      const pos = document.createElement("span"); pos.className = "pos"; pos.textContent = i + 1;
      const who = document.createElement("span"); who.className = "who";
      who.textContent = clean(r.name) || "익명 고라니";
      const sm = document.createElement("small"); sm.textContent = "허리 " + (Number(r.waist) || 0) + "cm"; who.appendChild(sm);
      const pts = document.createElement("span"); pts.className = "pts"; pts.textContent = Number(r.score) || 0;
      li.append(pos, who, pts); list.appendChild(li);
    });
  }
  function useLocal(note) {
    shared = false; rows = loadLocal(); renderRank();
    $("rankSub").textContent = "이 기기에 저장된 랭킹 · 상위 15명";
    if (note) $("toast").textContent = note;
  }

  async function apiLoad() {
    try {
      const r = await fetch(RANK_API + "?t=" + Date.now());
      const j = await r.json();
      if (!j || !j.ok || !Array.isArray(j.rows)) throw new Error("bad");
      // 아직 서버에 못 올린 이 기기 기록도 함께 표시
      const loc = loadLocal().filter(l => l.localOnly);
      rows = j.rows.concat(loc); renderRank();
      $("rankSub").textContent = "모두가 함께 보는 랭킹 · 상위 15명";
      return true;
    } catch (e) { return false; }
  }
  async function apiSave(entry) {
    for (let n = 0; n < 2; n++) {
      try {
        const r = await fetch(RANK_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(entry) });
        const j = await r.json();
        if (j && j.ok) return j.id;
        return null;
      } catch (e) { await new Promise(res => setTimeout(res, 600)); }
    }
    return null;
  }

  function refreshRank() { if (mode === "api") apiLoad(); else renderRank(); }

  async function initDb() {
    if (hasApi() && !(window.claude && window.claude.use)) {
      mode = "api"; shared = true;
      $("rankSub").textContent = "랭킹 불러오는 중…";
      if (!(await apiLoad())) useLocal("공유 랭킹에 연결하지 못해 이 기기 랭킹을 보여줘요.");
      setInterval(() => { if (mode === "api" && state !== "play" && !document.hidden) apiLoad(); }, 20000);
      return;
    }
    try { db = await (window.claude && window.claude.use ? window.claude.use("db") : null); } catch (e) { db = null; }
    if (!db) {
      if (hasApi()) { mode = "api"; shared = true; if (await apiLoad()) return; }
      return useLocal();
    }
    mode = "db"; shared = true;
    db.collection("scores").orderBy("score", "desc").limit(50).onSnapshot(
      snap => { rows = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderRank(); },
      () => useLocal("공유 랭킹에 연결할 수 없어 이 기기 랭킹을 보여줘요.")
    );
  }

  $("nameForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = clean($("nick").value);
    if (!name) { $("err").textContent = "닉네임을 한 글자 이상 입력해 주세요."; return; }
    try { localStorage.setItem("gonake_nick", name); } catch (e) {}
    // meat = 늘어난 허리 칸 수(큰 고기는 3칸). 랭킹 서버는 이 값으로 점수·허리를 다시 계산함
    const entry = { name, score: score(), waist: waist(), meat: grown, at: Date.now() };
    const done = msg => { $("btnSave").disabled = true; $("nick").disabled = true; $("err").className = "err ok"; $("err").textContent = msg; };
    $("btnSave").disabled = true;
    if (mode === "api") {
      $("err").textContent = "등록하는 중…";
      const id = await apiSave(entry);
      $("err").textContent = "";
      if (id) {
        myId = id; await apiLoad();
        done(name + " 님의 기록을 랭킹에 올렸어요."); return;
      }
      entry.localOnly = true;
      $("toast").textContent = "공유 랭킹에 연결하지 못해 이 기기에만 저장했어요. 잠시 뒤 다시 해 주세요.";
    }
    if (mode === "db" && db) {
      try {
        const ref = db.collection("scores").doc();
        myId = ref.id;
        await ref.set(entry);
        renderRank(); done(name + " 님의 기록을 랭킹에 올렸어요."); return;
      } catch (err) {
        useLocal("공유 랭킹에 쓸 권한이 없어 이 기기에만 저장했어요.");
      }
    }
    const id = "l" + Date.now(); myId = id;
    const local = loadLocal(); local.push({ id, ...entry });
    local.sort((a, b) => b.score - a.score); saveLocal(local.slice(0, 50));
    if (mode === "api") rows = rows.filter(r => !r.localOnly).concat(loadLocal().filter(l => l.localOnly)); else rows = loadLocal();
    renderRank();
    done(name + " 님의 기록을 이 기기에 저장했어요.");
  });

  // boot
  readPal(); reset(); updateStats(); renderRank();
  new ResizeObserver(resize).observe(cv);
  front.onload = rear.onload = () => draw();
  resize();
  requestAnimationFrame(t => { last = t; loop(t); });
  initDb();
})();
</script>
