<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>엄지는 또머글꺼얌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one full-screen pojangmacha (street tent bar) stage; canvas game with HTML HUD and overlays */
:root{
  --night:#16283a; --night2:#0e1b28; --tent:#e8442e; --tent-cream:#fff4e2;
  --soju:#3fc47a; --ink:#1b1410; --gold:#ffc94a; --text:#fff4e2; --muted:#a9b9c8;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night2);color:var(--text);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{touch-action:none}
#stage{position:relative;width:100%;height:100%;max-width:720px;margin:0 auto;background:var(--night)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 54px) 16px 0;pointer-events:none;font-family:var(--display)}
.hud .score{font-size:30px;line-height:1;color:var(--gold);text-shadow:0 2px 0 var(--ink);font-variant-numeric:tabular-nums}
.hud .sub{font-size:13px;color:var(--muted);font-family:var(--body);margin-top:4px}
.hud .right{text-align:right}
.hud .lives{font-size:22px;letter-spacing:2px}
.hud .combo{font-size:15px;color:var(--soju);min-height:18px;margin-top:4px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(10,18,27,.72);backdrop-filter:blur(2px)}
.card{width:100%;max-width:360px;background:var(--tent-cream);color:var(--ink);border-radius:18px;padding:24px 20px 20px;
  box-shadow:0 6px 0 var(--ink);border:3px solid var(--ink);text-align:center}
.card h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.15;margin:0 0 4px;text-wrap:balance;color:var(--tent)}
.card .tag{font-size:14px;margin:0 0 16px;color:#5a4a3e}
.rules{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;text-align:left;font-size:14px;margin:0 0 18px;padding:12px 14px;
  background:#fff;border-radius:12px;border:2px dashed #d9c6ad}
.rules b{font-family:var(--display);font-weight:400;font-size:15px;white-space:nowrap}
.btn{font-family:var(--display);font-size:22px;border:3px solid var(--ink);background:var(--tent);color:var(--tent-cream);
  border-radius:14px;padding:12px 28px;cursor:pointer;box-shadow:0 4px 0 var(--ink);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.final{font-family:var(--display);font-size:56px;color:var(--tent);line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.stats{display:flex;justify-content:center;gap:18px;font-size:14px;margin:0 0 16px;color:#5a4a3e}
.stats b{font-family:var(--display);font-weight:400;color:var(--ink);font-size:17px}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-family:var(--display);font-size:15px;
  color:var(--tent-cream);opacity:.55;pointer-events:none}
.hint.l{left:16px}.hint.r{right:16px}
.overlay{overflow-y:auto;align-items:safe center}
.card{margin-block:auto}
.nick{display:flex;align-items:center;gap:8px;margin:0 0 12px;text-align:left}
.nick label{font-family:var(--display);font-size:15px;white-space:nowrap}
.nick input{flex:1;min-width:0;font:16px var(--body);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;
  padding:8px 10px;-webkit-user-select:text;user-select:text}
.nick input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.rank{margin:0 0 14px;text-align:left;background:var(--ink);color:var(--tent-cream);border-radius:12px;padding:10px 12px 8px}
.rank h2{font-family:var(--display);font-weight:400;font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;color:var(--gold)}
.rank h2 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.rank ol{list-style:none;margin:0;padding:0;max-height:168px;overflow-y:auto}
.rank li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:5px 4px;border-top:1px dashed rgba(255,244,226,.15);font-size:14px}
.rank li:first-child{border-top:0}
.rank li .no{font-family:var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rank li:nth-child(1) .no{color:var(--gold)}.rank li:nth-child(2) .no{color:#d6dde4}.rank li:nth-child(3) .no{color:#e0a46a}
.rank li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li .sc{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;color:var(--gold)}
.rank li.me{background:rgba(232,68,46,.35);border-radius:8px}
.rank .empty{font-size:13px;color:var(--muted);padding:6px 2px}
.status{font-size:13px;color:#5a4a3e;margin:-6px 0 12px;min-height:18px}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden>
    <div><div class="score" id="score">0</div><div class="sub">최고 <span id="best">0</span></div></div>
    <div class="right"><div class="lives" id="lives"></div><div class="combo" id="combo"></div></div>
  </div>
  <div class="hint l" id="hintL" hidden>◀ 음식</div>
  <div class="hint r" id="hintR" hidden>술 ▶</div>

  <div class="overlay" id="startOv">
    <div class="card">
      <h1>엄지는<br>또머글꺼얌</h1>
      <p class="tag">떨어지는 안주와 술, 엄지 하나로 다 챙긴다</p>
      <div class="rules">
        <b>🍗 음식</b><span>왼쪽 터치 · ← 키</span>
        <b>🍺 술</b><span>오른쪽 터치 · → 키</span>
        <b>🪰 파리</b><span>엄지를 터치 · ↑ 키로 꾹!</span>
        <b>❤️ 목숨</b><span>잘못 보내거나 놓치면 하나씩 줄어요</span>
      </div>
      <div class="nick"><label for="nickIn">닉네임</label><input id="nickIn" maxlength="10" placeholder="랭킹에 올라갈 이름" autocomplete="off"></div>
      <div class="rank"><h2>🏆 먹방 랭킹 <small class="rankNote"></small></h2><ol class="rankList"><li class="empty">랭킹 불러오는 중…</li></ol></div>
      <button class="btn" id="startBtn">먹으러 가자</button>
    </div>
  </div>

  <div class="overlay" id="overOv" hidden>
    <div class="card">
      <h1 id="overTitle">배불러서 끝!</h1>
      <div class="final" id="finalScore">0</div>
      <div class="stats">
        <span>음식 <b id="stFood">0</b></span><span>술 <b id="stDrink">0</b></span><span>파리 <b id="stFly">0</b></span><span>최고 <b id="stBest">0</b></span>
      </div>
      <p class="status" id="rankStatus"></p>
      <div class="rank"><h2>🏆 먹방 랭킹 <small class="rankNote"></small></h2><ol class="rankList"><li class="empty">랭킹 불러오는 중…</li></ol></div>
      <button class="btn" id="retryBtn">한 판 더</button>
    </div>
  </div>
</div>

let G=null, running=false;
function newGame(){
  G={score:0,lives:3,combo:0,maxCombo:0,items:[],flying:[],parts:[],texts:[],t:0,spawnT:0.6,
     swing:null,press:null,splat:0,shake:0,flash:0,flashCol:'#e8442e',food:0,drink:0,fly:0,binL:0,binR:0};
  updateHud();
}
const level=()=>1+Math.floor(G.score/120);
const fallSpeed=()=>Math.min(H*0.62,H*(0.2+0.035*(level()-1)));
const spawnGap=()=>Math.max(0.5,1.25-0.08*(level()-1));

function spawn(){
  const r=Math.random(), flyChance=Math.min(0.24,0.1+0.02*level());
  let it;
  if(r<flyChance) it={kind:'fly',x:cx,y:startY-30,ph:Math.random()*6};
  else if(Math.random()<0.5) it={kind:'food',e:FOODS[Math.random()*FOODS.length|0],x:cx,y:startY-30,rot:0};
  else it={kind:'drink',e:DRINKS[Math.random()*DRINKS.length|0],x:cx,y:startY-30,rot:0};
  it.vr=(Math.random()-.5)*1.5; it.speed=fallSpeed()*(it.kind==='fly'?0.85:1);
  G.items.push(it);
}

// ---------- audio ----------
let AC=null;
function beep(f,d=0.08,type='square',vol=0.05,slide=0){
  if(!AC) return; const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+0.02);
}

// ---------- input ----------
function act(dir){
  if(!running) return;
  if(dir==='up'){
    G.press={t:0};
    const flies=G.items.filter(i=>i.kind==='fly'&&i.y>zoneTop).sort((a,b)=>b.y-a.y);
    const f=flies[0];
    if(f){ squash(f); } else beep(160,0.06,'triangle',0.04);
    return;
  }
  G.swing={dir:dir==='left'?-1:1,t:0};
  const cands=G.items.filter(i=>i.kind!=='fly'&&i.y>zoneTop).sort((a,b)=>b.y-a.y);
  const it=cands[0];
  if(!it){ beep(220,0.04,'triangle',0.03); return; }
  G.items.splice(G.items.indexOf(it),1);
  const ok=(dir==='left'&&it.kind==='food')||(dir==='right'&&it.kind==='drink');
  const tx=dir==='left'?W*0.13:W*0.87, ty=binY();
  G.flying.push({it,x0:it.x,y0:it.y,tx,ty,t:0,dur:0.42,ok,side:dir});
  if(ok){
    G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo);
    const pts=10*Math.min(5,1+Math.floor(G.combo/5));
    G.score+=pts; it.kind==='food'?G.food++:G.drink++;
    popText('+'+pts,it.x+(dir==='left'?-30:30),it.y-10,'#ffc94a');
    beep(dir==='left'?520:660,0.07,'square',0.05,200);
  }else{
    G.combo=0; hurt(it.kind==='food'?'그건 안주잖아!':'그건 술이잖아!',it.x,it.y-20);
  }
  updateHud();
}
function squash(f){
  G.items.splice(G.items.indexOf(f),1);
  G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); G.fly++;
  const pts=20*Math.min(5,1+Math.floor(G.combo/5)); G.score+=pts;
  G.splat=1; G.shake=0.18;
  for(let k=0;k<16;k++){const a=Math.random()*Math.PI*2,v=60+Math.random()*180;
    G.parts.push({x:cx,y:tipTopY,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.6,c:k%3?'#2a2a1e':'#7ea33a',r:2+Math.random()*3});}
  popText('찰싹! +'+pts,cx,tipTopY-40,'#3fc47a',true);
  beep(90,0.14,'sawtooth',0.07,-50); setTimeout(()=>beep(1200,0.03,'square',0.02),40);
  updateHud();
}
function hurt(msg,x,y){
  G.lives--; G.shake=0.3; G.flash=0.35; G.combo=0;
  popText(msg,x,y,'#ff7a5c',true);
  beep(150,0.25,'sawtooth',0.06,-80);
  if(navigator.vibrate) try{navigator.vibrate(80)}catch(e){}
  updateHud();
  if(G.lives<=0) setTimeout(gameOver,450);
}
function popText(txt,x,y,c,big){G.texts.push({txt,x,y,c,t:0,big:!!big});}

window.addEventListener('keydown',e=>{
  const k=e.key;
  if(e.target&&e.target.tagName==='INPUT'){ if(k==='Enter'){e.preventDefault();e.target.blur();if(!running)start();} return; }
  if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w','A','D','W'].includes(k)) e.preventDefault();
  if(e.repeat) return;
  if(!running){ if((k==='Enter'||k===' ')&&!$('startOv').hidden) start(); else if((k==='Enter'||k===' ')&&!$('overOv').hidden) start(); return;}
  if(k==='ArrowLeft'||k==='a'||k==='A') act('left');
  else if(k==='ArrowRight'||k==='d'||k==='D') act('right');
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ') act('up');
});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const inThumb=Math.abs(x-cx)<Math.max(44,40*s)&&y>tipTopY-50&&y<pivY+60*s;
  if(inThumb) act('up'); else act(x<cx?'left':'right');
});

// ---------- flow ----------
function start(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended') AC.resume();
  newGame(); running=true;
  $('startOv').hidden=true;$('overOv').hidden=true;$('hud').hidden=false;$('hintL').hidden=false;$('hintR').hidden=false;
  cv.focus&&cv.focus();
}
function gameOver(){
  running=false;
  if(G.score>best){best=G.score;try{localStorage.setItem('thumb_best',best)}catch(e){}}
  $('best').textContent=best;
  $('overTitle').textContent=G.score>=best&&G.score>0?'신기록! 또 먹을 거야':'배불러서 끝!';
  $('finalScore').textContent=G.score;
  $('stFood').textContent=G.food;$('stDrink').textContent=G.drink;$('stFly').textContent=G.fly;$('stBest').textContent=best;
  $('overOv').hidden=false;$('hintL').hidden=true;$('hintR').hidden=true;
  submitScore(G.score,{food:G.food,drink:G.drink,fly:G.fly,combo:G.maxCombo});
  setTimeout(()=>$('retryBtn').focus(),50);
}
$('startBtn').onclick=start; $('retryBtn').onclick=start;

// ---------- 랭킹: claude 아티팩트(db) → 구글 시트(RANK_API) → 이 기기 순서로 연결 ----------
// 깃허브 페이지에서 쓰는 공유 랭킹 서버 (구글 시트 + Apps Script 웹 앱 주소). 비어 있으면 이 기기에만 저장.
const RANK_API = "";
const hasApi=()=>/^https:\/\/script\.google\.com\//.test(RANK_API);
const R={mode:'loading',db:null,uid:null,rows:[],myBest:0,myId:null,canWrite:true};
const LOCAL_KEY='thumb_local_rank';
const loadLocal=()=>{try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]')}catch(e){return []}};
const saveLocal=r=>{try{localStorage.setItem(LOCAL_KEY,JSON.stringify(r))}catch(e){}};
const clean=v=>String(v||'').replace(/\s+/g,' ').trim().slice(0,10);
try{R.myId=localStorage.getItem('thumb_my_id');R.myBest=+localStorage.getItem('thumb_rank_best')||0}catch(e){}
let nick=''; try{nick=localStorage.getItem('thumb_nick')||''}catch(e){}
$('nickIn').value=nick;
$('nickIn').addEventListener('input',e=>{nick=clean(e.target.value);try{localStorage.setItem('thumb_nick',nick)}catch(_){}});
const myKey=()=>R.mode==='db'?R.uid:R.myId;
function sortRows(rows){return rows.filter(r=>Number(r.score)>0).map(r=>({...r,score:Number(r.score)}))
  .sort((x,y)=>y.score-x.score||(x.at>y.at?1:-1)).slice(0,20);}
function renderRank(){
  const rows=sortRows(R.rows);
  document.querySelectorAll('.rankList').forEach(ol=>{
    ol.textContent='';
    if(R.mode==='loading'||!rows.length){
      const li=document.createElement('li');li.className='empty';
      li.textContent=R.mode==='loading'?'랭킹 불러오는 중…':'아직 기록이 없어요. 첫 번째 먹보가 되어보세요!';
      ol.appendChild(li);return;
    }
    rows.forEach((r,i)=>{
      const mine=r.id&&r.id===myKey();
      const li=document.createElement('li');if(mine)li.className='me';
      const no=document.createElement('span');no.className='no';no.textContent=i+1;
      const nm=document.createElement('span');nm.className='nm';nm.textContent=(clean(r.nick||r.name)||'익명의 엄지')+(mine?' (나)':'');
      const sc=document.createElement('span');sc.className='sc';sc.textContent=r.score;
      li.append(no,nm,sc);ol.appendChild(li);
    });
  });
  const note=R.mode==='local'?'이 기기 · TOP 20':R.mode==='loading'?'':'모두의 랭킹 · TOP 20';
  document.querySelectorAll('.rankNote').forEach(n=>n.textContent=note);
}
function myRank(){const i=sortRows(R.rows).findIndex(r=>r.id&&r.id===myKey());return i<0?0:i+1;}
function useLocal(){R.mode='local';R.rows=loadLocal();renderRank();}
async function apiLoad(){
  try{
    const r=await fetch(RANK_API+'?t='+Date.now()); const j=await r.json();
    if(!j||!j.ok||!Array.isArray(j.rows)) throw new Error('bad');
    R.rows=j.rows; renderRank(); return true;
  }catch(e){return false;}
}
async function apiSave(entry){
  for(let n=0;n<2;n++){
    try{
      const r=await fetch(RANK_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(entry)});
      const j=await r.json(); return j&&j.ok?j.id:null;
    }catch(e){await new Promise(res=>setTimeout(res,600));}
  }
  return null;
}
(async()=>{
  let db=null,user=null;
  if(window.claude&&window.claude.use){try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){db=null}}
  if(db){
    R.mode='db';R.db=db;R.myBest=0;
    R.uid=user?await user.id():null;
    if(user&&(await user.can('data.write'))===false) R.canWrite=false;
    if(!R.uid) R.canWrite=false;
    db.collection('scores').orderBy('score','desc').limit(20).onSnapshot(snap=>{
      R.rows=snap.docs.map(d=>({id:d.id,...d.data()}));
      const mine=R.rows.find(r=>r.id===R.uid); if(mine) R.myBest=Math.max(R.myBest,Number(mine.score)||0);
      renderRank();
    },()=>useLocal());
    if(R.uid){try{const d=await db.doc('scores/'+R.uid).get(); if(d.exists){const v=d.data();R.myBest=Math.max(R.myBest,Number(v.score)||0); if(!nick&&v.nick){nick=clean(v.nick);$('nickIn').value=nick;}}}catch(e){}}
    return;
  }
  if(hasApi()){R.mode='api'; if(!(await apiLoad())) useLocal(); return;}
  useLocal();
})();
async function submitScore(score,extra){
  const st=$('rankStatus');
  if(R.mode==='api') apiLoad();
  if(score<=0){st.textContent='';return;}
  if(R.mode==='db'&&!R.canWrite){st.textContent='보기 전용이라 랭킹에 기록되지 않았어요';return;}
  if(score<=R.myBest){st.textContent=`내 랭킹 기록은 ${R.myBest}점이에요`;return;}
  const name=nick||'익명의 엄지';
  const entry={name,score,food:extra.food,drink:extra.drink,fly:extra.fly,combo:extra.combo,at:Date.now()};
  const done=()=>{R.myBest=score;try{localStorage.setItem('thumb_rank_best',score)}catch(e){}
    setTimeout(()=>{const n=myRank();st.textContent=n?`랭킹 ${n}위 등록!`:'랭킹에 등록했어요 (TOP 20 밖)';},R.mode==='db'?500:0);};
  st.textContent='랭킹에 등록하는 중…';
  if(R.mode==='db'){
    try{
      await R.db.doc('scores/'+R.uid).set({nick:name,score,food:extra.food,drink:extra.drink,fly:extra.fly,combo:extra.combo,at:new Date().toISOString()});
      done();return;
    }catch(e){
      if(e&&e.code==='invalid_argument'){R.canWrite=false;st.textContent='보기 전용이라 랭킹에 기록되지 않았어요';}
      else st.textContent='랭킹 등록에 실패했어요. 다음 판에 다시 시도할게요';
      return;
    }
  }
  if(R.mode==='api'){
    const id=await apiSave(entry);
    if(id){R.myId=id;try{localStorage.setItem('thumb_my_id',id)}catch(e){} await apiLoad(); done(); return;}
    R.mode='local';
  }
  const id='l'+Date.now(); R.myId=id; try{localStorage.setItem('thumb_my_id',id)}catch(e){}
  const local=loadLocal(); local.push({id,...entry}); local.sort((x,y)=>y.score-x.score); saveLocal(local.slice(0,50));
  R.rows=loadLocal(); renderRank(); done();
  if(hasApi()) setTimeout(()=>{st.textContent='공유 랭킹에 연결하지 못해 이 기기에만 저장했어요';},10);
}
function updateHud(){
  $('score').textContent=G.score;
  $('lives').textContent='❤️'.repeat(Math.max(0,G.lives))+'🤍'.repeat(Math.max(0,3-G.lives));
  $('combo').textContent=G.combo>=3?G.combo+' 콤보 ×'+Math.min(5,1+Math.floor(G.combo/5)):'';
}
const binY=()=>tipTopY+30*s;

// ---------- update ----------
function update(dt){
  if(!G) return;
  G.t+=dt;
  if(running){
    G.spawnT-=dt;
    const last=G.items[G.items.length-1];
    if(G.spawnT<=0&&(!last||last.y>startY+60)){spawn();G.spawnT=spawnGap();}
    for(let i=G.items.length-1;i>=0;i--){
      const it=G.items[i]; it.y+=it.speed*dt;
      if(it.kind==='fly'){it.ph+=dt*9; it.x=cx+Math.sin(it.ph*0.6)*16*Math.max(.7,s);}
      else it.rot+=it.vr*dt;
      if(it.y>=tipTopY-14){
        G.items.splice(i,1);
        if(it.kind==='fly') hurt('윽, 파리가 앉았다!',cx,tipTopY-40);
        else hurt('놓쳤다!',cx,tipTopY-40);
        if(!running) break;
      }
    }
  }
  for(let i=G.flying.length-1;i>=0;i--){
    const f=G.flying[i]; f.t+=dt;
    if(f.t>=f.dur){ G.flying.splice(i,1);
      if(f.side==='left')G.binL=1;else G.binR=1;
      if(!f.ok) for(let k=0;k<8;k++)G.parts.push({x:f.tx,y:f.ty,vx:(Math.random()-.5)*200,vy:-Math.random()*200,life:.5,c:'#ff7a5c',r:3});
    }
  }
  if(G.swing){G.swing.t+=dt;if(G.swing.t>0.3)G.swing=null;}
  if(G.press){G.press.t+=dt;if(G.press.t>0.28)G.press=null;}
  G.splat=Math.max(0,G.splat-dt*0.9); G.shake=Math.max(0,G.shake-dt); G.flash=Math.max(0,G.flash-dt);
  G.binL=Math.max(0,G.binL-dt*4);G.binR=Math.max(0,G.binR-dt*4);
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.life<=0)G.parts.splice(i,1);}
  for(let i=G.texts.length-1;i>=0;i--){const t=G.texts[i];t.t+=dt;t.y-=40*dt;if(t.t>0.9)G.texts.splice(i,1);}
}

// ---------- draw ----------
function drawAwning(){
  const h=Math.max(44,H*0.07), n=Math.max(6,Math.round(W/70)), sw=W/n;
  ctx.fillStyle='#e8442e';ctx.fillRect(0,0,W,h);
  for(let i=0;i<n;i++){
    ctx.fillStyle=i%2?'#e8442e':'#fff4e2';
    ctx.fillRect(i*sw,0,sw,h);
    ctx.beginPath();ctx.arc(i*sw+sw/2,h,sw/2,0,Math.PI);ctx.fill();
  }
  ctx.strokeStyle='#1b1410';ctx.lineWidth=2.5;
  ctx.beginPath();for(let i=0;i<n;i++){ctx.arc(i*sw+sw/2,h,sw/2,Math.PI,0,true);}ctx.stroke();
  // string lights
  for(let i=0;i<n*2;i++){const x=(i+.5)*W/(n*2),y=h+sw/2+12+Math.sin(i*1.3)*4;
    const on=(Math.sin((G?G.t:0)*3+i)+1)/2;ctx.fillStyle=`rgba(255,201,74,${0.45+on*0.5})`;
    ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();}
  // sign
  ctx.font=`${Math.min(22,W/18)}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const label='엄지는 또머글꺼얌', tw=ctx.measureText(label).width+28;
  ctx.fillStyle='#1b1410';roundRect(cx-tw/2,h*0.18,tw,h*0.6,8);ctx.fill();
  ctx.fillStyle='#ffc94a';ctx.fillText(label,cx,h*0.48+1);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBins(){
  const y=binY(), bw=Math.min(110,W*0.24);
  // left plate
  const bl=1+G.binL*0.12, br=1+G.binR*0.12;
  ctx.save();ctx.translate(W*0.13,y);ctx.scale(bl,bl);
  ctx.fillStyle='#fff4e2';ctx.strokeStyle='#1b1410';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(0,10,bw/2,bw*0.16,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#d9c6ad';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,10,bw*0.34,bw*0.1,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
  // right crate
  ctx.save();ctx.translate(W*0.87,y);ctx.scale(br,br);
  ctx.fillStyle='#3fc47a';ctx.strokeStyle='#1b1410';ctx.lineWidth=3;
  roundRect(-bw/2,-4,bw,bw*0.38,6);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(27,20,16,.45)';ctx.lineWidth=2;
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(-bw/2+i*bw/4,-4);ctx.lineTo(-bw/2+i*bw/4,bw*0.38-4);ctx.stroke();}
  ctx.restore();
  ctx.font=`${Math.min(17,W/24)}px Jua, sans-serif`;ctx.textAlign='center';ctx.fillStyle='#fff4e2';
  ctx.fillText('안주 접시',W*0.13,y+bw*0.16+28);ctx.fillText('술 짝',W*0.87,y+bw*0.38+18);
  ctx.font=`${Math.min(24,W/18)}px sans-serif`;
  ctx.fillText(G.food?'🍽️ '+G.food:'🍽️',W*0.13,y-22);ctx.fillText(G.drink?'🍻 '+G.drink:'🍻',W*0.87,y-22);
}
function drawItem(it,x,y,rot,sc=1){
  const size=Math.max(34,46*Math.min(1.2,s*1.3))*sc;
  if(it.kind==='fly'){drawFly(x,y,it.ph,size);return;}
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.e,0,0);ctx.restore();
}
function drawFly(x,y,ph,size){
  const r=size*0.24;ctx.save();ctx.translate(x,y);
  const flap=Math.sin(ph*6)*0.5;
  ctx.fillStyle='rgba(220,235,255,.75)';ctx.strokeStyle='#1b1410';ctx.lineWidth=1.5;
  ctx.save();ctx.rotate(-0.5-flap);ctx.beginPath();ctx.ellipse(-r*0.9,-r*0.6,r*1.1,r*0.55,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
  ctx.save();ctx.rotate(0.5+flap);ctx.beginPath();ctx.ellipse(r*0.9,-r*0.6,r*1.1,r*0.55,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
  ctx.fillStyle='#22261c';ctx.beginPath();ctx.ellipse(0,r*0.2,r*0.75,r*1.05,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a5a2e';ctx.beginPath();ctx.ellipse(0,r*0.5,r*0.45,r*0.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c0262b';ctx.beginPath();ctx.arc(-r*0.4,-r*0.65,r*0.36,0,Math.PI*2);ctx.arc(r*0.4,-r*0.65,r*0.36,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#22261c';ctx.lineWidth=1.5;
  for(let k=-1;k<=1;k+=2)for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(k*r*0.6,r*(0.0+j*0.4));ctx.lineTo(k*r*1.3,r*(0.2+j*0.5));ctx.stroke();}
  ctx.restore();
}
function drawHand(){
  if(!baseImg.complete||!tipImg.complete) return;
  // swing angle
  let ang=Math.sin(G?G.t*2:0)*0.04, sy=1;
  if(G&&G.swing){const t=G.swing.t; ang+=G.swing.dir*0.85*(t<0.06?t/0.06:Math.max(0,1-(t-0.06)/0.22));}
  if(G&&G.press){const t=G.press.t/0.28; sy=1-0.42*Math.sin(Math.min(1,t)*Math.PI);}
  // table shadow
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(handX+150*s,H-4,150*s,14*s,0,0,Math.PI*2);ctx.fill();
  ctx.drawImage(baseImg,handX,handY,HW*s,HH*s);
  // joint cap hides the seam while the tip moves
  ctx.fillStyle='#ffe0c3';ctx.beginPath();ctx.ellipse(pivX,pivY-2*s,17*s,12*s,0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(pivX,pivY);ctx.rotate(ang);ctx.scale(1,sy);
  ctx.drawImage(tipImg,-PIV.x*s,-PIV.y*s,90*s,100*s);
  if(G&&G.splat>0){ // fly splat on fingertip
    ctx.globalAlpha=Math.min(1,G.splat*1.5);ctx.fillStyle='#3a3f22';
    const yy=(-PIV.y+12)*s;ctx.beginPath();ctx.ellipse(0,yy,14*s,6*s,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#7ea33a';ctx.beginPath();ctx.arc(-8*s,yy-2*s,3*s,0,Math.PI*2);ctx.arc(9*s,yy+1*s,2.5*s,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function draw(){
  ctx.save();
  if(G&&G.shake>0){ctx.translate((Math.random()-.5)*14*G.shake/0.3,(Math.random()-.5)*10*G.shake/0.3);}
  // night sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16283a');g.addColorStop(1,'#0e1b28');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  // fall lane
  ctx.fillStyle='rgba(255,244,226,.05)';ctx.fillRect(cx-36,startY-30,72,tipTopY-startY+30);
  ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(255,201,74,.35)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx-60,zoneTop);ctx.lineTo(cx+60,zoneTop);ctx.stroke();ctx.setLineDash([]);
  // table
  ctx.fillStyle='#8a5a34';ctx.fillRect(-20,H-26,W+40,40);ctx.fillStyle='#a8703f';ctx.fillRect(-20,H-26,W+40,6);
  drawAwning();
  if(G){
    drawBins();
    for(const it of G.items) drawItem(it,it.x,it.y,it.rot||0);
    for(const f of G.flying){
      const p=Math.min(1,f.t/f.dur), x=f.x0+(f.tx-f.x0)*p, y=f.y0+(f.ty-f.y0)*p-Math.sin(p*Math.PI)*90*Math.max(.7,s);
      drawItem(f.it,x,y,p*6*(f.side==='left'?-1:1),1-p*0.3);
    }
  }
  drawHand();
  if(G){
    for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life/0.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
    for(const t of G.texts){
      ctx.globalAlpha=Math.max(0,1-t.t/0.9);ctx.font=`${t.big?26:22}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=5;ctx.strokeStyle='#1b1410';ctx.strokeText(t.txt,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.txt,t.x,t.y);
    }
    ctx.globalAlpha=1;
    if(G.flash>0){ctx.fillStyle=`rgba(232,68,46,${G.flash*0.6})`;ctx.fillRect(-20,-20,W+40,H+40);}
  }
  ctx.restore();
}
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  update(dt);draw();requestAnimationFrame(loop);
}
// demo state behind the start card
newGame(); G.items.push({kind:'food',e:'🍗',x:cx,y:startY+60,rot:0.2,speed:0},{kind:'fly',x:cx,y:zoneTop+20,ph:1,speed:0});
requestAnimationFrame(loop);
document.fonts&&document.fonts.ready.then(()=>{});
})();
</script>
