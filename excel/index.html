<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F6E43">
<title>2026_4분기_매출분석_최종.xlsx</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='26' height='24' rx='3' fill='%231F6E43'/%3E%3Cpath d='M3 12h26M3 20h26M12 4v24M21 4v24' stroke='%23fff' stroke-width='1.6' opacity='.85'/%3E%3C/svg%3E">
<style>
/* 엑셀처럼 보이는 껍데기 안에 게임을 '삽입된 개체'로 띄워요. '매출_원본' 시트나 Esc로 순식간에 업무 화면으로 바뀌어요. */
:root{
  --green:#1F6E43;--green-d:#185C37;--green-l:#E9F3EC;--sel:#107C41;
  --chrome:#F3F3F3;--ribbon:#F8F8F8;--line:#E1E1E1;--grid:#E2E2E2;--hdr:#F0F0F0;--hdr-ink:#444;
  --ink:#1F1F1F;--muted:#616161;--cell:#FFFFFF;
  --f:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
  --rh:32px;--cw:72px;--rowh:22px;--colh:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--chrome);color:var(--ink);font:12px/1.3 var(--f);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.app{height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}

/* 제목 표시줄 */
.titlebar{flex:none;height:40px;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:0 0 0 max(10px,env(safe-area-inset-left,0px));padding-top:env(safe-area-inset-top,0px);height:calc(40px + env(safe-area-inset-top,0px))}
.tb-auto{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.95;white-space:nowrap}
.tog{width:30px;height:14px;border-radius:7px;border:1px solid #fff;position:relative;opacity:.9}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#fff}
.tb-ico{display:flex;gap:12px;font-size:14px;opacity:.95}
.tb-name{flex:1;min-width:0;text-align:center;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-search{width:min(30vw,300px);height:26px;border-radius:5px;background:rgba(255,255,255,.18);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:rgba(255,255,255,.85)}
.tb-user{width:26px;height:26px;border-radius:50%;background:#C8E6D2;color:var(--green-d);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.wc{display:flex;align-self:stretch}
.wc button{width:46px;display:grid;place-items:center;font-size:15px;color:#fff}
.wc button:hover{background:rgba(255,255,255,.14)}
.wc .x:hover{background:#C42B1C}

/* 메뉴 탭 + 리본 */
.menubar{flex:none;background:var(--chrome);display:flex;gap:2px;padding:0 8px;height:30px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.menubar::-webkit-scrollbar{display:none}
.menubar button{padding:6px 10px 6px;font-size:12.5px;white-space:nowrap;border-radius:4px 4px 0 0;color:#333}
.menubar button:hover{background:#E6E6E6}
.menubar button.on{color:var(--sel);font-weight:600;box-shadow:inset 0 -2px 0 var(--sel)}
.menubar .file{color:#fff;background:var(--sel);border-radius:4px;margin:0 4px 3px 0;padding:4px 12px}
.menubar .file:hover{background:var(--green-d)}
.menubar .sp{flex:1}
.menubar .share{margin-bottom:3px;padding:4px 12px;border-radius:4px;background:var(--sel);color:#fff;font-weight:600}
.ribbon{flex:none;background:var(--ribbon);border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:96px;display:flex;align-items:stretch;padding:4px 6px 0;overflow:hidden;gap:0}
.grp{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--line);min-width:0}
.grp-b{flex:1;display:flex;align-items:flex-start;gap:4px}
.grp-n{text-align:center;font-size:11px;color:var(--muted);padding:2px 0 4px;white-space:nowrap}
.big{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:3px;font-size:11.5px;white-space:nowrap}
.big i{font-style:normal;font-size:24px;line-height:28px}
.big:hover,.sm:hover,.ib:hover{background:#E5E5E5}
.big.on{background:#D6E8DC}
.col{display:flex;flex-direction:column;gap:3px}
.row{display:flex;gap:2px;align-items:center}
.sm{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:3px;font-size:11.5px;white-space:nowrap;height:22px}
.ib{width:24px;height:22px;display:grid;place-items:center;border-radius:3px;font-size:12px}
.dd{height:22px;border:1px solid #C8C8C8;background:#fff;border-radius:2px;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 6px;font-size:11.5px;gap:6px}
.dd::after{content:"⌄";font-size:10px;color:#666;line-height:1;margin-top:-4px}

/* 수식 입력줄 */
.fbar{flex:none;height:30px;display:flex;align-items:center;gap:6px;padding:0 6px;background:#fff;border-bottom:1px solid var(--line)}
.namebox{width:88px;height:22px;border:1px solid #C8C8C8;display:flex;align-items:center;padding:0 6px;font-size:12px;flex:none}
.fx{color:#777;font-style:italic;font-family:Georgia,serif;font-size:13px;padding:0 6px;border-left:1px solid var(--line);border-right:1px solid var(--line);flex:none;display:flex;gap:10px}
.fx b{font-style:normal;color:#999;font-family:var(--f);font-weight:400}
.formula{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Consolas,"D2Coding",ui-monospace,monospace;font-size:12px;color:#222}

/* 시트 영역 */
.sheet{flex:1;min-height:0;position:relative;background:var(--cell);overflow:hidden}
.colhdr{position:absolute;left:var(--rh);right:0;top:0;height:var(--colh);display:flex;background:var(--hdr);border-bottom:1px solid #C6C6C6;overflow:hidden}
.colhdr span{flex:none;width:var(--cw);border-right:1px solid #D4D4D4;text-align:center;line-height:var(--colh);color:var(--hdr-ink);font-size:11.5px}
.colhdr span.on{background:#D3E7DA;color:var(--sel);font-weight:700;box-shadow:inset 0 -2px 0 var(--sel)}
.rowhdr{position:absolute;left:0;top:var(--colh);bottom:0;width:var(--rh);background:var(--hdr);border-right:1px solid #C6C6C6;overflow:hidden}
.rowhdr span{display:block;height:var(--rowh);line-height:var(--rowh);text-align:center;border-bottom:1px solid #D4D4D4;color:var(--hdr-ink);font-size:11px}
.rowhdr span.on{background:#D3E7DA;color:var(--sel);font-weight:700;box-shadow:inset -2px 0 0 var(--sel)}
.corner{position:absolute;left:0;top:0;width:var(--rh);height:var(--colh);background:var(--hdr);border-right:1px solid #C6C6C6;border-bottom:1px solid #C6C6C6}
.corner::after{content:"";position:absolute;right:3px;bottom:3px;border:5px solid transparent;border-right-color:#B5B5B5;border-bottom-color:#B5B5B5}
.cells{position:absolute;left:var(--rh);top:var(--colh);right:0;bottom:0;overflow:hidden;
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:var(--cw) var(--rowh);background-position:-1px -1px}
.c{position:absolute;height:var(--rowh);line-height:var(--rowh);padding:0 4px;white-space:nowrap;overflow:hidden;font-size:12px}
.c.r{text-align:right;font-variant-numeric:tabular-nums}
.c.b{font-weight:700}
.c.h{background:#DDEBF7;font-weight:700;border:1px solid #9BC2E6;margin:-1px 0 0 -1px}
.c.t{font-size:15px;font-weight:700;color:#1F3864;overflow:visible}
.c.tot{background:#FFF2CC;font-weight:700}
.c.neg{color:#C00000}
.selbox{position:absolute;border:2px solid var(--sel);pointer-events:none;z-index:3}
.selbox::after{content:"";position:absolute;right:-4px;bottom:-4px;width:6px;height:6px;background:var(--sel);border:1px solid #fff}

/* 삽입된 개체 (게임) */
.obj{position:absolute;z-index:4;background:#fff;border:1px solid #B9B9B9;box-shadow:0 0 0 1px rgba(16,124,65,.0)}
.obj.focus{outline:1.5px solid #7A7A7A;outline-offset:2px}
.obj .hd{position:absolute;width:8px;height:8px;background:#fff;border:1px solid #7A7A7A;border-radius:50%;z-index:2}
.obj iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.obj.gray iframe{filter:grayscale(1) contrast(.95)}
/* 시트 스킨: 개체 테두리를 없애고 게임 위에 셀 눈금을 깔아서, 게임이 시트에 그려진 것처럼 보여요 */
.obj .gridov{position:absolute;inset:0;z-index:1;pointer-events:none;display:none;mix-blend-mode:multiply;
  background-image:linear-gradient(to right,#D4D4D4 1px,transparent 1px),linear-gradient(to bottom,#D4D4D4 1px,transparent 1px);
  background-size:var(--cw) var(--rowh);background-position:-1px -1px}
.obj.skin{border:0;background:#fff}
.obj.skin .hd,.obj.skin .objname{display:none}
.obj.skin .gridov{display:block}
.obj.skin iframe{filter:saturate(.55) contrast(.97)}
.obj.skin.inv iframe{filter:invert(1) hue-rotate(180deg) saturate(.45) contrast(.9) brightness(1.04)}
.obj.skin.gray iframe{filter:grayscale(1) contrast(.95)}
.obj.skin.inv.gray iframe{filter:invert(1) hue-rotate(180deg) grayscale(1) contrast(.9) brightness(1.04)}
.cells.skin .selbox{z-index:6}
.objname{position:absolute;left:0;top:-18px;font-size:11px;color:var(--muted);white-space:nowrap}
.extnote{position:absolute;z-index:5;right:6px;bottom:6px;background:#FFFFE1;border:1px solid #A0A0A0;box-shadow:2px 2px 4px rgba(0,0,0,.18);padding:6px 8px;font-size:11.5px;max-width:240px}
.extnote a{color:#0563C1}
.memo{position:absolute;z-index:6;background:#FFFFE1;border:1px solid #A0A0A0;box-shadow:2px 2px 5px rgba(0,0,0,.2);padding:7px 9px;font-size:12px;line-height:1.45;max-width:250px;transition:opacity .4s}
.memo::before{content:"";position:absolute;left:-7px;top:8px;border:6px solid transparent;border-right-color:#A0A0A0;border-left:0}
.memo b{display:block;margin-bottom:2px}
.memo.hide{opacity:0;pointer-events:none}

/* 시트 탭 + 상태 표시줄 */
.tabs{flex:none;height:30px;display:flex;align-items:stretch;background:var(--chrome);border-top:1px solid #C6C6C6;padding-left:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .nav{color:#999;padding:0 6px;font-size:11px}
.tabs .st{padding:0 16px;font-size:12px;white-space:nowrap;color:#333;border-right:1px solid #DADADA}
.tabs .st:hover{background:#E8E8E8}
.tabs .st.on{background:#fff;color:var(--sel);font-weight:700;box-shadow:inset 0 -3px 0 var(--sel);margin-top:-1px}
/* 파일 이름·시트 이름 바꾸기 (각자 기기에만 저장) */
.tb-name{cursor:text;border-radius:4px;padding:2px 6px}
.tb-name:hover{background:rgba(255,255,255,.14)}
.nm-edit{font:inherit;color:#1F1F1F;background:#fff;border:1px solid #fff;border-radius:3px;outline:2px solid #9FD5B4;padding:2px 6px;min-width:0}
.tb-name .nm-edit{width:min(100%,420px);text-align:center;font-size:12.5px;height:24px}
.tabs .st .nm-edit{width:110px;font-size:12px;height:22px;text-align:center;outline-color:var(--sel)}
.rename-hint{position:fixed;z-index:20;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 46px);background:#FFFFE1;border:1px solid #A0A0A0;box-shadow:2px 2px 5px rgba(0,0,0,.2);padding:7px 10px;font-size:12px;line-height:1.45;max-width:min(92vw,320px);transition:opacity .4s}
.rename-hint.hide{opacity:0;pointer-events:none}
.tabs .add{padding:0 12px;font-size:16px;color:#666}
.status{flex:none;height:24px;display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--chrome);border-top:1px solid #DADADA;font-size:11.5px;color:#444;white-space:nowrap;overflow:hidden}
.status .sp{flex:1}
.status .zoom{display:flex;align-items:center;gap:6px}
.status .bar{width:90px;height:2px;background:#999;position:relative}
.status .bar::after{content:"";position:absolute;left:44px;top:-4px;width:3px;height:10px;background:#444}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:4px;font-size:12px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* 휴대폰: 엑셀 모바일처럼 리본을 접어요 */
@media (max-width:760px){
  :root{--rh:26px;--cw:64px;--rowh:21px;--colh:18px}
  .titlebar{height:calc(42px + env(safe-area-inset-top,0px));gap:8px}
  .tb-auto,.tb-search,.wc .mn,.wc .mx,.tb-ico .hide-m{display:none}
  .tb-name{text-align:left;font-size:13px;font-weight:600}
  .ribbon{display:none}
  .menubar{height:32px}
  .menubar .share,.menubar .sp{display:none}
  .mtools{display:flex!important}
  .fbar{height:28px}
  .namebox{width:56px}
  .status .hide-m{display:none}
  .objname{display:none}
}
.mtools{display:none;flex:none;height:34px;align-items:center;gap:2px;padding:0 6px;background:var(--ribbon);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.mtools::-webkit-scrollbar{display:none}
.mtools .ib{width:30px;height:28px;font-size:14px}
@media (max-width:1100px){.ribbon .opt{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="tb-auto">자동 저장 <span class="tog" aria-hidden="true"></span> 끔</div>
    <div class="tb-ico" aria-hidden="true"><span>💾</span><span class="hide-m">↶</span><span class="hide-m">↷</span></div>
    <div class="tb-name" id="docName">2026_4분기_매출분석_최종.xlsx</div>
    <div class="tb-search" aria-hidden="true">🔍 검색</div>
    <div class="tb-user" aria-hidden="true">김</div>
    <div class="wc">
      <button class="mn" type="button" aria-label="최소화" data-toast="최소화는 안 돼요. 업무 화면은 Esc!">—</button>
      <button class="mx" type="button" aria-label="최대화" id="fullBtn">▢</button>
      <button class="x" type="button" aria-label="닫기" id="closeBtn">✕</button>
    </div>
  </header>

  <nav class="menubar" aria-label="메뉴">
    <button class="file" type="button" data-toast="저장할 게 없어요. 일한 게 없으니까요.">파일</button>
    <button class="on" type="button">홈</button>
    <button type="button" data-toast="삽입할 시간에 한 판 더!">삽입</button>
    <button type="button">페이지 레이아웃</button>
    <button type="button">수식</button>
    <button type="button">데이터</button>
    <button type="button">검토</button>
    <button type="button">보기</button>
    <button type="button">도움말</button>
    <span class="sp"></span>
    <button class="share" type="button" data-toast="공유는 벙참 보드에서 해 주세요">공유</button>
  </nav>

  <div class="ribbon">
    <div class="grp"><div class="grp-b"><button class="big" type="button" tabindex="-1"><i>📋</i>붙여넣기</button><div class="col"><span class="sm">✂ 잘라내기</span><span class="sm">⧉ 복사</span><span class="sm">🖌 서식 복사</span></div></div><div class="grp-n">클립보드</div></div>
    <div class="grp"><div class="grp-b"><div class="col"><div class="row"><span class="dd" style="width:110px">맑은 고딕</span><span class="dd" style="width:44px">11</span><span class="ib">가<sup>+</sup></span><span class="ib">가<sup>-</sup></span></div><div class="row"><span class="ib"><b>가</b></span><span class="ib"><i>가</i></span><span class="ib"><u>가</u></span><span class="ib">▦</span><span class="ib" style="color:#C00000">A</span><span class="ib">🪣</span></div></div></div><div class="grp-n">글꼴</div></div>
    <div class="grp"><div class="grp-b"><div class="col"><div class="row"><span class="ib">≡</span><span class="ib">≣</span><span class="ib">☰</span><span class="sm">↩ 텍스트 줄 바꿈</span></div><div class="row"><span class="ib">⫷</span><span class="ib">⫶</span><span class="ib">⫸</span><span class="sm">⊞ 병합하고 가운데 맞춤</span></div></div></div><div class="grp-n">맞춤</div></div>
    <div class="grp"><div class="grp-b"><div class="col"><span class="dd" style="width:100px">회계</span><div class="row"><span class="ib">₩</span><span class="ib">%</span><span class="ib">,</span><span class="ib">.0</span><span class="ib">.00</span></div></div></div><div class="grp-n">표시 형식</div></div>
    <div class="grp"><div class="grp-b"><button class="big" type="button" tabindex="-1"><i>▤</i>조건부<br>서식</button><button class="big" type="button" tabindex="-1"><i>▦</i>표<br>서식</button><button class="big" type="button" tabindex="-1" id="grayBtn"><i>◐</i>셀<br>스타일</button></div><div class="grp-n">스타일</div></div>
    <div class="grp opt"><div class="grp-b"><div class="col"><span class="sm">⊕ 삽입</span><span class="sm">⊖ 삭제</span><span class="sm">▥ 서식</span></div></div><div class="grp-n">셀</div></div>
    <div class="grp opt" style="border-right:0"><div class="grp-b"><div class="col"><span class="sm">Σ 자동 합계</span><span class="sm">⬇ 채우기</span><span class="sm">◇ 지우기</span></div><button class="big" type="button" tabindex="-1"><i>⇅</i>정렬 및<br>필터</button><button class="big" type="button" tabindex="-1"><i>🔍</i>찾기 및<br>선택</button></div><div class="grp-n">편집</div></div>
  </div>
  <div class="mtools"><button class="ib" type="button" id="skinBtnM" aria-label="셀 스타일 바꾸기" title="셀 스타일">◐</button><span class="ib"><b>가</b></span><span class="ib"><i>가</i></span><span class="ib"><u>가</u></span><span class="ib" style="color:#C00000">A</span><span class="ib">🪣</span><span class="ib">≡</span><span class="ib">Σ</span><span class="ib">₩</span><span class="ib">%</span><span class="ib">⇅</span><span class="ib">▦</span></div>

  <div class="fbar">
    <div class="namebox" id="nameBox">B3</div>
    <div class="fx"><b>✕</b><b>✓</b>fx</div>
    <div class="formula" id="formula"></div>
  </div>

  <main class="sheet" id="sheet">
    <div class="corner"></div>
    <div class="colhdr" id="colHdr"></div>
    <div class="rowhdr" id="rowHdr"></div>
    <div class="cells" id="cells"></div>
  </main>

  <div class="tabs" role="tablist" aria-label="시트">
    <span class="nav" aria-hidden="true">◀ ▶</span>
    <button class="st on" role="tab" type="button" data-sheet="game">요약</button>
    <button class="st" role="tab" type="button" data-sheet="work">매출_원본</button>
    <button class="st" role="tab" type="button" data-sheet="pivot">피벗_지역별</button>
    <button class="add" type="button" aria-label="새 시트" data-toast="시트는 이 정도면 충분해요">＋</button>
  </div>
  <footer class="status">
    <span id="stLeft">준비</span><span class="hide-m">♿ 접근성: 계속 진행 가능</span>
    <span class="sp"></span>
    <span id="stCalc" class="hide-m"></span>

  function rgb(str){ var m = /rgba?\(([^)]+)\)/.exec(str || ''); if (!m) return null; var p = m[1].split(/[ ,\/]+/).map(parseFloat); return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 }; }
  function lum(c){ var f = function(v){ v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c.r) + .7152 * f(c.g) + .0722 * f(c.b); }
  function chroma(c){ var mx = Math.max(c.r, c.g, c.b), mn = Math.min(c.r, c.g, c.b); return (mx - mn) / 255; }
  function darkBg(c){ if (!c || c.a < .15) return false; var L = lum(c), C = chroma(c); return L < .1 || (L < .22 && C < .3); }
  function clear(el){ PROPS.forEach(function(p){ el.style.removeProperty(p); }); touched.delete(el); }
  function set(el, p, v){ el.style.setProperty(p, v, 'important'); touched.add(el); }
  function paint(el){
    if (el.nodeType !== 1) return;
    var tag = el.tagName;
    if (tag === 'IMG' || tag === 'VIDEO' || tag === 'SCRIPT' || tag === 'STYLE' || tag === 'svg' || tag === 'IFRAME' || el.closest('svg')) return;
    if (touched.has(el)) clear(el);
    var cs = w.getComputedStyle(el);
    if (tag === 'CANVAS') { if (DARK[id]) set(el, 'filter', 'invert(1) hue-rotate(180deg) saturate(.6)'); return; }
    var bg = rgb(cs.backgroundColor), bi = cs.backgroundImage || 'none';
    var hasUrl = bi.indexOf('url(') >= 0;
    if (bi !== 'none' && !hasUrl) { set(el, 'background-image', 'none'); }
    if (darkBg(bg) || (bi !== 'none' && !hasUrl && (!bg || bg.a < .15) && el.clientWidth > w.innerWidth * .5)) set(el, 'background-color', el === d.body || el === d.documentElement ? '#fff' : 'transparent');
    var fg = rgb(cs.color);
    if (fg && lum(fg) > .45) {
      // 글자 뒤 배경이 남아 있는 진한 색이면 흰 글자를 그대로 두고, 아니면 검게
      var keep = false, p = el;
      while (p && p.nodeType === 1) { var pb = rgb(w.getComputedStyle(p).backgroundColor); if (pb && pb.a > .5) { keep = lum(pb) < .3 && !darkBg(pb); break; } p = p.parentElement; }
      if (!keep) set(el, 'color', '#1F1F1F');
    }
    var bc = rgb(cs.borderTopColor); if (bc && lum(bc) > .6 && cs.borderTopWidth !== '0px') set(el, 'border-color', '#BFBFBF');
  }
  function paintTree(root){ if (root.nodeType !== 1) return; paint(root); var all = root.getElementsByTagName('*'); for (var i = 0; i < all.length; i++) paint(all[i]); }
  function flush(){ timer = 0; busy = true; var list = Array.from(queue); queue.clear(); list.forEach(function(n){ if (n.isConnected) paintTree(n); }); busy = false; mo && mo.takeRecords(); }
  function onMut(recs){
    if (busy) return;
    recs.forEach(function(r){
      if (r.type === 'attributes') { if (r.attributeName === 'style' && touched.has(r.target)) return; queue.add(r.target); }
      else r.addedNodes.forEach(function(n){ if (n.nodeType === 1) queue.add(n); });
    });
    if (queue.size && !timer) timer = w.setTimeout(flush, 60);
  }
  return {
    start: function(){ busy = true; paintTree(d.documentElement); busy = false; mo = new w.MutationObserver(onMut); mo.observe(d.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'style', 'hidden', 'disabled', 'aria-pressed', 'aria-selected'] }); },

function applySkin(){
  if (!obj) return;
  var on = skin !== 'off';
  var sameOrigin = false; try { sameOrigin = !!(frame && frame.contentDocument && frame.contentDocument.body); } catch (e) {}
  obj.classList.toggle('skin', on);
  // 다른 사이트 게임은 안을 못 칠하니 화면 전체 색을 뒤집거나(밝기 반대로) 채도만 낮춰요
  obj.classList.toggle('inv', on && !sameOrigin && skin === 'flip');
  $('#cells').classList.toggle('skin', on);
  if (!sameOrigin) return;
  try {
    var d = frame.contentDocument, w = frame.contentWindow;
    var st = d.getElementById('bungExcelSkin');
    if (!st) { st = d.createElement('style'); st.id = 'bungExcelSkin'; (d.head || d.documentElement).appendChild(st); }
    st.textContent = on ? skinCss() : '';
    if (painter) { painter.stop(); painter = null; }
    if (on && skin === 'auto') { painter = makePainter(w); painter.start(); }
    else if (on && skin === 'flip') { st.textContent = ''; obj.classList.add('inv'); }
  } catch (e) {}
}
function cycleSkin(){
  skin = SKINS[(SKINS.indexOf(skin) + 1) % SKINS.length];
  try { localStorage.setItem('bung_excel_skin', skin); } catch (e) {}
  applySkin();
  toast(skin === 'auto' ? '셀 스타일: 시트처럼 (기본)' : skin === 'flip' ? '셀 스타일: 색 뒤집기' : '셀 스타일: 게임 원래 화면');
}

/* ── 업무 화면 전환 ── */
function setSheet(name){
  sheet = name;
  document.querySelectorAll('.tabs .st').forEach(function(t){ var on = t.dataset.sheet === name; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
  render();
  if (name !== 'game') { try { frame && frame.blur(); document.activeElement && document.activeElement.blur(); } catch (e) {} }
}
var lastSheet = 'work';
// 업무 화면으로 바꾸면 게임에는 '화면이 가려졌다'고 알려서, 멈춤·소리 끄기를 지원하는 게임은 알아서 쉬게 해요
function frameHidden(h){
  try {
    var w = frame && frame.contentWindow, d = w && w.document; if (!d) return;
    Object.defineProperty(d, 'hidden', { configurable: true, get: function(){ return h; } });
    Object.defineProperty(d, 'visibilityState', { configurable: true, get: function(){ return h ? 'hidden' : 'visible'; } });
    d.dispatchEvent(new w.Event('visibilitychange'));
    d.querySelectorAll('audio,video').forEach(function(m){ if (h) { m.dataset.bungMuted = m.muted ? '1' : ''; m.muted = true; } else if (m.dataset.bungMuted === '') m.muted = false; });
  } catch (e) {}
}
function toggleBoss(){ if (sheet === 'game') setSheet(lastSheet); else { setSheet('game'); } }
document.querySelectorAll('.tabs .st').forEach(function(t){
  t.addEventListener('click', function(){
    if (t.querySelector('.nm-edit')) return;
    if (t.classList.contains('on')) { renameTab(t); return; }   // 이미 선택된 시트를 한 번 더 누르면 이름 바꾸기
    if (t.dataset.sheet !== 'game') lastSheet = t.dataset.sheet; setSheet(t.dataset.sheet);
  });
  t.addEventListener('dblclick', function(e){ e.preventDefault(); renameTab(t); });
});
document.addEventListener('keydown', function(e){
  if (e.target && e.target.classList && e.target.classList.contains('nm-edit')) return;
  if (e.key === 'Escape') { e.preventDefault(); toggleBoss(); }
});
$('#cells').addEventListener('pointerdown', function(e){
  if (obj && obj.contains(e.target)) return;
  if (obj) obj.classList.remove('focus');
  var r = $('#cells').getBoundingClientRect();
  sel = { c: Math.max(0, Math.floor((e.clientX - r.left) / cssNum('--cw'))), r: Math.max(0, Math.floor((e.clientY - r.top) / cssNum('--rowh'))) };
  markSel(); if (sheet !== 'game') showCell(); else { var el = document.querySelector('.c[data-c="' + sel.c + '"][data-r="' + sel.r + '"]'); $('#formula').textContent = el ? el.textContent : ''; }
});

/* ── 기타 버튼 ── */
var tt = 0;
function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 1800); }
document.querySelectorAll('[data-toast]').forEach(function(b){ b.addEventListener('click', function(){ toast(b.dataset.toast); }); });
$('#grayBtn').addEventListener('click', cycleSkin);
$('#skinBtnM').addEventListener('click', cycleSkin);
$('#grayBtn').removeAttribute('tabindex');
$('#fullBtn').addEventListener('click', function(){ try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} });
$('#closeBtn').addEventListener('click', function(){
  if (!confirm('통합 문서를 닫을까요? (게임을 나가요)')) return;
  var ref = document.referrer, same = false; try { same = !!ref && new URL(ref).origin === location.origin; } catch (e) {}
  if (same && history.length > 1) { history.back(); return; }
  try { window.close(); } catch (e) {}
  setTimeout(function(){ location.href = '../'; }, 300);
});

var rt = 0;
window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(render, 80); });
render();
applySkin();

// 처음 한 번만 사용법 메모를 띄워요
try {
  if (!localStorage.getItem('bung_excel_memo')) {
    var memo = document.createElement('div'); memo.className = 'memo';
    memo.innerHTML = '<b>김대리:</b>Esc 키나 아래 <u>매출_원본</u> 시트를 누르면 바로 업무 화면이 돼요. <u>요약</u> 시트를 누르면 게임으로 돌아와요. 파일 이름과 시트 이름은 눌러서 내 업무에 맞게 바꿀 수 있어요.';
    var tab = document.querySelector('.tabs .st[data-sheet="work"]').getBoundingClientRect();
    memo.style.left = Math.min(window.innerWidth - 260, tab.left + 10) + 'px'; memo.style.bottom = (window.innerHeight - tab.top + 8) + 'px';
    memo.style.position = 'fixed'; document.body.appendChild(memo);
    setTimeout(function(){ memo.classList.add('hide'); setTimeout(function(){ memo.remove(); }, 500); }, 6500);
    memo.addEventListener('click', function(){ memo.remove(); });
    localStorage.setItem('bung_excel_memo', '1'); localStorage.setItem('bung_excel_rename_hint', '1');
  } else if (!localStorage.getItem('bung_excel_rename_hint')) {
    // 예전에 사용법 메모를 본 사람에게는 이름 바꾸기만 한 번 알려줘요
    var hint = document.createElement('div'); hint.className = 'rename-hint';
    hint.innerHTML = '<b>새 기능</b> · 위쪽 <u>파일 이름</u>을 누르거나, 선택된 <u>시트 탭</u>을 한 번 더 누르면 내 업무에 맞게 이름을 바꿀 수 있어요.';
    document.body.appendChild(hint); hint.addEventListener('click', function(){ hint.remove(); });
    setTimeout(function(){ hint.classList.add('hide'); setTimeout(function(){ hint.remove(); }, 500); }, 7000);
    localStorage.setItem('bung_excel_rename_hint', '1');
  }
} catch (e) {}
})();
</script>
